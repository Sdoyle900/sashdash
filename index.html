<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SashDash</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SashDash" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0f172a;--navy2:#1e293b;--indigo:#4f46e5;--indigo2:#4338ca;--sky:#0ea5e9;--green:#16a34a;--red:#dc2626;--amber:#d97706;--slate:#64748b;--slate2:#94a3b8;--border:#e2e8f0;--bg:#f1f5f9;--white:#ffffff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
    html,body{height:100%}
    body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
    button{font-family:inherit}
    .hidden{display:none!important}

    /* buttons — same family as RackTrack */
    .btn-primary{background:var(--indigo);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
    .btn-primary:hover{background:var(--indigo2)}
    .btn-primary:disabled{opacity:.6;cursor:default}
    .btn-primary.full{width:100%;padding:13px;font-size:15px}
    .btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{border-color:var(--indigo);color:var(--indigo)}
    .btn-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
    .btn-danger:hover{background:#fef2f2}
    .btn-ghost{background:transparent;color:var(--slate2);border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .btn-ghost:hover{color:#fff;background:rgba(255,255,255,.1)}

    /* login */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
    .auth-card{background:var(--white);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .auth-sd{display:block;height:58px;margin:0 auto 18px}
    .brand{display:flex;align-items:center;gap:9px}
    .brand svg{flex:none}
    .brand-text{font-size:22px;font-weight:400;letter-spacing:1px;color:var(--navy)}
    .brand-text strong{font-weight:900;color:var(--indigo)}
    .auth-card .brand{justify-content:center;margin-bottom:4px}
    .auth-sub{color:var(--slate);font-size:13px;margin-bottom:22px;text-align:center}
    .auth-footer{color:var(--slate2);font-size:12px;text-align:center;margin-top:16px}
    .auth-error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .field-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .field-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate)}
    .field-group input,.field-group select,.field-group textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#f8fafc;color:var(--navy);width:100%}
    .field-group input:focus,.field-group select:focus,.field-group textarea:focus{outline:none;border-color:var(--indigo);background:#fff}
    .optional{font-weight:400;text-transform:none;color:var(--slate2);font-size:11px}

    /* header */
    .app-header{background:var(--navy);position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);padding-top:var(--safe-t)}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px;height:58px}
    .header-inner .brand-text{color:#fff;font-size:18px}
    .header-inner .brand-text strong{color:#818cf8}
    .sd-chip{height:30px;padding:3px 9px;background:#fff;border-radius:6px;margin-left:8px}
    .header-tabs{display:flex;gap:4px;margin-left:12px}
    .tab{background:transparent;color:#94a3b8;border:none;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .tab:hover{color:#fff;background:rgba(255,255,255,.08)}
    .tab.active{background:var(--indigo);color:#fff}
    .header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .user-name{color:#cbd5e1;font-size:13px;font-weight:600}
    .role-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#312e81;color:#c7d2fe;letter-spacing:.5px}

    /* "View as" */
    .viewas-btn{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
    .viewas-btn:hover{background:rgba(255,255,255,.18)}
    body.previewing .viewas-btn{background:#f59e0b;border-color:#f59e0b;color:#1f2937}
    .va-menu{min-width:270px;max-height:70vh;overflow:auto}
    .va-menu button{display:flex;align-items:center;gap:10px}
    .va-menu button small{display:block;font-size:11px;color:var(--slate)}
    .va-menu button.on{background:#fef3c7}
    .va-h{font-size:12px;font-weight:800;color:var(--navy);padding:8px 12px 4px}
    .va-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);padding:8px 12px 2px}
    .va-exit{color:var(--indigo)!important;font-weight:700}
    .preview-banner{background:#f59e0b;color:#1f2937;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px;position:sticky;top:calc(58px + var(--safe-t));z-index:46;flex-wrap:wrap;text-align:center}
    .preview-banner button{background:#1f2937;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:800;cursor:pointer}
    body.previewing .dept-bar{top:calc(96px + var(--safe-t))}
    body.previewing .composer textarea{background:#f1f5f9}
    body.previewing .job-view .jv-bar{box-shadow:inset 0 -4px 0 #f59e0b}
    @media (max-width:720px){ .viewas-btn .lbl{display:none} .preview-banner{font-size:12px;gap:8px} }
    /* department switch — Sites / Private Calls */
    .dept-bar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(58px + var(--safe-t));z-index:45;box-shadow:0 2px 6px rgba(15,23,42,.05)}
    .dept-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:10px}
    .dept-btn{position:relative;flex:1;max-width:280px;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid var(--border);background:#f8fafc;border-radius:12px;padding:11px 16px;font-weight:800;font-size:16px;color:var(--slate);cursor:pointer;transition:all .12s}
    .dept-btn:hover{border-color:#cbd5e1;color:var(--navy)}
    .dept-btn .di{font-size:20px}
    .dept-btn .dc{background:#e2e8f0;color:var(--navy);font-size:12px;padding:1px 8px;border-radius:20px}
    .dept-btn.on.d-sites{background:var(--navy);border-color:var(--navy);color:#fff}
    .dept-btn.on.d-calls{background:#b45309;border-color:#b45309;color:#fff}
    .dept-btn.on .dc{background:rgba(255,255,255,.22);color:#fff}
    .dept-btn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px}
    .tag.amber{background:#fef3c7;color:#92400e}
    .modal:has(.team-row){max-width:700px}
    .tr-role{padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;min-width:0}
    .tr-depts{grid-column:2 / -1;display:flex;gap:16px;font-size:13px;font-weight:600;color:var(--navy)}
    .tr-depts label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .tr-depts.muted{opacity:.4}
    @media (max-width:720px){ .dept-inner{padding:8px 12px;gap:8px} .dept-btn{font-size:14px;padding:10px 8px;gap:6px} .dept-btn .di{font-size:17px} }
    .page{max-width:1400px;margin:0 auto;padding:22px 20px calc(40px + var(--safe-b))}
    .page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
    .page-sub{color:var(--slate);font-size:13px;margin-top:2px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .spacer{flex:1}

    /* dashboard */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
    .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
    .stat .n{font-size:26px;font-weight:900;letter-spacing:-.5px}
    .stat .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate)}
    .meter{height:6px;background:#e2e8f0;border-radius:4px;margin-top:8px;overflow:hidden}
    .meter > div{height:100%;background:var(--indigo);border-radius:4px}
    .section-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);margin:4px 0 10px}
    .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:26px}
    .tech-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s;border-top:4px solid var(--c,#4f46e5)}
    .tech-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.08)}
    .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;background:var(--c,#4f46e5)}
    .avatar.sm{width:28px;height:28px;font-size:11px}
    .tech-card .name{font-weight:800;font-size:16px}
    .tech-card .phone{color:var(--slate);font-size:12px}
    .tech-nums{display:flex;gap:6px;margin-top:14px}
    .tech-nums div{flex:1;background:#f8fafc;border-radius:8px;padding:8px;text-align:center}
    .tech-nums b{display:block;font-size:18px;font-weight:900}
    .tech-nums span{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--slate);letter-spacing:.5px}
    .new-pill{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
    .activity{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .act-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer}
    .act-row:last-child{border-bottom:none}
    .act-row:hover{background:#f8fafc}
    .act-main{flex:1;min-width:0}
    .act-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .act-meta{color:var(--slate);font-size:12px}

    /* portal */
    .crumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
    .crumbs::-webkit-scrollbar{display:none}
    .team-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--border);border-radius:30px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;position:relative}
    .team-chip.active{border-color:var(--navy);background:var(--navy);color:#fff}
    .team-chip .dot{position:absolute;top:0;right:2px}
    .site-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);margin:20px 0 8px}
    .week-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:10px 12px;margin-top:16px}
    .wk-nav{width:40px;height:40px;border-radius:10px;border:1.5px solid #fdba74;background:#fff;font-size:22px;font-weight:800;color:#9a3412;cursor:pointer;flex:none}
    .wk-nav:disabled{opacity:.3;cursor:default}
    .wk-label{display:flex;flex-direction:column;line-height:1.25}
    .wk-label b{font-size:16px;color:#7c2d12}
    .wk-label span{font-size:12px;color:#9a3412}
    .wk-new{background:#b45309} .wk-new:hover{background:#92400e}
    .day-tab{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
    .day-tab b{font-size:16px} .day-tab small{font-size:12px;font-weight:600;opacity:.75}
    .site-tab .today{font-size:10px;font-weight:900;letter-spacing:.5px;background:#f59e0b;color:#fff;padding:2px 6px;border-radius:6px}
    .wk-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .wk-choice label{border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-weight:700;color:var(--navy);text-transform:none;letter-spacing:0;cursor:pointer}
    .wk-choice label:has(input:checked){border-color:#b45309;background:#fff7ed}
    .wk-choice small{font-weight:500;color:var(--slate);font-size:12px}
    .wk-choice input[type=date]{margin-top:6px;width:100%;font-size:13px;padding:4px}
    .field-group input[type=radio],.field-group input[type=checkbox]{width:auto;flex:none;margin:0}
    .wk-choice input[type=radio]{display:block;margin:0 0 4px}
    label.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);text-transform:none;letter-spacing:0;margin-bottom:4px;cursor:pointer}
    @media (max-width:720px){ .wk-choice{grid-template-columns:1fr} .week-bar .spacer{display:none} .week-bar .btn-primary,.week-bar .btn-danger{flex:1;justify-content:center} }
    .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
    .slot,.slot-new{position:relative;min-height:190px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;cursor:pointer}
    .slot{background:#fff;border:2px solid var(--border);transition:transform .12s,box-shadow .12s,border-color .12s}
    .slot:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.08);border-color:#c7d2fe}
    .slot.unread{border-color:#fca5a5}
    .slot.done{background:#f0fdf4;border-color:#bbf7d0}
    .slot-top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center}
    .slot-no{font-size:12px;font-weight:900;letter-spacing:1px;background:var(--navy);color:#fff;padding:3px 9px;border-radius:7px}
    .slot.done .slot-no{background:var(--green)}
    .slot-pdf{font-size:44px;line-height:1;margin-top:14px}
    .slot-title{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .slot-actions{position:absolute;bottom:10px;right:10px;display:flex;gap:4px}
    .slot-actions .ja-btn{padding:4px 8px}
    .slot-new{border:2.5px dashed #fdba74;background:#fff7ed;color:#9a3412}
    .slot-new:hover{border-color:#b45309;background:#ffedd5}
    .slot-new.over{border-style:solid;border-color:#b45309;background:#fed7aa;transform:scale(1.03)}
    .slot-new.busy{pointer-events:none;opacity:.8}
    .slot-new .slot-no{background:#b45309}
    .slot-plus{font-size:40px;font-weight:300;line-height:1}
    .slot-hint{font-size:13px;font-weight:600}
    @media (max-width:720px){ .slot-grid{grid-template-columns:repeat(2,1fr)} .slot,.slot-new{min-height:160px} }
    .site-tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 16px;margin:0 -6px -8px;scrollbar-width:none}
    .site-tabs::-webkit-scrollbar{display:none}
    .site-tab{position:relative;background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px 18px;font-weight:800;font-size:16px;color:var(--navy);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:10px;min-height:54px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:border-color .12s,background .12s,transform .12s}
    .site-tab:hover{border-color:#a5b4fc;transform:translateY(-1px)}
    .site-tab .pin{font-size:18px}
    .site-tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35)}
    .site-tab .cnt{background:#eef2ff;color:var(--indigo);font-size:13px;font-weight:800;min-width:26px;text-align:center;padding:2px 8px;border-radius:20px}
    .site-tab.active .cnt{background:rgba(255,255,255,.22);color:#fff}
    .site-tab .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px}
    .site-tab.add{border-style:dashed;color:var(--indigo);background:#f8fafc;box-shadow:none}
    .site-tab.add:hover{background:#eef2ff}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;flex:none;box-shadow:0 0 0 2px #fff}
    .site-head{background:#fff;border:1px solid var(--border);border-left:5px solid var(--indigo);border-radius:12px;margin-top:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .site-name{font-size:18px;font-weight:800}
    .site-meta{color:var(--slate);font-size:13px}
    .seg{display:inline-flex;background:#e2e8f0;border-radius:8px;padding:3px}
    .seg button{border:none;background:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:12px;color:var(--slate);cursor:pointer}
    .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .job-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .job-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer}
    .job-card:hover{border-color:#c7d2fe}
    .job-card.unread{border-left:4px solid var(--red)}
    .job-actions{display:flex;gap:6px;flex:none}
    .ja-btn{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--navy);cursor:pointer;white-space:nowrap}
    .ja-btn:hover{border-color:var(--indigo);color:var(--indigo)}
    .ja-btn.red{color:var(--red)}
    .ja-btn.red:hover{border-color:#fca5a5;background:#fef2f2;color:var(--red)}
    @media (max-width:720px){ .ja-btn .lbl{display:none} .ja-btn{padding:6px 9px} }
    .job-card.done{opacity:.72}
    .tick{width:26px;height:26px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:#fff}
    .tick.on{background:var(--green);border-color:var(--green)}
    .job-title{font-weight:800;font-size:15px}
    .job-card.done .job-title{text-decoration:line-through;text-decoration-color:#94a3b8}
    .job-meta{color:var(--slate);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
    .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f1f5f9;color:var(--slate)}
    .tag.green{background:#dcfce7;color:#166534}
    .tag.red{background:#fee2e2;color:#991b1b}
    .tag.indigo{background:#e0e7ff;color:#3730a3}
    .empty{text-align:center;color:var(--slate);padding:46px 20px;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;margin-top:14px}
    .empty .big{font-size:36px;margin-bottom:6px}

    /* job view */
    .job-view{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
    .jv-bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 14px 8px;min-height:58px}
    .jv-back{background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
    .jv-title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .jv-sub{font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .done-btn{border:2px solid #475569;background:transparent;color:#e2e8f0;padding:7px 14px;border-radius:30px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
    .done-btn .box{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px}

</head>

function toast(msg,ms=2800){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),ms);}
function fmtDate(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('en-IE',{day:'numeric',month:'short'});}
function fmtWhen(ts){const d=new Date(ts),now=new Date();const t=d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===now.toDateString()?t:d.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+' '+t;}
function fmtBytes(b){if(!b)return '0 MB';if(b<1024*1024)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(b<10*1048576?1:0)+' MB';}
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function prof(id){return profiles.find(p=>p.id===id)||{full_name:'Unknown',colour:'#64748b'};}
function inDept(p,d){return d==='calls'?p.on_calls!==false:p.on_sites!==false;}
function techs(d=dept){return profiles.filter(p=>p.role==='serviceman'&&inDept(p,d));}
function deptOf(x){return (x&&x.department)||'sites';}
function dSites(d=dept){return sites.filter(s=>deptOf(s)===d);}
function dJobs(d=dept){return jobs.filter(j=>deptOf(j)===d);}
function filePrefix(d,techId){return (d==='calls'?'calls/':'')+techId;}
// ── Dates for the 6-day week (Mon–Sat) ──
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }
function dayLabel(s){ return parseYmd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}); }
function dayLong(s){ return parseYmd(s).toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'}); }
function todayYmd(){ return ymd(new Date()); }
function roleLabel(r){return r==='admin'?'Office':r==='service_office'?'Service dept':'';}
function firstName(n){return (n||'').split(' ')[0];}
function unreadForMe(j){return isOffice?j.admin_unread:j.tech_unread;}
function msgCount(j){return (j.comments&&j.comments[0]&&j.comments[0].count)||0;}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));}
function sashIcon(size,colour){return `<svg width="${size}" height="${size}" style="color:${colour}"><use href="#sash"/></svg>`;}

// ── Boot ───────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (SUPABASE_URL.includes('YOUR-PROJECT')) {
    showAuthError('SashDash isn\'t connected to Supabase yet — add your project URL and anon key at the top of the script in index.html.');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth:{ autoRefreshToken:true, persistSession:true, detectSessionInUrl:false }
  });
  $('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
  $('auth-user').addEventListener('keydown', e=>{ if(e.key==='Enter') $('auth-password').focus(); });
  $('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && window.innerWidth>900){ e.preventDefault(); sendMessage(); } });
  window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(job&&pdfDoc) renderPdf(); },250); });
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('click', e=>{ if(!e.target.closest('.menu-wrap')){ $('jv-menu').classList.add('hidden'); $('viewas-menu').classList.add('hidden'); } });
  window.addEventListener('popstate', ()=>{ if(job) closeJob(true); });
  const cp=document.querySelector('.chat-pane');
  cp.addEventListener('dragover',e=>{ if(hasFiles(e)){ e.preventDefault(); cp.classList.add('drop-photo'); } });
  cp.addEventListener('dragleave',e=>{ if(!cp.contains(e.relatedTarget)) cp.classList.remove('drop-photo'); });
  cp.addEventListener('drop',e=>{ if(hasFiles(e)){ e.preventDefault(); cp.classList.remove('drop-photo'); sendPhotos(e.dataTransfer.files); } });
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session && session.user) await startApp(session.user);
  } catch(e){ console.error(e); }
});

// ── Auth ───────────────────────────────────────────────────────────
function showAuthError(m){const e=$('auth-error');e.textContent=m;e.classList.remove('hidden');}
async function signIn(){
  let user=$('auth-user').value.trim().toLowerCase(); const pass=$('auth-password').value;
  $('auth-error').classList.add('hidden');
  if(!user||!pass) return showAuthError('Please enter your username and password.');
  if(!user.includes('@')) user = user.replace(/\s+/g,'.') + '@' + LOGIN_DOMAIN;
  const btn=$('sign-in-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Signing in…';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email:user, password:pass });
    if(error) throw error;
    await startApp(data.user);
  }catch(e){ showAuthError(e.message==='Invalid login credentials'?'Wrong username or password.':('Could not sign in: '+e.message)); }
  btn.disabled=false; btn.textContent='Sign In';
}
async function signOut(){
  if(dirty && !confirm('You have unsaved mark-up. Sign out anyway?')) return;
  dirty=false; if(realtime) sb.removeChannel(realtime); realtime=null;
  await sb.auth.signOut();
  me=null; realMe=null; previewing=false; document.body.classList.remove('previewing'); $('preview-banner').classList.add('hidden'); job=null; $('job-view').classList.add('hidden');
  $('app').classList.add('hidden'); $('auth-screen').classList.remove('hidden');
  $('auth-password').value='';
}
// Who the screen is drawn for. Normally you; in "View as" it's the person picked.
function applyIdentity(p){
  me=p; isAdmin = p.role==='admin'; isCallsOffice = p.role==='service_office'; isOffice = isAdmin||isCallsOffice;
  dept = isCallsOffice ? 'calls' : (p.role==='serviceman' && p.on_sites===false ? 'calls' : 'sites');
  currentTechId=null; currentSiteId=null; calWeek=null; jobFilter='open';
  $('user-name').textContent = realMe.full_name || '';
  $('role-badge').classList.toggle('hidden', !(realMe.role!=='serviceman')); $('role-badge').textContent = realMe.role==='service_office'?'SERVICE DEPT':'OFFICE';
  $('admin-nav').classList.toggle('hidden', !isOffice);
  document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden', !isOffice));
  $('viewas-wrap').classList.toggle('hidden', realMe.role!=='admin');
  document.body.classList.toggle('previewing', previewing);
  const bn=$('preview-banner');
  if(previewing){ bn.classList.remove('hidden');
    bn.innerHTML=`<span>👁 Viewing as <b>${esc(p.full_name)}</b> — ${p.role==='serviceman'?'exactly what he sees on his phone':p.role==='service_office'?'what the service department sees':'their view'}. View-only.</span><button onclick="exitViewAs()">✕ Exit</button>`;
  } else bn.classList.add('hidden');
}
// ── "View as" (office only) ───────────────────────────────────────
function toggleViewAs(e){ e.stopPropagation(); const m=$('viewas-menu');
  if(m.classList.contains('hidden')) renderViewAsMenu(); m.classList.toggle('hidden'); }
function renderViewAsMenu(){
  const men=profiles.filter(p=>p.role==='serviceman'), offices=profiles.filter(p=>p.role==='service_office');
  const item=p=>`<button class="${previewing&&me.id===p.id?'on':''}" onclick="enterViewAs('${p.id}')"><span class="avatar sm" style="--c:${esc(p.colour)}">${esc(initials(p.full_name))}</span><span>${esc(p.full_name)}<small>${p.role==='service_office'?'Service department':[p.on_sites!==false?'Sites':'',p.on_calls!==false?'Private Calls':''].filter(Boolean).join(' + ')}</small></span></button>`;
  $('viewas-menu').innerHTML=`<div class="va-h">View SashDash as…</div>
    ${previewing?`<button onclick="exitViewAs()" class="va-exit">↩ Back to my own view</button>`:''}
    ${men.length?`<div class="va-sub">Service men</div>${men.map(item).join('')}`:''}
    ${offices.length?`<div class="va-sub">Service department</div>${offices.map(item).join('')}`:''}`;
}
async function enterViewAs(id){
  $('viewas-menu').classList.add('hidden');
  const p=profiles.find(x=>x.id===id); if(!p) return;
  if(job){ dirty=false; closeJob(); }
  previewing=true; applyIdentity(p);
  await loadData(); renderDeptBar();
  if(isOffice) showDashboard(); else openPortal(me.id);
  window.scrollTo(0,0);
}
async function exitViewAs(){
  $('viewas-menu').classList.add('hidden');
  if(job){ dirty=false; closeJob(); }
  previewing=false; applyIdentity(realMe);
  await loadData(); renderDeptBar(); showDashboard();
}
// While viewing as someone, nothing can be changed in their name
function blockPreview(){ if(!previewing) return false; toast('View-only — exit "View as" to make changes'); return true; }

async function startApp(user){
  const { data:p, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(error||!p){ await sb.auth.signOut(); return showAuthError('Your login isn\'t set up yet — ask the office to finish adding you.'); }
  realMe=p; previewing=false;
  applyIdentity(p);
  $('auth-screen').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadData();
  renderDeptBar();
  if(isOffice) showDashboard(); else openPortal(me.id);
  subscribeRealtime();
}

// ── Data ───────────────────────────────────────────────────────────
async function loadData(){
  const [pr, si, jo] = await Promise.all([
    sb.from('profiles').select('*').order('sort_order').order('full_name'),
    sb.from('sites').select('*').order('created_at'),
    sb.from('jobs').select(JOB_COLS+',comments(count)').order('created_at',{ascending:false})
  ]);
  const err = pr.error||si.error||jo.error;
  if(err){ toast('Could not load: '+err.message, 5000); return; }
  profiles=pr.data; sites=si.data; jobs=jo.data;
  if(previewing){   // show only what that person's own login is allowed to see
    if(me.role==='serviceman'){ sites=sites.filter(x=>x.serviceman_id===me.id); jobs=jobs.filter(x=>x.serviceman_id===me.id); }
    else if(me.role==='service_office'){ sites=sites.filter(x=>deptOf(x)==='calls'); jobs=jobs.filter(x=>deptOf(x)==='calls'); }
    const fresh=profiles.find(x=>x.id===me.id); if(fresh) me=fresh;
  }
  if(job){ const fresh=jobs.find(j=>j.id===job.id); if(fresh){ job={...job,...fresh}; updateJobHeader(); } }
}
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(async()=>{ await loadData(); rerenderCurrent(); },500);
}
function rerenderCurrent(){
  if(!me) return;
  if(!$('view-dashboard').classList.contains('hidden')) renderDashboard();
  if(!$('view-portal').classList.contains('hidden')) renderPortal();
  renderDeptBar();
}
function subscribeRealtime(){
  if(realtime) sb.removeChannel(realtime);
  realtime = sb.channel('sashdash-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'jobs'}, payload=>{
      scheduleReload();
      if(job && payload.new && payload.new.id===job.id && payload.eventType==='UPDATE' && !dirty){
        refreshOpenJobMarkup();
      }
      if(job && payload.eventType==='DELETE' && payload.old && payload.old.id===job.id){ toast('This job was deleted by the office.'); closeJob(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'}, payload=>{
      const c=payload.new;
      if(job && c.job_id===job.id){ appendComment(c,true); if(!previewing) sb.rpc('mark_job_seen',{p_job:job.id}); }
      scheduleReload();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sites'}, ()=>scheduleReload())
    .subscribe();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && me) scheduleReload(); });

// ── Navigation ─────────────────────────────────────────────────────
function setNav(v){ document.querySelectorAll('#admin-nav .tab').forEach(b=>b.classList.toggle('active', b.dataset.v===v)); }
function goHome(){ if(!me) return; if(isOffice) showDashboard(); else openPortal(me.id); }
function showDashboard(){
  $('view-portal').classList.add('hidden'); $('view-dashboard').classList.remove('hidden');
  setNav('dashboard'); renderDashboard(); window.scrollTo(0,0);
}

// ── Department switch: Sites / Private Calls ─────────────────────
function deptsForMe(){
  if(isAdmin) return ['sites','calls'];
  if(isCallsOffice) return ['calls'];
  const d=[]; if(me.on_sites!==false||sites.some(s=>deptOf(s)==='sites')) d.push('sites');
  if(me.on_calls!==false&&(sites.some(s=>deptOf(s)==='calls')||me.on_calls===true)) d.push('calls');
  return d.length?d:['sites'];
}
function renderDeptBar(){
  const bar=$('dept-bar'); if(!bar||!me) return;
  const ds=deptsForMe(); if(!ds.includes(dept)) dept=ds[0];
  if(ds.length<2){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  bar.innerHTML=`<div class="dept-inner">${ds.map(d=>{
    const dj=dJobs(d).filter(j=>isOffice||j.serviceman_id===me.id), open=dj.filter(j=>!j.completed).length, news=dj.some(unreadForMe);
    return `<button class="dept-btn ${d===dept?'on':''} d-${d}" onclick="setDept('${d}')">${news?'<span class="dot"></span>':''}<span class="di">${DEPT[d].icon}</span>${DEPT[d].label}<span class="dc">${open}</span></button>`;}).join('')}</div>`;
}
function setDept(d){
  if(d===dept) return;
  dept=d; currentSiteId=null; jobFilter='open';
  renderDeptBar();
  if(isOffice){
    if(!$('view-portal').classList.contains('hidden')){
      if(!techs().some(t=>t.id===currentTechId)) currentTechId=(techs()[0]||{}).id||null;
      if(currentTechId) renderPortal(); else showDashboard();
    } else renderDashboard();
  } else renderPortal();
  window.scrollTo(0,0);
}

// ── Dashboard (office) ────────────────────────────────────────────
function renderDashboard(){
  const allJobs=jobs, jobs_=dJobs(), sites_=dSites();
  return renderDashboardFor(jobs_, sites_, allJobs);
}
function renderDashboardFor(jobs, sites, allJobs){
  const D=DEPT[dept];
  const open=jobs.filter(j=>!j.completed).length;
  const weekAgo=Date.now()-7*864e5;
  const doneWeek=jobs.filter(j=>j.completed&&j.completed_at&&new Date(j.completed_at)>weekAgo).length;
  const unread=jobs.filter(j=>j.admin_unread).length;
  const bytes=allJobs.reduce((s,j)=>s+(+j.pdf_bytes||0)+(+j.marked_bytes||0),0);
  const pct=Math.min(100,bytes/FREE_STORAGE_BYTES*100);
  const team=techs();
  const cards = team.map(t=>{
    const tj=jobs.filter(j=>j.serviceman_id===t.id);
    const nNew=tj.filter(j=>j.admin_unread).length;
    return `<div class="tech-card" style="--c:${esc(t.colour)}" onclick="openPortal('${t.id}')">
      ${nNew?`<span class="new-pill">${nNew} new</span>`:''}
      <div class="row" style="flex-wrap:nowrap"><div class="avatar">${esc(initials(t.full_name))}</div>
        <div style="min-width:0"><div class="name">${esc(t.full_name||'Unnamed')}</div><div class="phone">${t.phone?esc(t.phone):'&nbsp;'}</div></div></div>
      <div class="tech-nums">
        <div><b>${sites.filter(s=>s.serviceman_id===t.id).length}</b><span>${D.many}</span></div>
        <div><b>${tj.filter(j=>!j.completed).length}</b><span>Open</span></div>
        <div><b>${tj.filter(j=>j.completed).length}</b><span>Done</span></div>
      </div></div>`;
  }).join('');
  const recent=[...jobs].sort((a,b)=>new Date(b.last_activity_at)-new Date(a.last_activity_at)).slice(0,8);
  const act = recent.map(j=>{const t=prof(j.serviceman_id), s=sites.find(x=>x.id===j.site_id)||{};
    return `<div class="act-row" onclick="openJob('${j.id}')">
      <div class="avatar sm" style="--c:${esc(t.colour)}">${esc(initials(t.full_name))}</div>
      <div class="act-main"><div class="act-title">${esc(j.title)}</div><div class="act-meta">${esc(t.full_name)} · ${esc(s.name||'')} · ${fmtWhen(j.last_activity_at)}</div></div>
      ${j.admin_unread?'<span class="tag red">New</span>':''}${j.completed?'<span class="tag green">Done</span>':''}
    </div>`;}).join('');
  $('view-dashboard').innerHTML = `
    <div class="row"><div><div class="page-title">${D.icon} ${D.label} team</div><div class="page-sub">Tap a man to open his ${D.label} portal and upload jobs.</div></div>
      <span class="spacer"></span>${isAdmin?'<button class="btn-outline" onclick="openTeamModal()">👥 Manage team</button>':''}</div>
    <div class="stats">
      <div class="stat"><div class="n">${open}</div><div class="l">Open jobs</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${doneWeek}</div><div class="l">Completed this week</div></div>
      <div class="stat"><div class="n" style="color:${unread?'var(--red)':'inherit'}">${unread}</div><div class="l">Jobs with news</div></div>
      <div class="stat"><div class="n" style="font-size:20px;padding-top:4px">${fmtBytes(bytes)}</div><div class="l">Storage used of 1 GB</div><div class="meter"><div style="width:${pct.toFixed(1)}%"></div></div></div>
    </div>
    <div class="section-h">Team</div>
    ${team.length?`<div class="team-grid">${cards}</div>`:`<div class="empty" style="margin-bottom:24px"><div class="big">👷</div>No men in ${D.label} yet.${isAdmin?' Click <b>Manage team</b> to add them.':' Ask the office to add them.'}</div>`}
    <div class="section-h">Latest activity</div>
    ${recent.length?`<div class="activity">${act}</div>`:`<div class="empty">Nothing yet — upload a job to get started.</div>`}`;
}

// ── Portal (one service man's jobs, split into site tabs) ──────────
function openPortal(techId, siteId){
  if(!techId){ if(isOffice){ toast('Add a service man first.'); } return; }
  if(techId!==currentTechId) currentSiteId=null;
  currentTechId=techId; if(siteId) currentSiteId=siteId;
  $('view-dashboard').classList.add('hidden'); $('view-portal').classList.remove('hidden');
  setNav('portal'); renderPortal(); window.scrollTo(0,0);
}
function setSite(id){ currentSiteId=id; renderPortal(); }
function setFilter(f){ jobFilter=f; renderPortal(); }
function renderPortal(){
  const t=prof(currentTechId);
  const D=DEPT[dept];
  const mySites=dSites().filter(s=>s.serviceman_id===currentTechId);
  // Private Calls: day tabs grouped into 6-day weeks, plus any undated customers
  const dated=mySites.filter(s=>s.work_date).sort((a,b)=>a.work_date<b.work_date?-1:1);
  const undated=mySites.filter(s=>!s.work_date);
  const weeks=[...new Set(dated.map(s=>ymd(mondayOf(parseYmd(s.work_date)))))].sort();
  if(dept==='calls' && weeks.length && !weeks.includes(calWeek)){
    const thisWk=ymd(mondayOf(new Date()));
    calWeek = weeks.includes(thisWk) ? thisWk : (weeks.find(w=>w>thisWk) || weeks[weeks.length-1]);
  }
  const weekDays = dept==='calls' && calWeek ? dated.filter(s=>ymd(mondayOf(parseYmd(s.work_date)))===calWeek) : [];
  const visible = dept==='calls' ? [...weekDays, ...undated] : mySites;
  if(!visible.find(s=>s.id===currentSiteId)){
    const today=weekDays.find(s=>s.work_date===todayYmd());
    currentSiteId=(today||visible[0]||{}).id||null;
  }
  const site=visible.find(s=>s.id===currentSiteId);
  const tJobs=dJobs().filter(j=>j.serviceman_id===currentTechId);

  let html='';
  if(isOffice){
    html+=`<div class="crumbs">${techs().map(x=>{const n=dJobs().filter(j=>j.serviceman_id===x.id&&j.admin_unread).length;
      return `<button class="team-chip ${x.id===currentTechId?'active':''}" onclick="openPortal('${x.id}')"><span class="avatar sm" style="--c:${esc(x.colour)}">${esc(initials(x.full_name))}</span>${esc(firstName(x.full_name))}${n?'<span class="dot"></span>':''}</button>`;}).join('')}</div>`;
    html+=`<div class="row"><div><div class="page-title">${esc(t.full_name)} · ${D.label}</div><div class="page-sub">${tJobs.filter(j=>!j.completed).length} open · ${tJobs.filter(j=>j.completed).length} completed${t.phone?' · '+esc(t.phone):''}</div></div></div>`;
  } else {
    const open=tJobs.filter(j=>!j.completed).length;
    html+=`<div class="page-title">Hi ${esc(firstName(me.full_name))} 👋</div><div class="page-sub">${D.label}: ${open} open job${open===1?'':'s'}${dept==='calls'?'':` across ${mySites.length} ${mySites.length===1?D.one:D.many.toLowerCase()}`}</div>`;
  }

  if(dept==='calls'){
    const wi=weeks.indexOf(calWeek);
    html+=`<div class="week-bar">
      ${weeks.length?`<button class="wk-nav" ${wi<=0?'disabled':''} onclick="setWeek(${wi-1})" aria-label="Previous week">‹</button>
      <div class="wk-label"><b>Week of ${parseYmd(calWeek).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})}</b><span>Mon – Sat${calWeek===ymd(mondayOf(new Date()))?' · this week':''}</span></div>
      <button class="wk-nav" ${wi>=weeks.length-1?'disabled':''} onclick="setWeek(${wi+1})" aria-label="Next week">›</button>`:`<div class="wk-label"><b>No weeks yet</b><span>Create a 6-day week to get a tab for each day</span></div>`}
      <span class="spacer"></span>
      ${isOffice?`${weeks.length?`<button class="btn-danger" onclick="deleteWeek()">🗑 Delete week</button>`:''}<button class="btn-primary wk-new" onclick="openWeekModal()">📅 New 6-day week</button>`:''}
    </div>`;
  }
  html+=`<div class="site-label">${dept==='calls'?'Days':D.many}</div><div class="site-tabs">${visible.map(s=>{const sj=tJobs.filter(j=>j.site_id===s.id);const o=sj.filter(j=>!j.completed).length;const u=sj.some(unreadForMe);

  </div>`;
  // Private Calls day: numbered job boxes — Job 1, Job 2, Job 3… plus a drop box for the next one
  if(site.work_date){
    const ordered=[...sJobs].sort((a,b)=>a.created_at<b.created_at?-1:1);
    const num=new Map(ordered.map((j,i)=>[j.id, jobNo(j)||i+1]));

    const next=nextJobNo(site.id);

    $('view-portal').innerHTML=html; attachSlotDrop(); return;

    : `<div class="empty"><div class="big">${jobFilter==='done'?'📋':'✅'}</div>${jobFilter==='done'?`No completed jobs for this ${D.one} yet.`:jobFilter==='open'?`All jobs for this ${D.one} are done.`:`No jobs for this ${D.one} yet.`}${isOffice&&jobFilter!=='done'?'<br><br><button class="btn-primary" onclick="openUploadModal()">⬆ Upload job</button>':''}</div>`;
  $('view-portal').innerHTML=html;
}
function jobNo(j){ const m=/^job\s*(\d+)/i.exec(j.title||''); return m?+m[1]:null; }
function nextJobNo(siteId){ const sj=jobs.filter(j=>j.site_id===siteId); return Math.max(sj.length, ...sj.map(j=>jobNo(j)||0))+1; }
function slotCard(j,n){
  const u=unreadForMe(j), c=msgCount(j);
  const extra=(j.title||'').replace(/^job\s*\d+\s*[-–·:]?\s*/i,'');
  return `<div class="slot ${j.completed?'done':''} ${u?'unread':''}" onclick="openJob('${j.id}')">
    <div class="slot-top"><span class="slot-no">JOB ${n}</span>${u?'<span class="tag red">New</span>':''}${j.completed?'<span class="tag green">✓ Done</span>':''}</div>
    <div class="slot-pdf">📄</div>
    <div class="slot-title">${extra?esc(extra):'Work sheet'}</div>
    <div class="job-meta" style="justify-content:center">${c?`<span>💬 ${c}</span>`:''}${j.marked_path?'<span>✏️ Marked</span>':''}</div>
    ${isOffice?`<div class="slot-actions"><button class="ja-btn" onclick="event.stopPropagation();editJob('${j.id}')" title="Rename / replace PDF">✎</button><button class="ja-btn red" onclick="event.stopPropagation();deleteJob('${j.id}')" title="Delete">🗑</button></div>`:''}
  </div>`;
}
function attachSlotDrop(){
  const z=$('slot-new'); if(!z) return; let depth=0;
  z.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; z.classList.add('over'); });
  z.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  z.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) z.classList.remove('over'); });
  z.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; z.classList.remove('over'); slotUpload(e.dataTransfer.files); });
}
async function slotUpload(fl){ if(blockPreview()) return;
  const files=Array.from(fl||[]).filter(f=>f.type==='application/pdf'||f.type.startsWith('image/')||/\.(pdf|jpe?g|png|heic)$/i.test(f.name));

function jobCard(j){

async function createWeek(){
  let v=document.querySelector('input[name=wk]:checked').value;
  if(v==='pick'){ const d=$('m-wk-date').value; if(!d) return toast('Pick a date in the week you want.'); v=d; }
  const mon=mondayOf(parseYmd(v));
  const who=(document.querySelector('input[name=who]:checked')||{}).value==='all' ? techs('calls').map(x=>x.id) : [currentTechId];
  const rows=[];
  for(const tid of who){
    for(let i=0;i<6;i++){
      const day=ymd(addDays(mon,i));
      if(sites.some(s=>s.serviceman_id===tid&&deptOf(s)==='calls'&&s.work_date===day)) continue;   // already there
      rows.push({serviceman_id:tid, department:'calls', work_date:day, name:dayLabel(day)});
    }
  }
  if(!rows.length){ closeModal(); calWeek=ymd(mon); renderPortal(); return toast('That week already exists.'); }
  $('m-save').disabled=true;
  const { error }=await sb.from('sites').insert(rows);
  if(error){ $('m-save').disabled=false; return toast('Error: '+error.message+(error.message.includes('work_date')?' — run update-2 in Supabase first':''),7000); }
  closeModal(); calWeek=ymd(mon); currentSiteId=null; await loadData(); renderPortal();
  toast(`Week of ${mon.toLocaleDateString('en-IE',{day:'numeric',month:'short'})} created${who.length>1?' for '+who.length+' men':''} ✓`);
}
async function deleteWeek(){ if(blockPreview()) return;
  const days=dSites().filter(s=>s.serviceman_id===currentTechId&&s.work_date&&ymd(mondayOf(parseYmd(s.work_date)))===calWeek);
  const dj=jobs.filter(j=>days.some(d=>d.id===j.site_id));
  const ok=await confirmBox({icon:'🗑', title:'Delete this whole week?',
    body:`Removes the 6 day tabs for the week of ${parseYmd(calWeek).toLocaleDateString('en-IE',{day:'numeric',month:'long'})}${dj.length?` and <b>${dj.length} job${dj.length===1?'':'s'}</b> (files are removed from the server)`:''}. This can't be undone.`,
    ok:'Delete week', okClass:'btn-danger'});
  if(!ok) return;
  const paths=[...dj.flatMap(j=>[j.pdf_path,j.marked_path]), ...await chatPhotoPaths(dj.map(j=>j.id))].filter(Boolean);
  if(paths.length){ const r=await sb.storage.from(BUCKET).remove(paths); if(r.error) return toast('Could not remove files: '+r.error.message,5000); }
  for(const d of days){ const { error }=await sb.from('sites').delete().eq('id',d.id); if(error) return toast('Error: '+error.message,5000); }
  calWeek=null; currentSiteId=null; await loadData(); renderPortal(); toast('Week deleted');
}

// Files can be dropped anywhere on the upload window, not just the box
function attachDrop(){
  const d=$('m-drop'), zone=d.closest('.modal'); let depth=0;
  zone.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; d.classList.add('over'); });
  zone.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  zone.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) d.classList.remove('over'); });
  zone.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; d.classList.remove('over'); filesPicked(e.dataTransfer.files); });
}
function hasFiles(e){ return e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files'); }
// Stop the browser opening a file if it's dropped slightly outside the box
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{ if(hasFiles(e)) e.preventDefault(); }));
function filesPicked(fl){
  const ok=Array.from(fl).filter(f=>f.type==='application/pdf'||f.type.startsWith('image/')||/\.(pdf|jpe?g|png|heic)$/i.test(f.name));
  if(fl.length && !ok.length) toast('Only PDFs or photos can be uploaded.');
  pendingFiles=[...pendingFiles, ...ok];
  renderPendingFiles();
  if(!$('m-title').value && pendingFiles[0]) $('m-title').value=pendingFiles[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,80);
}
function removePending(i){ pendingFiles.splice(i,1); renderPendingFiles(); }
function renderPendingFiles(){
  if(!$('m-files')) return;
  $('m-files').innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>${/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)?'📄':'🖼️'}</span><span class="fi-name">${esc(f.name)}</span><span class="fi-size">${fmtBytes(f.size)}</span><button type="button" onclick="removePending(${i})" title="Remove">✕</button></div>`).join('');
  const d=$('m-drop'); d.classList.toggle('has-files',pendingFiles.length>0);
  d.querySelector('.drop-main').textContent=pendingFiles.length?'Drag more here to add pages':(d.dataset.empty||'Drag the order sheet here');
}
// Downscale a photo to a sensible size and return JPEG bytes (saves storage)
function imageToJpeg(file, maxSide=2200){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?b.arrayBuffer().then(ab=>res({bytes:new Uint8Array(ab),w:c.width,h:c.height})):rej(new Error('Could not read image')),'image/jpeg',0.82); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(file.name+' is not an image this browser can read (try JPG/PNG)'));};
    img.src=url;
  });
}
async function buildUploadPdf(files){
  if(files.length===1 && files[0].type==='application/pdf') return new Uint8Array(await files[0].arrayBuffer());
  const out=await PDFLib.PDFDocument.create();
  for(const f of files){
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      const src=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
      (await out.copyPages(src, src.getPageIndices())).forEach(p=>out.addPage(p));
    } else {
      const im=await imageToJpeg(f); const jpg=await out.embedJpg(im.bytes);

    }

  return await out.save();
}

// ── PDF rendering + mark-up ───────────────────────────────────────
async function renderPdf(){
  commitTextEditor();
  if(!pdfDoc) return;
  const token=++renderToken, wrap=$('pdf-pages'), scroller=$('pdf-scroll');
  if(scroller.offsetParent===null) return;   // pane hidden (mobile chat tab)
  const avail=Math.max(280, scroller.clientWidth - (window.innerWidth<720?16:32));
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const frag=document.createDocumentFragment(); const views=[];
  for(let i=1;i<=pdfDoc.numPages;i++){
    const page=await pdfDoc.getPage(i); if(token!==renderToken) return;
    const base=page.getViewport({scale:1});
    const scale=Math.min(avail/base.width, 2.2)*zoomLevel;
    const vp=page.getViewport({scale});
    const box=document.createElement('div'); box.className='pdf-page'; box.style.width=vp.width+'px'; box.style.height=vp.height+'px';
    const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr); cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    const ink=document.createElement('canvas'); ink.className='ink'; ink.width=cv.width; ink.height=cv.height; ink.style.width=vp.width+'px'; ink.style.height=vp.height+'px';
    box.append(cv,ink); frag.appendChild(box);
    views.push({page, vp, cv, ink, dpr, idx:i-1});
  }
  if(token!==renderToken) return;
  wrap.innerHTML=''; wrap.appendChild(frag); pageViews=views;
  $('zoom-lbl').textContent=Math.round(zoomLevel*100)+'%';
  views.forEach(v=>{ attachInk(v); drawInk(v); });
  for(const v of views){
    if(token!==renderToken) return;
    await v.page.render({canvasContext:v.cv.getContext('2d'), viewport:v.page.getViewport({scale:v.vp.scale*v.dpr})}).promise.catch(()=>{});
  }
}
function zoom(d){ zoomLevel = d===0?1:Math.min(4,Math.max(0.5, +(zoomLevel*(d>0?1.25:0.8)).toFixed(3))); renderPdf(); }

function setToolQuiet(t){ tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('pdf-scroll').classList.toggle('tool-none', t==='none');
  $('mark-hint').textContent = t==='none' ? 'Note placed — you can scroll now. Tap T Text again to add another note (or to change/move one).'

function setDirty(v){ dirty=v; updateSaveBtn(); }

function toPdf(v,e){ const r=v.ink.getBoundingClientRect(); return v.vp.convertToPdfPoint(e.clientX-r.left, e.clientY-r.top).map(n=>+n.toFixed(2)); }
function toView(v,pt){ return v.vp.convertToViewportPoint(pt[0],pt[1]); }
// ── Text notes ─────────────────────────────────────────────────────
// stored as {p, t:'text', c, fs, pts:[[x,y]] (top-left, PDF units), text}
const TXT_FONT='Helvetica, Arial, sans-serif';
let measureCtx=null;
function textBoxPdf(s){
  measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
  measureCtx.font=`${s.fs}px ${TXT_FONT}`;
  const lines=String(s.text||'').split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
  const w=Math.max(s.fs, ...lines.map(l=>measureCtx.measureText(l).width))+pad*2;
  return {lines, pad, lh, w, h:lines.length*lh+pad*2};
}
function textRectView(v,s){ const [x,y]=toView(v,s.pts[0]), b=textBoxPdf(s), k=v.vp.scale; return {x,y,w:b.w*k,h:b.h*k}; }
function hitText(v,x,y){ for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; if(s.t!=='text'||s.p!==v.idx) continue;
  const r=textRectView(v,s); if(x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-4&&y<=r.y+r.h+4) return s; } return null; }
function defaultFontSize(v){ const w=Math.abs(v.vp.viewBox[2]-v.vp.viewBox[0])||595; return Math.round(Math.max(9, Math.min(22, w/46))); }
let textEd=null;   // {el, v, s (existing or null), pt}
function openTextEditor(v, s, pt){
  commitTextEditor();
  const fs=s?s.fs:defaultFontSize(v), c=s?s.c:colour, k=v.vp.scale;
  const [x,y]=toView(v, s?s.pts[0]:pt);
  const el=document.createElement('textarea'); el.className='txt-ed'; el.rows=1; el.value=s?s.text:'';
  el.placeholder='Type a note…';
  Object.assign(el.style,{left:x+'px', top:y+'px', fontSize:(fs*k)+'px', color:c, borderColor:c, padding:(fs*0.35*k)+'px', lineHeight:'1.25'});
  v.ink.parentElement.appendChild(el);
  if(s){ s._hidden=true; drawInk(v); }
  textEd={el, v, s, pt, fs, c};
  const grow=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; el.style.width='auto'; el.style.width=Math.max(140, el.scrollWidth+4)+'px'; };
  el.addEventListener('input',grow);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); commitTextEditor(); } if(e.key==='Escape'){ commitTextEditor(true); } });
  el.addEventListener('blur',()=>setTimeout(()=>{ if(textEd&&textEd.el===el) commitTextEditor(); },120));
  setTimeout(()=>{ grow(); el.focus(); },30);
}
function commitTextEditor(cancel){
  if(!textEd) return; const {el,v,s,pt,fs,c}=textEd; textEd=null;
  const val=el.value.replace(/\s+$/,''); el.remove();
  if(s){ delete s._hidden;
    if(!cancel){ if(!val){ strokes=strokes.filter(x=>x!==s); setDirty(true); } else if(val!==s.text){ s.text=val; setDirty(true); } } }
  else if(!cancel && val){ strokes.push({p:v.idx, t:'text', c, fs, pts:[pt], text:val}); setDirty(true); }
  drawInk(v); updateSaveBtn();
}
// pdf-lib's built-in Helvetica only knows Western characters — swap the rest
function pdfSafe(t){ return String(t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\n\x20-\x7E -ÿ€]/g,'?'); }

function attachInk(v){
  let cur=null;
  v.ink.addEventListener('pointerdown',e=>{
    if(!marking) return; e.preventDefault(); v.ink.setPointerCapture(e.pointerId);
    const p=toPdf(v,e);
    if(tool==='text'){
      commitTextEditor();
      const r=v.ink.getBoundingClientRect(), s=hitText(v,e.clientX-r.left,e.clientY-r.top);
      cur={text:true, s, start:p, orig:s?[...s.pts[0]]:null, moved:false}; return;
    }
    if(tool==='erase'){ eraseAt(v,e); cur={erase:true}; return; }
    cur={p:v.idx, t:tool, c:colour, w: tool==='hl'?10:(tool==='pen'?1.8:2.4), pts:[p, p]};
    strokes.push(cur); drawInk(v);
  });
  v.ink.addEventListener('pointermove',e=>{
    if(!cur) return; e.preventDefault();
    if(cur.erase){ eraseAt(v,e); return; }
    const p=toPdf(v,e);
    if(cur.text){
      if(cur.s && (cur.moved || Math.hypot(p[0]-cur.start[0],p[1]-cur.start[1])>3)){
        cur.moved=true; cur.s.pts[0]=[+(cur.orig[0]+p[0]-cur.start[0]).toFixed(2), +(cur.orig[1]+p[1]-cur.start[1]).toFixed(2)]; drawInk(v);
      }
      return;
    }
    if(cur.t==='line'){
      // snap to horizontal when nearly level — perfect for striking an item through
      const a=cur.pts[0], ang=Math.abs(Math.atan2(p[1]-a[1], p[0]-a[0])*180/Math.PI);
      if(ang<8||ang>172) p[1]=a[1];
      cur.pts[1]=p;
    } else {
      const last=cur.pts[cur.pts.length-1];
      if(Math.hypot(p[0]-last[0],p[1]-last[1])>0.6) cur.pts.push(p);
    }
    drawInk(v);
  });
  const end=()=>{
    if(!cur) return;
    if(cur.text){
      const c=cur; cur=null;
      if(c.moved){ setDirty(true); drawInk(v); }
      else setTimeout(()=>openTextEditor(v, c.s, c.start), 0);   // tap: edit existing note or start a new one
      setToolQuiet('none');   // one note per tap of the Text button — stops stray boxes when scrolling on a phone
      return;
    }
    if(!cur.erase){
      const [a,b]=[cur.pts[0],cur.pts[cur.pts.length-1]];
      if(cur.t!=='pen' && Math.hypot(b[0]-a[0],b[1]-a[1])<3){ strokes.pop(); }   // ignore accidental taps
      else { if(cur.t==='pen'&&cur.pts.length>2) cur.pts.splice(1,1); setDirty(true); }
    }
    cur=null; drawInk(v); updateSaveBtn();
  };
  v.ink.addEventListener('pointerup',end); v.ink.addEventListener('pointercancel',end);
}
function eraseAt(v,e){
  const r=v.ink.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const hit=(s)=>{ if(s.p!==v.idx) return false;
    if(s.t==='text'){ const q=textRectView(v,s); return x>=q.x-4&&x<=q.x+q.w+4&&y>=q.y-4&&y<=q.y+q.h+4; }
    const tol=Math.max(10, s.w*v.vp.scale/2+6);
    for(let i=0;i<s.pts.length-1;i++){ const [ax,ay]=toView(v,s.pts[i]), [bx,by]=toView(v,s.pts[i+1]);
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)):0;
      if(Math.hypot(x-(ax+t*dx), y-(ay+t*dy))<tol) return true; } return false; };
  const before=strokes.length; strokes=strokes.filter(s=>!hit(s));
  if(strokes.length!==before){ setDirty(true); drawInk(v); }
}
function drawInk(v){
  const ctx=v.ink.getContext('2d'); ctx.setTransform(v.dpr,0,0,v.dpr,0,0); ctx.clearRect(0,0,v.ink.width,v.ink.height);
  for(const s of strokes){
    if(s.p!==v.idx||!s.pts.length||s._hidden) continue;
    if(s.t==='text'){
      const b=textBoxPdf(s), k=v.vp.scale, [x,y]=toView(v,s.pts[0]);
      ctx.save(); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(x,y,b.w*k,b.h*k);
      ctx.strokeStyle=s.c; ctx.lineWidth=Math.max(1,1.2*k); ctx.strokeRect(x,y,b.w*k,b.h*k);
      ctx.fillStyle=s.c; ctx.font=`${s.fs*k}px ${TXT_FONT}`; ctx.textBaseline='alphabetic';
      b.lines.forEach((l,i)=>ctx.fillText(l, x+b.pad*k, y+(b.pad+s.fs*0.95+i*b.lh)*k));
      ctx.restore(); continue;
    }
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=s.c; ctx.lineWidth=s.w*v.vp.scale;
    if(s.t==='hl'){ ctx.globalAlpha=.35; ctx.globalCompositeOperation='multiply'; }
    ctx.beginPath(); s.pts.forEach((pt,i)=>{ const [x,y]=toView(v,pt); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore();
  }
}
function redrawAllInk(){ pageViews.forEach(drawInk); updateSaveBtn(); }
function undoStroke(){ if(!strokes.length) return; strokes.pop(); setDirty(true); redrawAllInk(); }
function clearStrokes(){ if(!strokes.length) return; if(!confirm('Remove all marks on this sheet?')) return; strokes=[]; setDirty(true); redrawAllInk(); }

function hexRgb(h){ const n=parseInt(h.slice(1),16); return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255); }
// Burn the marks into a copy of the original PDF (original stays untouched)
async function buildMarkedPdf(bytes, list){
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}); const pages=doc.getPages();
  let font=null;
  for(const s of list){
    const pg=pages[s.p]; if(!pg||!s.pts.length) continue;
    if(s.t==='text'){
      font = font || await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      const lines=pdfSafe(s.text).split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
      const w=Math.max(s.fs, ...lines.map(l=>font.widthOfTextAtSize(l,s.fs)))+pad*2, h=lines.length*lh+pad*2;
      const [x,y]=s.pts[0];
      pg.drawRectangle({x, y:y-h, width:w, height:h, color:PDFLib.rgb(1,1,1), opacity:0.92, borderColor:hexRgb(s.c), borderWidth:1.2});
      lines.forEach((l,i)=>pg.drawText(l,{x:x+pad, y:y-pad-s.fs*0.95-i*lh, size:s.fs, font, color:hexRgb(s.c)}));
      continue;
    }
    let d=s.pts.map((q,i)=>(i?'L':'M')+q[0]+' '+(-q[1])).join(' ');
    if(s.pts.length===1) d+=` L${s.pts[0][0]+0.1} ${-s.pts[0][1]}`;
    pg.drawSvgPath(d,{x:0,y:0,borderColor:hexRgb(s.c),borderWidth:s.w,borderOpacity:s.t==='hl'?0.4:1,
      borderLineCap:PDFLib.LineCapStyle.Round, blendMode:s.t==='hl'?PDFLib.BlendMode.Multiply:undefined});
  }
  return await doc.save();
}
async function saveMarkup(){ if(blockPreview()) return;
  commitTextEditor();
  if(!job||!origBytes) return;
  const b=$('save-btn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Saving…';
  try{
    const markedPath=`${filePrefix(deptOf(job),job.serviceman_id)}/${job.id}/marked.pdf`;
    let path=null, size=0;
    if(strokes.length){
      const out=await buildMarkedPdf(origBytes, strokes);
      const up=await sb.storage.from(BUCKET).upload(markedPath, new Blob([out],{type:'application/pdf'}), {upsert:true, contentType:'application/pdf'});
      if(up.error) throw up.error;
      path=markedPath; size=out.length;
    } else if(job.marked_path){
      await sb.storage.from(BUCKET).remove([job.marked_path]);
    }
    const { error }=await sb.rpc('save_markup',{p_job:job.id, p_markup:strokes, p_marked_path:path, p_marked_bytes:size});
    if(error) throw error;
    job.marked_path=path; job.marked_bytes=size; setDirty(false); updateJobHeader();
    toast(isOffice?'Mark-up saved':'Saved — the office can see your marks ✓'); scheduleReload();
  }catch(e){ setDirty(true); toast('Save failed: '+(e.message||e),6000); }
}

// ── Conversation ──────────────────────────────────────────────────
let shownComments=new Set();
async function loadComments(){
  const id=job.id;
  const { data, error }=await sb.from('comments').select('*').eq('job_id',id).order('created_at');
  if(!job||job.id!==id) return;
  shownComments=new Set(); $('chat-list').innerHTML='';
  if(error){ $('chat-list').innerHTML=`<div class="loading">${esc(error.message)}</div>`; return; }
  if(!data.length) $('chat-list').innerHTML='<div class="loading" id="chat-empty">No messages yet. Ask a question or leave an update about this job.</div>';
  data.forEach(c=>appendComment(c,false));
  const l=$('chat-list'); l.scrollTop=l.scrollHeight;
}
function appendComment(c, scroll){
  if(shownComments.has(c.id)) return; shownComments.add(c.id);
  const em=$('chat-empty'); if(em) em.remove();
  const el=document.createElement('div');
  if(c.kind==='event'){ el.className='evt'; el.textContent=`${firstName(prof(c.author_id).full_name)} · ${c.body} · ${fmtWhen(c.created_at)}`; }
  else { const mine=c.author_id===me.id, a=prof(c.author_id);
    el.className='msg'+(mine?' me':'');
    const photo=c.photo_path?`<div class="photo-wrap"><img class="chat-photo" data-path="${esc(c.photo_path)}" alt="Photo" onclick="openLightbox(this)"><span class="ph-load">📷</span></div>`:'';
    el.innerHTML=`${mine?'':`<div class="who">${esc(a.full_name)}${roleLabel(a.role)?' · '+roleLabel(a.role):''}</div>`}<div class="bub ${c.photo_path?'has-photo':''}">${photo}${c.body?`<div class="cap">${esc(c.body)}</div>`:''}</div><div class="when">${fmtWhen(c.created_at)}</div>`;
    if(c.photo_path) loadChatPhoto(el.querySelector('img'), scroll); }
  const l=$('chat-list'); l.appendChild(el);
  const n=[...shownComments].length; $('chat-count').textContent=n?`(${n})`:'';
  if(scroll) l.scrollTop=l.scrollHeight;
}
async function sendMessage(){ if(blockPreview()) return;
  const ta=$('chat-input'), body=ta.value.trim(); if(!body||!job) return;
  ta.value=''; autoGrow(ta);
  const { data, error }=await sb.from('comments').insert({job_id:job.id, author_id:me.id, body}).select().single();
  if(error){ ta.value=body; return toast('Not sent: '+error.message,5000); }
  appendComment(data,true);
}

// ── Photos in the conversation ────────────────────────────────────
const photoUrls=new Map();   // storage path -> short-lived link
async function photoUrl(path){
  const hit=photoUrls.get(path); if(hit && hit.exp>Date.now()) return hit.url;
  const { data, error }=await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error) throw error;
  photoUrls.set(path,{url:data.signedUrl, exp:Date.now()+50*60*1000}); return data.signedUrl;
}
async function loadChatPhoto(img, scroll){
  try{
    img.onload=()=>{ img.parentElement.classList.add('loaded'); if(scroll){ const l=$('chat-list'); l.scrollTop=l.scrollHeight; } };
    img.src=await photoUrl(img.dataset.path);
  }catch(e){ img.parentElement.querySelector('.ph-load').textContent='⚠️ Photo unavailable'; }
}
async function sendPhotos(fl){ if(blockPreview()) return;
  const files=Array.from(fl||[]).filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!files.length||!job) return;
  const jobId=job.id, prefix=`${filePrefix(deptOf(job),job.serviceman_id)}/${job.id}/photos`;
  const ta=$('chat-input'); let caption=ta.value.trim(); ta.value=''; autoGrow(ta);
  const l=$('chat-list'), ph=document.createElement('div'); ph.className='msg me';
  ph.innerHTML=`<div class="bub has-photo"><div class="photo-wrap sending"><span class="spin" style="border-color:#c7d2fe;border-top-color:#4f46e5"></span><span style="font-size:12px;color:var(--slate)">Sending ${files.length} photo${files.length===1?'':'s'}…</span></div></div>`;
  l.appendChild(ph); l.scrollTop=l.scrollHeight;
  let sent=0;
  for(const f of files){
    try{
      const im=await imageToJpeg(f,1600);                   // shrink to save data
      const path=`${prefix}/${uuid()}.jpg`;
      const up=await sb.storage.from(BUCKET).upload(path, new Blob([im.bytes],{type:'image/jpeg'}), {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      const { data, error }=await sb.from('comments').insert({job_id:jobId, author_id:me.id, body:caption, photo_path:path, photo_bytes:im.bytes.length}).select().single();
      if(error){ await sb.storage.from(BUCKET).remove([path]); throw error; }
      caption=''; sent++;
      if(job&&job.id===jobId) appendComment(data,true);
    }catch(e){ toast('Photo not sent: '+(e.message||e)+((e.message||'').match(/photo_path|mime|column/i)?' — run update-3 in Supabase':''),7000); }
  }
  ph.remove(); l.scrollTop=l.scrollHeight;
}
function openLightbox(img){
  if(!img.src) return;
  $('lb-img').src=img.src; $('lb-dl').href=img.src;
  const cap=img.closest('.bub').querySelector('.cap'); $('lb-cap').textContent=cap?cap.textContent:'';
  $('lightbox').classList.remove('hidden');
}
function closeLightbox(){ $('lightbox').classList.add('hidden'); $('lb-img').src=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });
// Photos stored with a job's chat — removed from the server when the job goes
async function chatPhotoPaths(jobIds){
  if(!jobIds.length) return [];
  const { data }=await sb.from('comments').select('photo_path').in('job_id',jobIds);
  return (data||[]).map(r=>r.photo_path).filter(Boolean);
}
