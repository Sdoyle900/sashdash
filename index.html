<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SashDash</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SashDash" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0f172a;--navy2:#1e293b;--indigo:#4f46e5;--indigo2:#4338ca;--sky:#0ea5e9;--green:#16a34a;--red:#dc2626;--amber:#d97706;--slate:#64748b;--slate2:#94a3b8;--border:#e2e8f0;--bg:#f1f5f9;--white:#ffffff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
    html,body{height:100%}
    body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
    button{font-family:inherit}
    .hidden{display:none!important}

    /* buttons — same family as RackTrack */
    .btn-primary{background:var(--indigo);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
    .btn-primary:hover{background:var(--indigo2)}
    .btn-primary:disabled{opacity:.6;cursor:default}
    .btn-primary.full{width:100%;padding:13px;font-size:15px}
    .btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{border-color:var(--indigo);color:var(--indigo)}
    .btn-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
    .btn-danger:hover{background:#fef2f2}
    .btn-ghost{background:transparent;color:var(--slate2);border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .btn-ghost:hover{color:#fff;background:rgba(255,255,255,.1)}

    /* login */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
    .auth-card{background:var(--white);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .auth-sd{display:block;height:58px;margin:0 auto 18px}
    .brand{display:flex;align-items:center;gap:9px}
    .brand svg{flex:none}
    .brand-text{font-size:22px;font-weight:400;letter-spacing:1px;color:var(--navy)}
    .brand-text strong{font-weight:900;color:var(--indigo)}
    .auth-card .brand{justify-content:center;margin-bottom:4px}
    .auth-sub{color:var(--slate);font-size:13px;margin-bottom:22px;text-align:center}
    .auth-footer{color:var(--slate2);font-size:12px;text-align:center;margin-top:16px}
    .auth-error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .field-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .field-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate)}
    .field-group input,.field-group select,.field-group textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#f8fafc;color:var(--navy);width:100%}
    .field-group input:focus,.field-group select:focus,.field-group textarea:focus{outline:none;border-color:var(--indigo);background:#fff}
    .optional{font-weight:400;text-transform:none;color:var(--slate2);font-size:11px}

    /* header */
    .app-header{background:var(--navy);position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);padding-top:var(--safe-t)}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px;height:58px}
    .header-inner .brand-text{color:#fff;font-size:18px}
    .header-inner .brand-text strong{color:#818cf8}
    .sd-chip{height:30px;padding:3px 9px;background:#fff;border-radius:6px;margin-left:8px}
    .header-tabs{display:flex;gap:4px;margin-left:12px}
    .tab{background:transparent;color:#94a3b8;border:none;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .tab:hover{color:#fff;background:rgba(255,255,255,.08)}
    .tab.active{background:var(--indigo);color:#fff}
    .header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .user-name{color:#cbd5e1;font-size:13px;font-weight:600}
    .role-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#312e81;color:#c7d2fe;letter-spacing:.5px}

    .rs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .rs-day{position:relative;border:1.5px solid var(--border);border-radius:10px;padding:8px 4px;display:flex!important;flex-direction:column;align-items:center;cursor:pointer;text-transform:none!important;letter-spacing:0!important;color:var(--navy)!important}
    .rs-day input{position:absolute;opacity:0;pointer-events:none}
    .rs-day b{font-size:14px} .rs-day small{font-size:11px;color:var(--slate);font-weight:600}
    .rs-day em{font-style:normal;font-size:9px;font-weight:900;text-transform:uppercase;color:#b45309}
    .rs-day.cur{background:#f1f5f9}
    .rs-day.past{opacity:.55}
    .rs-day:has(input:checked){border-color:#b45309;background:#fff7ed;box-shadow:0 0 0 2px #fdba74}
    @media (max-width:520px){ .rs-grid{grid-template-columns:repeat(3,1fr)} }
    .arch-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:14px 0 10px;font-size:14px}
    .arch-status{background:#eef2ff;color:#3730a3;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
    .dl-week{display:flex;gap:6px;align-items:center;margin-right:8px}
    .dl-week select{padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;font-weight:600}
    @media (max-width:720px){ .dl-week{width:100%;margin:8px 0 0} .dl-week select{flex:1} }
    .search-wrap{position:relative;margin:16px 0 4px}
    .search-wrap input{width:100%;padding:13px 44px 13px 44px;border:2px solid var(--border);border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
    .search-wrap input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px #e0e7ff}
    .search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
    .search-wrap .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#e2e8f0;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px}
    #search-results{margin-top:10px}
    .s-count{font-size:12px;font-weight:700;color:var(--slate);margin:4px 2px 8px;text-transform:uppercase;letter-spacing:.5px}
    .s-table-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:60vh;margin-bottom:18px}
    .s-table{width:100%;border-collapse:collapse;font-size:14px}
    .s-table th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
    .s-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    .s-table tbody tr{cursor:pointer} .s-table tbody tr:hover{background:#eef2ff}
    .s-table .avatar.sm{display:inline-flex;vertical-align:middle;margin-right:4px}
    .s-title{font-weight:700} .s-sub{font-size:12px;color:var(--slate)} .s-chat{font-weight:400;font-size:12px;color:var(--slate);margin-top:2px}
    .s-where{font-size:12px;color:var(--slate)}
    .s-table mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
    .s-none{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;color:var(--slate);margin-bottom:18px}
    #dash-body.dim{opacity:.45}
    @media (max-width:720px){ .s-table th:nth-child(4),.s-table td:nth-child(4),.s-table th:nth-child(6),.s-table td:nth-child(6){display:none} .s-table{font-size:13px} }
    /* printing */
    #print-root{display:none}
    @media print{
      @page{size:A4;margin:12mm}
      body.printing > *:not(#print-root){display:none!important}
      body.printing{background:#fff}
      body.printing #print-root{display:block;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:11pt}
      .p-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:10px}
      .p-logo{height:46px}
      .p-title{font-size:18pt;font-weight:800}
      .p-sub{font-size:10pt;color:#444}
      .p-info{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10pt}
      .p-info td{border:1px solid #ccc;padding:4px 6px} .p-info td:nth-child(odd){background:#f1f5f9;font-weight:700;width:16%}
      .p-h{font-size:13pt;margin:12px 0 6px;border-bottom:1px solid #999}
      .p-page{page-break-inside:avoid;margin-bottom:8px;text-align:center}
      .p-page img{max-width:100%;max-height:245mm;border:1px solid #ccc}
      .p-pno{font-size:8pt;color:#666}
      .p-first img{max-height:200mm}
      .p-break{page-break-before:always}
      .p-msg{border:1px solid #ddd;border-radius:6px;padding:6px 8px;margin-bottom:6px;page-break-inside:avoid}
      .p-who{font-size:9pt;color:#444;margin-bottom:2px}
      .p-photo{display:block;max-width:60%;max-height:110mm;margin-top:4px;border:1px solid #ccc}
      .p-evt{font-size:9pt;color:#555;font-style:italic;margin:4px 0 6px}
      .p-foot{margin-top:14px;font-size:8pt;color:#777;border-top:1px solid #ccc;padding-top:4px}
    }
    .bell-btn{position:relative;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:38px;height:34px;font-size:16px;cursor:pointer}
    .bell-btn:hover{background:rgba(255,255,255,.18)}
    .bell-btn.on::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #0f172a}
    .push-banner{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;background:#eef2ff;color:#3730a3;font-weight:600;font-size:14px;padding:10px 16px;border-bottom:1px solid #c7d2fe}
    .push-banner .btn-primary{padding:7px 14px;font-size:13px}
    .push-banner .pb-x{border:none;background:none;font-size:16px;color:#6366f1;cursor:pointer}
    .ios-steps{margin:0 0 14px 22px;font-size:14px;line-height:1.9;color:var(--navy)}
    /* "View as" */
    .viewas-btn{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
    .viewas-btn:hover{background:rgba(255,255,255,.18)}
    body.previewing .viewas-btn{background:#f59e0b;border-color:#f59e0b;color:#1f2937}
    .va-menu{min-width:270px;max-height:70vh;overflow:auto}
    .va-menu button{display:flex;align-items:center;gap:10px}
    .va-menu button small{display:block;font-size:11px;color:var(--slate)}
    .va-menu button.on{background:#fef3c7}
    .va-h{font-size:12px;font-weight:800;color:var(--navy);padding:8px 12px 4px}
    .va-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);padding:8px 12px 2px}
    .va-exit{color:var(--indigo)!important;font-weight:700}
    .preview-banner{background:#f59e0b;color:#1f2937;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px;position:sticky;top:calc(58px + var(--safe-t));z-index:46;flex-wrap:wrap;text-align:center}
    .preview-banner button{background:#1f2937;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:800;cursor:pointer}
    body.previewing .dept-bar{top:calc(96px + var(--safe-t))}
    body.previewing .composer textarea{background:#f1f5f9}
    body.previewing .job-view .jv-bar{box-shadow:inset 0 -4px 0 #f59e0b}
    @media (max-width:720px){ .viewas-btn .lbl{display:none} .preview-banner{font-size:12px;gap:8px} }
    /* department switch — Sites / Private Calls */
    .dept-bar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(58px + var(--safe-t));z-index:45;box-shadow:0 2px 6px rgba(15,23,42,.05)}
    .dept-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:10px}
    .dept-btn{position:relative;flex:1;max-width:280px;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid var(--border);background:#f8fafc;border-radius:12px;padding:11px 16px;font-weight:800;font-size:16px;color:var(--slate);cursor:pointer;transition:all .12s}
    .dept-btn:hover{border-color:#cbd5e1;color:var(--navy)}
    .dept-btn .di{font-size:20px}
    .dept-btn .dc{background:#e2e8f0;color:var(--navy);font-size:12px;padding:1px 8px;border-radius:20px}
    .dept-btn.on.d-sites{background:var(--navy);border-color:var(--navy);color:#fff}
    .dept-btn.on.d-calls{background:#b45309;border-color:#b45309;color:#fff}
    .dept-btn.on .dc{background:rgba(255,255,255,.22);color:#fff}
    .dept-btn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px}
    .tag.amber{background:#fef3c7;color:#92400e}
    .modal:has(.team-row){max-width:700px}
    .tr-role{padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;min-width:0}
    .tr-depts{grid-column:2 / -1;display:flex;gap:16px;font-size:13px;font-weight:600;color:var(--navy)}
    .tr-depts label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .tr-depts.muted{opacity:.4}
    @media (max-width:720px){ .dept-inner{padding:8px 12px;gap:8px} .dept-btn{font-size:14px;padding:10px 8px;gap:6px} .dept-btn .di{font-size:17px} }
    .page{max-width:1400px;margin:0 auto;padding:22px 20px calc(40px + var(--safe-b))}
    .page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
    .page-sub{color:var(--slate);font-size:13px;margin-top:2px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .spacer{flex:1}

    /* dashboard */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
    .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
    .stat .n{font-size:26px;font-weight:900;letter-spacing:-.5px}
    .stat .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate)}
    .meter{height:6px;background:#e2e8f0;border-radius:4px;margin-top:8px;overflow:hidden}
    .meter > div{height:100%;background:var(--indigo);border-radius:4px}
    .section-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);margin:4px 0 10px}
    .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:26px}
    .tech-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s;border-top:4px solid var(--c,#4f46e5)}
    .tech-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.08)}
    .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;background:var(--c,#4f46e5)}
    .avatar.sm{width:28px;height:28px;font-size:11px}
    .tech-card .name{font-weight:800;font-size:16px}
    .tech-card .phone{color:var(--slate);font-size:12px}
    .tech-nums{display:flex;gap:6px;margin-top:14px}
    .tech-nums div{flex:1;background:#f8fafc;border-radius:8px;padding:8px;text-align:center}
    .tech-nums b{display:block;font-size:18px;font-weight:900}
    .tech-nums span{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--slate);letter-spacing:.5px}
    .new-pill{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
    .activity{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .act-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer}
    .act-row:last-child{border-bottom:none}
    .act-row:hover{background:#f8fafc}
    .act-main{flex:1;min-width:0}
    .act-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .act-meta{color:var(--slate);font-size:12px}

    /* portal */
    .crumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
    .crumbs::-webkit-scrollbar{display:none}
    .team-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--border);border-radius:30px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;position:relative}
    .team-chip.active{border-color:var(--navy);background:var(--navy);color:#fff}
    .team-chip .dot{position:absolute;top:0;right:2px}
    .site-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);margin:20px 0 8px}
    .week-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:10px 12px;margin-top:16px}
    .wk-nav{width:40px;height:40px;border-radius:10px;border:1.5px solid #fdba74;background:#fff;font-size:22px;font-weight:800;color:#9a3412;cursor:pointer;flex:none}
    .wk-nav:disabled{opacity:.3;cursor:default}
    .wk-label{display:flex;flex-direction:column;line-height:1.25}
    .wk-label b{font-size:16px;color:#7c2d12}
    .wk-label span{font-size:12px;color:#9a3412}
    .wk-new{background:#b45309} .wk-new:hover{background:#92400e}
    .day-tab{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
    .day-tab b{font-size:16px} .day-tab small{font-size:12px;font-weight:600;opacity:.75}
    .site-tab .today{font-size:10px;font-weight:900;letter-spacing:.5px;background:#f59e0b;color:#fff;padding:2px 6px;border-radius:6px}
    .wk-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .wk-choice label{border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-weight:700;color:var(--navy);text-transform:none;letter-spacing:0;cursor:pointer}
    .wk-choice label:has(input:checked){border-color:#b45309;background:#fff7ed}
    .wk-choice small{font-weight:500;color:var(--slate);font-size:12px}
    .wk-choice input[type=date]{margin-top:6px;width:100%;font-size:13px;padding:4px}
    .field-group input[type=radio],.field-group input[type=checkbox]{width:auto;flex:none;margin:0}
    .wk-choice input[type=radio]{display:block;margin:0 0 4px}
    label.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy);text-transform:none;letter-spacing:0;margin-bottom:4px;cursor:pointer}
    @media (max-width:720px){ .wk-choice{grid-template-columns:1fr} .week-bar .spacer{display:none} .week-bar .btn-primary,.week-bar .btn-danger{flex:1;justify-content:center} }
    .month-cal{background:#fff;border:1.5px solid #fed7aa;border-radius:12px;padding:10px 12px 8px;margin-top:10px;max-width:520px}
    .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .mc-head b{font-size:16px;color:#7c2d12;min-width:130px;text-align:center}
    .mc-head .wk-nav{width:34px;height:34px;font-size:20px}
    .mc-head .btn-outline{padding:6px 12px}
    .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

    .send{width:42px;height:42px;border-radius:50%;border:none;background:var(--indigo);color:#fff;font-size:18px;cursor:pointer;flex:none;align-self:flex-end}

    /* modal */
    .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
    .modal h2{font-size:18px;font-weight:800;margin-bottom:16px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
    .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2.5px dashed #a5b4fc;background:#eef2ff;border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:#3730a3;margin-bottom:12px;transition:background .15s,border-color .15s,transform .15s}
    .drop:hover{border-color:var(--indigo);background:#e0e7ff}
    .drop.over{background:#c7d2fe;border-color:var(--indigo);border-style:solid;transform:scale(1.02)}
    .drop .drop-icon{font-size:34px;line-height:1}
    .drop .drop-main{font-weight:800;font-size:15px}
    .drop .drop-sub{font-size:12px;color:#4f46e5;font-weight:500}

    .file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .file-item{display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px}
    .file-item .fi-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
    .file-item .fi-size{color:var(--slate);font-size:12px}
    .file-item button{border:none;background:none;color:var(--slate);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px}
    .file-item button:hover{background:#fee2e2;color:var(--red)}
    .team-row{display:grid;grid-template-columns:34px 1fr 1fr 180px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
    .team-row input[type=text],.team-row input[type=tel]{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;width:100%;min-width:0}
    .team-row input[type=color]{width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer}
    .help{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--slate);margin-top:14px;line-height:1.6}
    .help code{background:#e2e8f0;padding:1px 5px;border-radius:4px;color:var(--navy)}

    .toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-weight:600;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}

    @media (max-width:900px){
      .chat-pane{width:auto;border-left:none}
      .jv-tabs{display:flex}
      .jv-body .sheet-pane,.jv-body .chat-pane{flex:1}
      .jv-body[data-tab="sheet"] .chat-pane{display:none}
      .jv-body[data-tab="chat"] .sheet-pane{display:none}
    }
    @media (max-width:720px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .sd-chip{display:none}
      .user-name{display:none}
      .header-tabs{margin-left:4px}
      .header-inner{padding:0 12px}
      .page{padding:16px 14px calc(40px + var(--safe-b))}
      .pdf-scroll{padding:8px}
      .done-btn{padding:7px 11px;font-size:12px}
      .jv-bar{flex-wrap:wrap}
      .oc-group{order:5;width:100%;gap:5px;padding-top:6px}
      .oc-group .done-btn{flex:1;justify-content:center;padding:7px 4px;font-size:11px;gap:4px}
      .oc-group .done-btn .box{width:15px;height:15px}
      .team-row{grid-template-columns:34px 1fr 1fr}
      .team-row input[type=tel]{grid-column:2 / 3}
      .team-row .tr-role{grid-column:3 / 4}
      .tr-depts{flex-wrap:wrap;gap:10px}
      .tb-btn .lbl{display:none}
      .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px}
      .toolbar::-webkit-scrollbar{display:none}
      .toolbar > *,.mark-tools > *{flex:none}
      .marking-on .zoom-ctl{display:none}
      #mark-toggle{order:-3} .save-btn{order:-2;padding:8px 12px} #undo-btn{order:-1}
      .tb-btn{padding:6px 9px}
      .mark-hint{font-size:11px;padding:4px 10px}
    }
  
    /* show / hide password */
    .pw-wrap{position:relative;display:block;width:100%}
    .pw-wrap input{padding-right:46px!important;width:100%}
    .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
    .pw-eye:hover{background:#e2e8f0;color:#0f172a}
    .pw-eye .i-hide{display:none}
    .pw-eye.on .i-show{display:none} .pw-eye.on .i-hide{display:block}
    input::-ms-reveal,input::-ms-clear{display:none}
  </style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
//  SETTINGS — paste your Supabase project URL and anon key here
//  (Supabase → Project Settings → API). Same as RackTrack.
// ══════════════════════════════════════════════════════════════════
const SUPABASE_URL  = "https://zirabfvghbmdqrvbgxfi.supabase.co";
const SUPABASE_ANON = "sb_publishable_9JZKZrZALPJywZYP8oNqHQ_mbMGZEFS";
const LOGIN_DOMAIN  = "sashdash.ie";    // "john" logs in as john@sashdash.ie
const BUCKET        = "job-files";
const FREE_STORAGE_BYTES = 1024 * 1024 * 1024;   // Supabase free plan = 1 GB
const VAPID_PUBLIC  = "BIB0hjqZIc7mYTmw_gtsUKdqLlnYoOzANDrIhrX9JNl-7pGFERctE4z5K1Gcqwl0dUuGKIl7UCEbacce_VxNo90";   // phone notifications (public half of the key pair)

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ── State ──────────────────────────────────────────────────────────
let realMe = null, previewing = false;
let sb, me = null, isAdmin = false, isCallsOffice = false, isOffice = false, dept = 'sites';
const DEPT = {
  sites:{label:'Sites',         icon:'🏗️', one:'site',     many:'Sites',     pin:'📍'},
  calls:{label:'Private Calls', icon:'🏠', one:'customer', many:'Customers', pin:'🏠'}
};
let profiles = [], sites = [], jobs = [], orderReqs = [];
let currentTechId = null, currentSiteId = null, jobFilter = 'open', calWeek = null;
let job = null;                       // the open job
let origBytes = null, pdfDoc = null, pageViews = [];
let strokes = [], dirty = false, marking = false, tool = 'line', colour = '#e11d48';
let zoomLevel = 1, renderToken = 0, reloadTimer = null, realtime = null;

const JOB_COLS = 'id,department,outcome,site_id,serviceman_id,title,ref_no,notes,pdf_path,pdf_bytes,marked_path,marked_bytes,completed,completed_at,admin_unread,tech_unread,last_activity_at,created_at';

// ── Helpers ────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(msg,ms=2800){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),ms);}
function fmtDate(ts){if(!ts)return '';const d=new Date(ts);return d.toLocaleDateString('en-IE',{day:'numeric',month:'short'});}
function fmtWhen(ts){const d=new Date(ts),now=new Date();const t=d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===now.toDateString()?t:d.toLocaleDateString('en-IE',{day:'numeric',month:'short'})+' '+t;}
function fmtBytes(b){if(!b)return '0 MB';if(b<1024*1024)return (b/1024).toFixed(0)+' KB';return (b/1048576).toFixed(b<10*1048576?1:0)+' MB';}
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function prof(id){return profiles.find(p=>p.id===id)||{full_name:'Unknown',colour:'#64748b'};}
function inDept(p,d){return d==='calls'?p.on_calls!==false:p.on_sites!==false;}
function techs(d=dept){return profiles.filter(p=>p.role==='serviceman'&&inDept(p,d));}
function deptOf(x){return (x&&x.department)||'sites';}
function dSites(d=dept){return sites.filter(s=>deptOf(s)===d);}
function dJobs(d=dept){return jobs.filter(j=>deptOf(j)===d);}
function filePrefix(d,techId){return (d==='calls'?'calls/':'')+techId;}
// ── Dates for the 6-day week (Mon–Sat) ──
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }
function dayLabel(s){ return parseYmd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}); }
function dayLong(s){ return parseYmd(s).toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'}); }
function todayYmd(){ return ymd(new Date()); }
function roleLabel(r){return r==='admin'?'Office':r==='service_office'?'Service dept':'';}
function firstName(n){return (n||'').split(' ')[0];}
function unreadForMe(j){return isOffice?j.admin_unread:j.tech_unread;}
function msgCount(j){return (j.comments||[]).filter(c=>c.kind==='message').length;}   // real messages only, not status notes
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));}
function sashIcon(size,colour){return `<svg width="${size}" height="${size}" style="color:${colour}"><use href="#sash"/></svg>`;}

// ── Boot ───────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (SUPABASE_URL.includes('YOUR-PROJECT')) {
    showAuthError('SashDash isn\'t connected to Supabase yet — add your project URL and anon key at the top of the script in index.html.');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth:{ autoRefreshToken:true, persistSession:true, detectSessionInUrl:false }
  });
  $('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') signIn(); });
  $('auth-user').addEventListener('keydown', e=>{ if(e.key==='Enter') $('auth-password').focus(); });
  $('chat-input').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && window.innerWidth>900){ e.preventDefault(); sendMessage(); } });
  window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(job&&pdfDoc) renderPdf(); },250); });
  window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('click', e=>{ if(!e.target.closest('.menu-wrap')){ $('jv-menu').classList.add('hidden'); $('viewas-menu').classList.add('hidden'); } });

// ── Phone notifications ───────────────────────────────────────────
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isInstalled = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function b64ToBytes(b64){ const pad='='.repeat((4-b64.length%4)%4), raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
async function currentSub(){ try{ const reg=await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); }catch(e){ return null; } }
async function initNotifications(){
  const bell=$('bell-btn');
  if(previewing){ bell.classList.add('hidden'); $('push-banner').classList.add('hidden'); return; }
  bell.classList.remove('hidden');
  const sub = pushSupported ? await currentSub() : null;
  const on = !!sub && Notification.permission==='granted';
  bell.classList.toggle('on', on); bell.textContent = on ? '🔔' : '🔕';
  bell.title = on ? 'Notifications are ON for this device — click to turn off' : 'Turn on phone notifications';
  if(on){ saveSub(sub); }   // keep the server's copy up to date
  // gentle nudge for the men (once per device) if they haven't decided yet
  const nudge = !on && realMe.role==='serviceman' && (!pushSupported || Notification.permission!=='denied') && localStorageSafe('pushNudge')!=='no';
  const bn=$('push-banner');
  if(nudge){ bn.classList.remove('hidden');
    bn.innerHTML=`<span>🔔 Turn on notifications to get a ping when you're sent a job or a message.</span><button class="btn-primary" onclick="toggleNotifications()">Turn on</button><button class="pb-x" onclick="localStorageSafe('pushNudge','no');$('push-banner').classList.add('hidden')" aria-label="Not now">✕</button>`;
  } else bn.classList.add('hidden');
}
function localStorageSafe(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
async function saveSub(sub){
  const j=sub.toJSON();
  await sb.from('push_subscriptions').upsert({user_id:realMe.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0,200)}, {onConflict:'endpoint'});
}
async function toggleNotifications(){
  if(previewing) return blockPreview();
  if(isIOS && !isInstalled){
    return openModal(`<div style="text-align:center"><div style="font-size:40px">📲</div><h2 style="margin:6px 0">One step first on iPhone</h2>
      <p style="color:var(--slate);font-size:14px;margin-bottom:12px">iPhones only allow notifications from SashDash once it's on your home screen.</p></div>
      <ol class="ios-steps"><li>Tap the <b>Share</b> button <span style="font-size:18px">⬆️</span> at the bottom of Safari</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>Open SashDash from the new <b>home-screen icon</b> and tap 🔔 again</li></ol>
      <div class="modal-actions" style="justify-content:center"><button class="btn-primary" onclick="closeModal()">OK</button></div>`);
  }
  if(!pushSupported) return toast('This browser can\'t do notifications — use Chrome on Android, or Safari on iPhone (from the home screen).',7000);
  const sub=await currentSub();
  if(sub && Notification.permission==='granted'){
    const ok=await confirmBox({icon:'🔕', title:'Turn off notifications?', body:'This device will stop getting pings from SashDash. You can turn them back on any time with 🔔.', ok:'Turn off', okClass:'btn-danger'});
    if(!ok) return;
    try{ await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); }catch(e){}
    toast('🔕 Notifications off for this device'); return initNotifications();
  }
  if(Notification.permission==='denied')
    return toast('Notifications are blocked for SashDash in this phone\'s settings — allow them there, then tap 🔔 again.',8000);
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('No problem — tap 🔔 any time to turn them on.',5000); return initNotifications(); }
    const reg=await navigator.serviceWorker.ready;
    const s2=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
    await saveSub(s2);
    localStorageSafe('pushNudge','no');
    toast('🔔 Notifications on — you\'ll get a ping for new jobs and messages',5000);
  }catch(e){ toast('Could not turn on notifications: '+(e.message||e),7000); }
  initNotifications();
}
// Tapping a notification opens SashDash at ?job=… — jump straight to that job

async function loadData(){

  { const r=await sb.from('order_requests').select('*').order('created_at',{ascending:false}).limit(300); orderReqs = r.error ? [] : (r.data||[]); }
  if(previewing){   // show only what that person's own login is allowed to see

function scheduleReload(){

}
function rerenderCurrent(){
  if(!me) return;

function subscribeRealtime(){
  if(realtime) sb.removeChannel(realtime);
  realtime = sb.channel('sashdash-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'jobs'}, payload=>{
      scheduleReload();
      if(job && payload.new && payload.new.id===job.id && payload.eventType==='UPDATE' && !dirty){
        refreshOpenJobMarkup();
      }
      if(job && payload.eventType==='DELETE' && payload.old && payload.old.id===job.id){ toast('This job was deleted by the office.'); closeJob(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'}, payload=>{
      const c=payload.new;
      if(job && c.job_id===job.id){ appendComment(c,true); if(!previewing) sb.rpc('mark_job_seen',{p_job:job.id}); }
      scheduleReload();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sites'}, ()=>scheduleReload())
    .on('postgres_changes',{event:'*',schema:'public',table:'order_requests'}, ()=>scheduleReload())
    .subscribe();
}

        <td class="fp-note">${n.note?esc(n.note):'<span class="s-sub">—</span>'}</td>

}

// ══════════════════════════════════════════════════════════════════
//  Document scanner — camera photo → find the sheet → crop corners →
//  straighten → clean up like a scan. Pages are kept as JPEG bytes.
// ══════════════════════════════════════════════════════════════════
const Scanner = (() => {
  let src = null;          // {canvas, w, h}  the photo (rotated as chosen)
  let quad = null;         // 4 corners in photo pixels [TL, TR, BR, BL]
  let mode = 'clean';      // 'clean' | 'bw' | 'photo'
  let onDone = null, editingIndex = -1, origFile = null;
  let view = {scale:1, ox:0, oy:0};

  function loadImage(file){
    return new Promise((res,rej)=>{
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not read that photo — try again')); };
      img.src=url;
    });
  }
  function toCanvas(img, maxSide=2000){
    const k=Math.min(1, maxSide/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
    const c=document.createElement('canvas'); c.width=Math.round((img.naturalWidth||img.width)*k); c.height=Math.round((img.naturalHeight||img.height)*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c;
  }
  function rotate90(c){
    const r=document.createElement('canvas'); r.width=c.height; r.height=c.width;
    const x=r.getContext('2d'); x.translate(r.width,0); x.rotate(Math.PI/2); x.drawImage(c,0,0); return r;
  }

  // ── find the sheet: paper = bright, low-colour region → convex hull → best 4 corners ──
  function detect(c){
    const W=c.width, H=c.height, k=Math.min(1, 260/Math.max(W,H)), w=Math.max(8,Math.round(W*k)), h=Math.max(8,Math.round(H*k)), N=w*h;
    const s=document.createElement('canvas'); s.width=w; s.height=h; const sx=s.getContext('2d'); sx.filter='blur(1px)'; sx.drawImage(c,0,0,w,h);
    const d=sx.getImageData(0,0,w,h).data, g=new Uint8Array(N), sat=new Uint8Array(N), hist=new Array(256).fill(0);
    for(let i=0;i<N;i++){ const r=d[i*4],gg=d[i*4+1],bb=d[i*4+2]; const v=(r*0.299+gg*0.587+bb*0.114)|0; g[i]=v; sat[i]=Math.max(r,gg,bb)-Math.min(r,gg,bb); hist[v]++; }
    let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
    let sB=0,wB=0,best=0,th=128;
    for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*hist[t];
      const mB=sB/wB, mF=(sum-sB)/wF, between=wB*wF*(mB-mF)*(mB-mF); if(between>best){best=between; th=t;} }
    // paper stays colourless even in shadow; wood/desks/brochures have colour
    const lowT=Math.max(70, th*0.6);
    let m=new Uint8Array(N); for(let i=0;i<N;i++) m[i]=(g[i]>lowT && sat[i]<30)?1:0;
    const morph=(src,r,dil)=>{ // square dilate/erode, separable
      const t=new Uint8Array(N), o=new Uint8Array(N);
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let v=dil?0:1; for(let j=-r;j<=r;j++){ const xx=x+j; const q=(xx<0||xx>=w)?(dil?0:0):src[y*w+xx]; if(dil){ if(q){v=1;break;} } else if(!q){v=0;break;} } t[y*w+x]=v; }
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let v=dil?0:1; for(let j=-r;j<=r;j++){ const yy=y+j; const q=(yy<0||yy>=h)?0:t[yy*w+x]; if(dil){ if(q){v=1;break;} } else if(!q){v=0;break;} } o[y*w+x]=v; }
      return o; };
    m=morph(morph(m,2,true),2,false);   // close: fill handwriting & lines
    m=morph(morph(m,3,false),3,true);   // open: cut thin links to other bright things
    const lab=new Int32Array(N), stack=new Int32Array(N); let bestId=0,bestN=0,id=0;
    for(let i=0;i<N;i++){
      if(!m[i]||lab[i]) continue; id++; let n=0,sp=0; stack[sp++]=i; lab[i]=id;
      while(sp){ const p=stack[--sp]; n++; const x=p%w;
        if(x>0&&m[p-1]&&!lab[p-1]){lab[p-1]=id;stack[sp++]=p-1;}
        if(x<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=id;stack[sp++]=p+1;}
        if(p>=w&&m[p-w]&&!lab[p-w]){lab[p-w]=id;stack[sp++]=p-w;}
        if(p<N-w&&m[p+w]&&!lab[p+w]){lab[p+w]=id;stack[sp++]=p+w;} }
      if(n>bestN){bestN=n;bestId=id;}
    }
    const inset=()=>{ const q=0.05; return [[W*q,H*q],[W*(1-q),H*q],[W*(1-q),H*(1-q)],[W*q,H*(1-q)]]; };
    if(bestN < N*0.12) return inset();
    // boundary points (leftmost & rightmost per row) → convex hull
    const pts=[];
    for(let y=0;y<h;y++){ let l=-1,r=-1; for(let x=0;x<w;x++) if(lab[y*w+x]===bestId){ if(l<0) l=x; r=x; } if(l>=0){ pts.push([l,y]); if(r!==l) pts.push([r,y]); } }
    const hull=convexHull(pts); if(hull.length<4) return inset();
    let H2=hull; if(H2.length>48){ const st=H2.length/48; H2=Array.from({length:48},(_,i)=>hull[Math.floor(i*st)]); }
    // largest-area quadrilateral using hull vertices
    const n=H2.length, tri=(a,b,c)=>Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2;
    let bestA=-1, quad=null;
    for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){
      let b1=-1,bi=-1; for(let t=i+1;t<j;t++){ const v=tri(H2[i],H2[t],H2[j]); if(v>b1){b1=v;bi=t;} }
      let b2=-1,bj=-1; for(let t=j+1;t<n+i;t++){ const v=tri(H2[j],H2[t%n],H2[i]); if(v>b2){b2=v;bj=t%n;} }
      if(bi<0||bj<0) continue; if(b1+b2>bestA){ bestA=b1+b2; quad=[H2[i],H2[bi],H2[j],H2[bj]]; }
    }
    if(!quad || bestA < N*0.12) return inset();
    const q=orderCorners(quad.map(p=>[(p[0]+0.5)/k,(p[1]+0.5)/k]));
    if(bestN > N*0.97) return inset();
    return q;
  }
  function convexHull(P){
    P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const lo=[],up=[];
    for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
    for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
    lo.pop(); up.pop(); return lo.concat(up);
  }
  function orderCorners(q){ // → [topLeft, topRight, bottomRight, bottomLeft]
    const cx=q.reduce((a,p)=>a+p[0],0)/4, cy=q.reduce((a,p)=>a+p[1],0)/4;
    const s=q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx)); // clockwise from left (screen coords)
    let st=0,bm=1e18; s.forEach((p,i)=>{ const v=p[0]+p[1]; if(v<bm){bm=v;st=i;} });
    return [0,1,2,3].map(i=>s[(st+i)%4]);
  }
  function polyArea(q){ let s=0; for(let i=0;i<4;i++){ const [x1,y1]=q[i],[x2,y2]=q[(i+1)%4]; s+=x1*y2-x2*y1; } return s/2; }

  // ── straighten: map the 4 corners onto a flat page ──
  function homography(srcPts, dstPts){   // returns 3x3 mapping dst → src
    const A=[], B=[];
    for(let i=0;i<4;i++){ const [x,y]=dstPts[i], [u,v]=srcPts[i];
      A.push([x,y,1,0,0,0,-u*x,-u*y]); B.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); B.push(v); }
    const n=8; for(let i=0;i<n;i++){ let m=i; for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[m][i])) m=r;
      [A[i],A[m]]=[A[m],A[i]]; [B[i],B[m]]=[B[m],B[i]];
      for(let r=0;r<n;r++){ if(r===i) continue; const f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; B[r]-=f*B[i]; } }
    const h=B.map((v,i)=>v/A[i][i]); return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
  }
  function warp(c, q){
    const dist=(p,r)=>Math.hypot(p[0]-r[0],p[1]-r[1]);
    let ow=Math.max(dist(q[0],q[1]),dist(q[3],q[2])), oh=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
    const k=Math.min(1.6, 1654/Math.max(ow,oh)); ow=Math.round(ow*k); oh=Math.round(oh*k);   // ~A4 @ 200dpi max
    const H=homography(q,[[0,0],[ow,0],[ow,oh],[0,oh]]);
    const sd=c.getContext('2d').getImageData(0,0,c.width,c.height).data, SW=c.width, SH=c.height;
    const out=document.createElement('canvas'); out.width=ow; out.height=oh; const ox=out.getContext('2d'), od=ox.createImageData(ow,oh), o=od.data;
    for(let y=0;y<oh;y++){ for(let x=0;x<ow;x++){
      const z=H[6]*x+H[7]*y+1, u=(H[0]*x+H[1]*y+H[2])/z, v=(H[3]*x+H[4]*y+H[5])/z;
      const x0=Math.max(0,Math.min(SW-2,u|0)), y0=Math.max(0,Math.min(SH-2,v|0)), fx=Math.min(1,Math.max(0,u-x0)), fy=Math.min(1,Math.max(0,v-y0));
      const i00=(y0*SW+x0)*4, i10=i00+4, i01=i00+SW*4, i11=i01+4, t=(y*ow+x)*4;
      for(let ch=0;ch<3;ch++) o[t+ch]=(sd[i00+ch]*(1-fx)+sd[i10+ch]*fx)*(1-fy)+(sd[i01+ch]*(1-fx)+sd[i11+ch]*fx)*fy;
      o[t+3]=255; } }
    ox.putImageData(od,0,0); return out;
  }
  // ── clean up like a scanner: even out shadows, white paper, dark ink ──
  function enhance(c, m){
    if(m==='photo') return c;
    const w=c.width, h=c.height, x=c.getContext('2d'), id=x.getImageData(0,0,w,h), d=id.data;
    // background estimate = heavily blurred copy (shrink → grow)
    const s=document.createElement('canvas'); s.width=Math.max(4,w>>4); s.height=Math.max(4,h>>4);
    const sx=s.getContext('2d'); sx.imageSmoothingEnabled=true; sx.filter='blur(2px)'; sx.drawImage(c,0,0,s.width,s.height);
    const bg=document.createElement('canvas'); bg.width=w; bg.height=h; const bx=bg.getContext('2d'); bx.imageSmoothingEnabled=true; bx.drawImage(s,0,0,w,h);
    const b=bx.getImageData(0,0,w,h).data;
    for(let i=0;i<d.length;i+=4){
      if(m==='bw'){
        const gv=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114, gb=Math.max(1,b[i]*0.299+b[i+1]*0.587+b[i+2]*0.114);
        let v=gv/gb*255; v=(v-120)*255/(235-120); v=v<0?0:v>255?255:v; d[i]=d[i+1]=d[i+2]=v;
      } else {
        for(let ch=0;ch<3;ch++){ let v=d[i+ch]/Math.max(1,b[i+ch])*255; v=(v-70)*255/(240-70); d[i+ch]=v<0?0:v>255?255:v; }
      }
    }
    x.putImageData(id,0,0); return c;
  }
  function toJpeg(c, q=0.82){ return new Promise(r=>c.toBlob(bl=>bl.arrayBuffer().then(ab=>r({bytes:new Uint8Array(ab), w:c.width, h:c.height})),'image/jpeg',q)); }

  // ── the full-screen crop screen ──
  function ui(){
    let el=document.getElementById('scanner');
    if(el) return el;
    el=document.createElement('div'); el.id='scanner'; el.className='scanner hidden';
    el.innerHTML=`
      <div class="sc-bar"><button class="sc-btn" id="sc-cancel">✕</button><b id="sc-title">Adjust the corners</b><span class="spacer"></span><button class="sc-btn" id="sc-rotate" title="Rotate">⟳</button></div>
      <div class="sc-stage" id="sc-stage"><canvas id="sc-photo"></canvas><svg id="sc-svg"></svg></div>
      <div class="sc-preview hidden" id="sc-preview"><img id="sc-out" alt="Scanned page"></div>
      <div class="sc-tools" id="sc-crop-tools">
        <button class="sc-btn wide" id="sc-retake">📷 Retake</button>
        <button class="sc-btn wide" id="sc-full">⤢ Whole photo</button>
        <button class="sc-go" id="sc-next">Crop ✓</button></div>
      <div class="sc-tools hidden" id="sc-done-tools">
        <div class="sc-modes"><button data-m="clean">Document</button><button data-m="bw">B&amp;W</button><button data-m="photo">Photo</button></div>
        <button class="sc-btn wide" id="sc-back">✂️ Re-crop</button>
        <button class="sc-go" id="sc-use">Use this page ✓</button></div>
      <input type="file" id="sc-file" accept="image/*" capture="environment" style="display:none">`;
    document.body.appendChild(el);
    el.querySelector('#sc-cancel').onclick=close;
    el.querySelector('#sc-rotate').onclick=()=>{ src.canvas=rotate90(src.canvas); quad=detect(src.canvas); drawStage(); };
    el.querySelector('#sc-retake').onclick=()=>el.querySelector('#sc-file').click();
    el.querySelector('#sc-full').onclick=()=>{ const W=src.canvas.width,H=src.canvas.height; quad=[[0,0],[W,0],[W,H],[0,H]]; drawStage(); };
    el.querySelector('#sc-file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) await openWith(f); };
    el.querySelector('#sc-next').onclick=showResult;
    el.querySelector('#sc-back').onclick=()=>setStep('crop');
    el.querySelector('#sc-use').onclick=finish;
    el.querySelectorAll('.sc-modes button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; showResult(); });
    window.addEventListener('resize',()=>{ if(!el.classList.contains('hidden')&&src) drawStage(); });
    return el;
  }
  function setStep(s){
    const el=ui(); el.querySelector('#sc-stage').classList.toggle('hidden',s!=='crop'); el.querySelector('#sc-crop-tools').classList.toggle('hidden',s!=='crop');
    el.querySelector('#sc-preview').classList.toggle('hidden',s!=='result'); el.querySelector('#sc-done-tools').classList.toggle('hidden',s!=='result');
    el.querySelector('#sc-rotate').classList.toggle('hidden',s!=='crop');
    el.querySelector('#sc-title').textContent = s==='crop' ? 'Drag the corners to the edges of the sheet' : 'Check the scan';
    if(s==='crop') drawStage();
  }
  function drawStage(){
    const el=ui(), stage=el.querySelector('#sc-stage'), cv=el.querySelector('#sc-photo'), svg=el.querySelector('#sc-svg');
    const SW=stage.clientWidth, SH=stage.clientHeight, W=src.canvas.width, H=src.canvas.height;
    const sc=Math.min((SW-40)/W,(SH-40)/H); view={scale:sc, ox:(SW-W*sc)/2, oy:(SH-H*sc)/2};
    cv.width=Math.round(W*sc); cv.height=Math.round(H*sc); cv.style.left=view.ox+'px'; cv.style.top=view.oy+'px';
    cv.getContext('2d').drawImage(src.canvas,0,0,cv.width,cv.height);
    svg.setAttribute('width',SW); svg.setAttribute('height',SH);
    const P=quad.map(p=>[view.ox+p[0]*sc, view.oy+p[1]*sc]);
    svg.innerHTML=`<path d="M0 0H${SW}V${SH}H0Z M${P.map(p=>p.join(' ')).join(' L')}Z" fill="rgba(0,0,0,.45)" fill-rule="evenodd"/>
      <polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="rgba(79,70,229,.12)" stroke="#818cf8" stroke-width="3"/>
      ${P.map((p,i)=>`<circle class="sc-h" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="16" fill="rgba(255,255,255,.9)" stroke="#4f46e5" stroke-width="4"/>`).join('')}`;
    svg.querySelectorAll('.sc-h').forEach(h=>{
      h.addEventListener('pointerdown',e=>{ e.preventDefault(); h.setPointerCapture(e.pointerId); const i=+h.dataset.i, r=svg.getBoundingClientRect();
        const move=ev=>{ const x=(ev.clientX-r.left-view.ox)/view.scale, y=(ev.clientY-r.top-view.oy)/view.scale;
          quad[i]=[Math.max(0,Math.min(W,x)), Math.max(0,Math.min(H,y))]; drawStage(); };
        const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
        window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); });
    });
  }
  let resultCanvas=null;
  function showResult(){
    resultCanvas=enhance(warp(src.canvas,quad), mode);
    const el=ui(); el.querySelector('#sc-out').src=resultCanvas.toDataURL('image/jpeg',0.85);
    el.querySelectorAll('.sc-modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    setStep('result');
  }
  async function finish(){
    const jpg=await toJpeg(resultCanvas);
    const page={...jpg, thumb:resultCanvas.toDataURL('image/jpeg',0.5), file:origFile, quad:quad.map(p=>[...p]), rotated:src.rotations||0, mode, srcCanvas:src.canvas};
    close(); onDone && onDone(page, editingIndex);
  }
  function close(){ ui().classList.add('hidden'); document.body.classList.remove('scanning'); }
  async function openWith(file){
    origFile=file;
    const img=await loadImage(file); src={canvas:toCanvas(img)}; quad=detect(src.canvas);
    const el=ui(); el.classList.remove('hidden'); document.body.classList.add('scanning'); setStep('crop');
  }
  return {
    // start a new scan from a camera/gallery file
    async start(file, cb){ onDone=cb; editingIndex=-1; mode='clean'; try{ await openWith(file); }catch(e){ toast(e.message||e); } },
    // re-open an existing page to re-crop it
    edit(page, index, cb){ onDone=cb; editingIndex=index; origFile=page.file; mode=page.mode||'clean';
      src={canvas:page.srcCanvas}; quad=page.quad.map(p=>[...p]); const el=ui(); el.classList.remove('hidden'); document.body.classList.add('scanning'); setStep('crop'); },
    retakeInput(){ return ui().querySelector('#sc-file'); },
    _detect:detect, _warp:warp, _enhance:enhance
  };
})();

let orderPages=[];
function openOrderRequest(){ if(blockPreview()) return;

function orScan(f){ if(!f) return; Scanner.start(f,(page)=>{ orderPages.push(page); renderOrderPages(); }); }
function orRecrop(i){ Scanner.edit(orderPages[i], i, (page,idx)=>{ orderPages[idx]=page; renderOrderPages(); }); }
function orRemove(i){ orderPages.splice(i,1); renderOrderPages(); }
async function orAddFiles(fl){
  for(const f of Array.from(fl||[])){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) orderPages.push({pdf:f, name:f.name});
    else if(f.type.startsWith('image/')){ await new Promise(r=>Scanner.start(f,(page)=>{ orderPages.push(page); renderOrderPages(); r(); })); }

}
async function sendOrderRequest(){
  if(!orderPages.length) return toast('Scan the order (or add a file) first.');

  try{
    const out=await PDFLib.PDFDocument.create();
    for(const pg of orderPages){
      if(pg.pdf){ const d=await PDFLib.PDFDocument.load(await pg.pdf.arrayBuffer(),{ignoreEncryption:true}); (await out.copyPages(d,d.getPageIndices())).forEach(x=>out.addPage(x)); }
      else { const img=await out.embedJpg(pg.bytes); const W=595.28, H=W*pg.h/pg.w; out.addPage([W,H]).drawImage(img,{x:0,y:0,width:W,height:H}); }
    }
    const bytes=await out.save(), id=uuid(), path=`${filePrefix(dept,me.id)}/requests/${id}.pdf`;
    const up=await sb.storage.from(BUCKET).upload(path,new Blob([bytes],{type:'application/pdf'}),{contentType:'application/pdf'});
    if(up.error) throw up.error;
    const { error }=await sb.from('order_requests').insert({id, serviceman_id:me.id, department:dept, site_id:sid, site_name: st?(st.work_date?dayLabel(st.work_date):st.name):null, title, note, pdf_path:path, pdf_bytes:bytes.length, pages:out.getPageCount(), status:'new'});
    if(error){ await sb.storage.from(BUCKET).remove([path]); throw error; }
    closeModal(); orderPages=[]; toast('📋 Order request sent to the office ✓',4000); scheduleReload();
  }catch(e){ btn.disabled=false; renderOrderPages(); toast('Not sent: '+(e.message||e)+(/order_requests|relation/i.test(e.message||'')?' — run update-8 in Supabase':''),7000); }
}

const searchQ={sites:'', calls:''}; let searchTimer=null, searchSeq=0;
function ensureSearchBar(){

function onSearchInput(v){

  clearTimeout(searchTimer); searchTimer=setTimeout(renderSearch, 220);

function norm(t){ return String(t||'').toLowerCase().replace(/[\s\-\/().]+/g,' ').trim(); }
async function renderSearch(){
  const box=$('search-results'); if(!box) return;
  const q=searchQ[dept].trim(); const my=++searchSeq;
  if(!q){ box.innerHTML=''; $('dash-body').classList.remove('dim'); return; }
  const toks=norm(q).split(' ').filter(Boolean), compact=q.replace(/\s+/g,'').toLowerCase();
  const D=DEPT[dept], list=dJobs();
  const hits=new Map();   // job id -> what matched
  for(const j of list){
    const st=sites.find(x=>x.id===j.site_id)||{}, t=prof(j.serviceman_id);
    const fields=[['Job',j.title],['Docket',j.ref_no],[st.work_date?'Day':D.one[0].toUpperCase()+D.one.slice(1), st.work_date?dayLong(st.work_date)+' '+st.work_date.split('-').reverse().join('/'):st.name],
      ['Address',st.address],['Contact',st.contact],['Man',t.full_name+' '+(t.phone||'')]];
    const hay=norm(fields.map(f=>f[1]).join(' '));
    const hayCompact=fields.map(f=>f[1]||'').join(' ').replace(/\s+/g,'').toLowerCase();
    if(toks.every(k=>hay.includes(k)) || (compact.length>=4 && hayCompact.includes(compact))){
      const where=fields.filter(f=>f[1]&&toks.some(k=>norm(f[1]).includes(k))).map(f=>f[0]);
      hits.set(j.id,{j, where:where.length?where:['Job']});
    }
  }
  // also look inside the conversations
  if(q.length>=3){
    const ids=list.map(j=>j.id);
    if(ids.length){
      const { data }=await sb.from('comments').select('job_id,body').eq('kind','message').ilike('body',`%${q.replace(/[%_]/g,'')}%`).limit(200);
      if(my!==searchSeq) return;
      for(const c of (data||[])){ if(!ids.includes(c.job_id)) continue;
        const j=list.find(x=>x.id===c.job_id); const h=hits.get(j.id)||{j, where:[]};
        if(!h.chat){ h.chat=c.body; h.where.push('Chat'); } hits.set(j.id,h); }
    }
  }
  if(my!==searchSeq) return;
  const rows=[...hits.values()].sort((a,b)=>new Date(b.j.last_activity_at)-new Date(a.j.last_activity_at)).slice(0,100);
  $('dash-body').classList.add('dim');
  const hl=t=>{ let h=esc(t||''); for(const k of toks){ if(k.length<2) continue; h=h.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); } return h; };
  box.innerHTML = rows.length ? `<div class="s-count">${rows.length} result${rows.length===1?'':'s'} for “${esc(q)}” in ${D.label}${rows.length===100?' (first 100)':''}</div>
    <div class="s-table-wrap"><table class="s-table"><thead><tr><th>Job</th><th>Service man</th><th>${dept==='calls'?'Day':'Site'}</th><th>Docket</th><th>Status</th><th>Found in</th></tr></thead><tbody>
    ${rows.map(({j,where,chat})=>{ const st=sites.find(x=>x.id===j.site_id)||{}, t=prof(j.serviceman_id);
      return `<tr onclick="goToJob('${j.id}')" title="Open this job">
        <td class="s-title">${hl(j.title)}${chat?`<div class="s-chat">💬 ${hl(chat.length>90?chat.slice(0,90)+'…':chat)}</div>`:''}</td>
        <td><span class="avatar sm" style="--c:${esc(t.colour)}">${esc(initials(t.full_name))}</span> ${hl(t.full_name)}</td>
        <td>${st.work_date?hl(dayLabel(st.work_date)):hl(st.name)}${st.address?`<div class="s-sub">${hl(st.address)}</div>`:''}</td>
        <td>${hl(j.ref_no||'—')}</td>
        <td>${outcomeTag(j)||'<span class="tag">Open</span>'}${unreadForMe(j)?' <span class="tag red">New</span>':''}</td>
        <td class="s-where">${where.join(', ')}</td></tr>`; }).join('')}
    </tbody></table></div>`
    : `<div class="s-none">No ${D.label} jobs match “${esc(q)}”.</div>`;
}

function openPortal(techId, siteId){
  if(!techId){ if(isOffice){ toast('Add a service man first.'); } return; }
  if(techId!==currentTechId){ currentSiteId=null; calMonth=null; }
  currentTechId=techId; if(siteId) currentSiteId=siteId;
  $('view-dashboard').classList.add('hidden'); $('view-portal').classList.remove('hidden');
  setNav('portal'); renderPortal(); window.scrollTo(0,0);
}
function setSite(id){ currentSiteId=id; renderPortal(); }
function setFilter(f){ jobFilter=f; renderPortal(); }
function renderPortal(){
  const t=prof(currentTechId);
  const D=DEPT[dept];
  const mySites=dSites().filter(s=>s.serviceman_id===currentTechId);
  // Private Calls: day tabs grouped into 6-day weeks, plus any undated customers
  const dated=mySites.filter(s=>s.work_date).sort((a,b)=>a.work_date<b.work_date?-1:1);
  const undated=mySites.filter(s=>!s.work_date);
  const weeks=[...new Set(dated.map(s=>ymd(mondayOf(parseYmd(s.work_date)))))].sort();
  if(dept==='calls' && weeks.length && !weeks.includes(calWeek)){
    const thisWk=ymd(mondayOf(new Date()));
    calWeek = weeks.includes(thisWk) ? thisWk : (weeks.find(w=>w>thisWk) || weeks[weeks.length-1]);
  }
  const weekDays = dept==='calls' && calWeek ? dated.filter(s=>ymd(mondayOf(parseYmd(s.work_date)))===calWeek) : [];
  const visible = dept==='calls' ? [...weekDays, ...undated] : mySites;
  if(!visible.find(s=>s.id===currentSiteId)){
    const today=weekDays.find(s=>s.work_date===todayYmd());
    currentSiteId=(today||visible[0]||{}).id||null;
  }
  const site=visible.find(s=>s.id===currentSiteId);

    html+=`<div class="row"><div><div class="page-title">${esc(t.full_name)} · ${D.label}</div><div class="page-sub">${tJobs.filter(j=>!j.completed).length} open · ${tJobs.filter(j=>j.completed).length} completed${t.phone?' · '+esc(t.phone):''}</div></div></div>`;

  }

  if(dept==='calls'){
    const wi=weeks.indexOf(calWeek);
    html+=`<div class="week-bar">
      ${weeks.length?`<button class="wk-nav" ${wi<=0?'disabled':''} onclick="setWeek(${wi-1})" aria-label="Previous week">‹</button>
      <div class="wk-label"><b>Week of ${parseYmd(calWeek).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})}</b><span>Mon – Sat${calWeek===ymd(mondayOf(new Date()))?' · this week':''}${calWeek<ymd(mondayOf(new Date()))?' · archived &amp; cleared Mon '+addDays(parseYmd(calWeek),21).toLocaleDateString('en-IE',{day:'numeric',month:'short'}):''}</span></div>
      <button class="wk-nav" ${wi>=weeks.length-1?'disabled':''} onclick="setWeek(${wi+1})" aria-label="Next week">›</button>`:`<div class="wk-label"><b>No weeks yet</b><span>Create a 6-day week to get a tab for each day</span></div>`}

      ${isOffice?`${weeks.length?`<button class="btn-danger" onclick="deleteWeek()">🗑 Delete week</button>`:''}<button class="btn-primary wk-new" onclick="openWeekModal()">📅 New 6-day week</button>`:''}
    </div>`;
    if(calOpen()) html+=monthCalendar(mySites, tJobs, site);

  html+=`<div class="site-label">${dept==='calls'?'Days':D.many}</div><div class="site-tabs">${visible.map(s=>{const sj=tJobs.filter(j=>j.site_id===s.id);const o=sj.filter(j=>!j.completed).length;const u=sj.some(unreadForMe);

  const meta=[site.address, site.contact?('Contact: '+site.contact):''].filter(Boolean).map(esc).join(' · ');
  html+=`<div class="site-head">

  // Private Calls day: numbered job boxes — Job 1, Job 2, Job 3… plus a drop box for the next one

      ${!list.length&&!(isOffice&&jobFilter!=='done')?`<div class="empty" style="grid-column:1/-1;margin:0"><div class="big">☕</div>No jobs for this day${jobFilter==='done'?' are done yet':' yet'}.</div>`:''}

  $('view-portal').innerHTML=html;
}
function jobNo(j){ const m=/^job\s*(\d+)/i.exec(j.title||''); return m?+m[1]:null; }
function nextJobNo(siteId){ const sj=jobs.filter(j=>j.site_id===siteId); return Math.max(sj.length, ...sj.map(j=>jobNo(j)||0))+1; }
function slotCard(j,n){
  const u=unreadForMe(j), c=msgCount(j);

function attachSlotDrop(){
  const z=$('slot-new'); if(!z) return; let depth=0;
  z.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; z.classList.add('over'); });
  z.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  z.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) z.classList.remove('over'); });
  z.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; z.classList.remove('over'); slotUpload(e.dataTransfer.files); });
}

// ── Archive to this computer, then clean old Private Calls weeks ──
// Every Monday the week from two weeks back is due for removal. On the office or
// service department login on a computer, SashDash first saves a zip of that week to this
// computer, and only removes it from the server once the save is confirmed.
function cleanupCutoff(){ return ymd(addDays(mondayOf(new Date()),-14)); }   // keep this week + the 2 previous weeks
function weekOf(dateStr){ return ymd(mondayOf(parseYmd(dateStr))); }
function weekName(w){ return parseYmd(w).toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'}); }
function safeName(t){ return String(t||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'untitled'; }

// tiny key-value store in the browser (remembers the chosen archive folder)
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('sashdash',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function kvGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
const canPickFolder = typeof window.showDirectoryPicker==='function';
async function chooseArchiveFolder(){
  if(!canPickFolder) return toast('Your browser can\'t pick a folder — archives go to Downloads. (Use Edge or Chrome on a computer to choose a folder.)',6000);
  try{ const h=await window.showDirectoryPicker({id:'sashdash-archive', mode:'readwrite'}); await kvSet('archiveDir',h); toast(`📁 Archives will be saved in "${h.name}"`); const el=$('arch-folder'); if(el) el.textContent=h.name; return h; }
  catch(e){ return null; }
}
// Save a file: into the chosen folder if possible (returns 'folder'), otherwise a normal download (returns 'download')
async function saveToComputer(blob, filename){
  const h=await kvGet('archiveDir');
  if(h && h.queryPermission){
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){ try{ perm=await h.requestPermission({mode:'readwrite'}); }catch(e){} }
    if(perm==='granted'){
      const fh=await h.getFileHandle(filename,{create:true}); const w=await fh.createWritable(); await w.write(blob); await w.close();
      return {how:'folder', where:h.name};
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  return {how:'download', where:'Downloads'};
}
async function blobToDataUrl(b){ return await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }

// Build a zip of one week (all men, or one man) — PDFs, marked-up PDFs, photos and a readable report per job
async function buildWeekZip(week, techId, onStep){
  const days=sites.filter(x=>deptOf(x)==='calls'&&x.work_date&&weekOf(x.work_date)===week&&(!techId||x.serviceman_id===techId));
  const wj=jobs.filter(j=>days.some(d=>d.id===j.site_id));
  const zip=new JSZip(), root=zip.folder(`SashDash - Private Calls - w-c ${weekName(week)}`);
  const { data:allC }=wj.length ? await sb.from('comments').select('*').in('job_id',wj.map(j=>j.id)).order('created_at') : {data:[]};
  let index=`<h1>Private Calls — week of ${weekName(week)}</h1><p>Archived ${new Date().toLocaleString('en-IE')} by ${esc((realMe||me).full_name)}</p><ul>`;
  let n=0;
  for(const d of days.sort((a,b)=>a.work_date<b.work_date?-1:1)){
    const t=prof(d.serviceman_id), dj=wj.filter(j=>j.site_id===d.id).sort((a,b)=>a.created_at<b.created_at?-1:1);
    if(!dj.length) continue;   // empty day: nothing to archive (still deleted with the week)
    const dayDir=root.folder(safeName(t.full_name)).folder(safeName(dayLabel(d.work_date)));
    for(const j of dj){
      onStep&&onStep(++n, wj.length, j.title);
      const jd=dayDir.folder(safeName(j.title));
      const get=async p=>{ if(!p) return null; const r=await sb.storage.from(BUCKET).download(p); if(r.error) throw new Error('Could not fetch '+p+': '+r.error.message); return r.data; };
      jd.file('sheet-original.pdf', await get(j.pdf_path));
      if(j.marked_path) jd.file('sheet-marked-up.pdf', await get(j.marked_path));
      const cm=(allC||[]).filter(c=>c.job_id===j.id); let chat='', pi=0;
      for(const c of cm){
        const a=prof(c.author_id), when=new Date(c.created_at).toLocaleString('en-IE');
        if(c.kind==='event'){ chat+=`<p class="evt">${esc(when)} · ${esc(a.full_name)} · ${esc(c.body)}</p>`; continue; }
        let img='';
        if(c.photo_path){ const b=await get(c.photo_path); const fn=`photo-${++pi}.jpg`; jd.folder('photos').file(fn,b); img=`<br><a href="photos/${fn}"><img src="${await blobToDataUrl(b)}"></a>`; }
        chat+=`<div class="msg"><b>${esc(a.full_name)}</b>${roleLabel(a.role)?' ('+roleLabel(a.role)+')':''} <span>${esc(when)}</span><br>${esc(c.body||'').replace(/\n/g,'<br>')}${img}</div>`;
      }
      jd.file('report.html', `<!doctype html><meta charset="utf-8"><title>${esc(j.title)}</title>
<style>body{font-family:Arial,sans-serif;max-width:820px;margin:20px auto;padding:0 14px;color:#111}table{border-collapse:collapse;width:100%}td{border:1px solid #ccc;padding:5px 8px}td:first-child{background:#f1f5f9;font-weight:bold;width:30%}.msg{border:1px solid #ddd;border-radius:8px;padding:8px 10px;margin:8px 0}.msg span{color:#666;font-size:12px}.msg img{max-width:100%;max-height:420px;margin-top:6px;border:1px solid #ccc}.evt{color:#666;font-style:italic;font-size:13px}</style>
<h2>${esc(j.title)}</h2><table>
<tr><td>Service man</td><td>${esc(t.full_name)}${t.phone?' · '+esc(t.phone):''}</td></tr>
<tr><td>Day</td><td>${esc(dayLong(d.work_date))}</td></tr>
<tr><td>Docket / ref</td><td>${esc(j.ref_no||'—')}</td></tr>
<tr><td>Sent</td><td>${new Date(j.created_at).toLocaleString('en-IE')}</td></tr>
<tr><td>Status</td><td>${outcomeText(j)}${j.completed?' — '+new Date(j.completed_at).toLocaleString('en-IE'):''}</td></tr></table>
<p>📄 <a href="sheet-original.pdf">Original sheet</a>${j.marked_path?' · ✏️ <a href="sheet-marked-up.pdf">Marked-up sheet</a>':''}</p>
<h3>Conversation</h3>${chat||'<p><i>No messages.</i></p>'}`);
      index+=`<li>${esc(t.full_name)} · ${esc(dayLabel(d.work_date))} · <a href="${encodeURI(safeName(t.full_name)+'/'+safeName(dayLabel(d.work_date))+'/'+safeName(j.title)+'/report.html')}">${esc(j.title)}</a> — ${outcomeText(j)}</li>`;
    }
  }
  root.file('index.html', `<!doctype html><meta charset="utf-8"><title>Week of ${weekName(week)}</title><body style="font-family:Arial;max-width:820px;margin:20px auto">${index}</ul></body>`);
  const blob=await zip.generateAsync({type:'blob', compression:'STORE'});
  return {blob, jobs:wj.length, days, filename:`SashDash - Private Calls - w-c ${weekName(week)}${techId?' - '+safeName(prof(techId).full_name):''}.zip`};
}

// ⬇ Download week (any time) — every Private Calls man, a folder each
async function downloadWeek(week){
  week=week||calWeek; if(!week) return;
  try{
    toast('Preparing download…',60000);
    const z=await buildWeekZip(week, null, (i,n)=>toast(`Preparing download… job ${i} of ${n}`,60000));
