// ── PDF rendering + mark-up ───────────────────────────────────────
async function renderPdf(){
  commitTextEditor();
  if(!pdfDoc) return;
  const token=++renderToken, wrap=$('pdf-pages'), scroller=$('pdf-scroll');
  if(scroller.offsetParent===null) return;   // pane hidden (mobile chat tab)
  const avail=Math.max(280, scroller.clientWidth - (window.innerWidth<720?16:32));
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const frag=document.createDocumentFragment(); const views=[];
  for(let i=1;i<=pdfDoc.numPages;i++){
    const page=await pdfDoc.getPage(i); if(token!==renderToken) return;
    const base=page.getViewport({scale:1});
    const scale=Math.min(avail/base.width, 2.2)*zoomLevel;
    const vp=page.getViewport({scale});
    const box=document.createElement('div'); box.className='pdf-page'; box.style.width=vp.width+'px'; box.style.height=vp.height+'px';
    const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr); cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    const ink=document.createElement('canvas'); ink.className='ink'; ink.width=cv.width; ink.height=cv.height; ink.style.width=vp.width+'px'; ink.style.height=vp.height+'px';
    box.append(cv,ink); frag.appendChild(box);
    views.push({page, vp, cv, ink, dpr, idx:i-1});
  }
  if(token!==renderToken) return;
  wrap.innerHTML=''; wrap.appendChild(frag); pageViews=views;
  $('zoom-lbl').textContent=Math.round(zoomLevel*100)+'%';
  views.forEach(v=>{ attachInk(v); drawInk(v); });
  for(const v of views){
    if(token!==renderToken) return;
    await v.page.render({canvasContext:v.cv.getContext('2d'), viewport:v.page.getViewport({scale:v.vp.scale*v.dpr})}).promise.catch(()=>{});
  }
}
function zoom(d){ zoomLevel = d===0?1:Math.min(4,Math.max(0.5, +(zoomLevel*(d>0?1.25:0.8)).toFixed(3))); renderPdf(); }
function toggleMarking(){ if(blockPreview()) return; setMarking(!marking); }
function setMarking(on){

function setTool(t){ commitTextEditor(); setToolQuiet(t); }
// Switch tool without closing a note that's being typed
function setToolQuiet(t){ tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('pdf-scroll').classList.toggle('tool-none', t==='none');
  $('mark-hint').textContent = t==='none' ? 'Note placed — you can scroll now. Tap T Text again to add another note (or to change/move one).'
    : t==='text' ? 'Text — tap the sheet where you want ONE note. Tap an existing note to change it, or drag it to move it.'
    : t==='erase' ? 'Eraser — tap any mark or note to remove it.'
    : 'Drawing on — drag across an item to strike it through. Tap ✏️ Mark up again to scroll.'; }
function setColour(c){ colour=c; document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.c===c)); if(tool==='erase') setTool('line'); }
function setDirty(v){ dirty=v; updateSaveBtn(); }
function updateSaveBtn(){ const b=$('save-btn'); b.classList.toggle('dirty',dirty); b.innerHTML=dirty?'💾 Save':'✓ Saved'; b.disabled=!dirty; $('undo-btn').disabled=!strokes.length; }

function toPdf(v,e){ const r=v.ink.getBoundingClientRect(); return v.vp.convertToPdfPoint(e.clientX-r.left, e.clientY-r.top).map(n=>+n.toFixed(2)); }
function toView(v,pt){ return v.vp.convertToViewportPoint(pt[0],pt[1]); }
// ── Text notes ─────────────────────────────────────────────────────
// stored as {p, t:'text', c, fs, pts:[[x,y]] (top-left, PDF units), text}
const TXT_FONT='Helvetica, Arial, sans-serif';
let measureCtx=null;
function textBoxPdf(s){
  measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
  measureCtx.font=`${s.fs}px ${TXT_FONT}`;
  const lines=String(s.text||'').split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
  const w=Math.max(s.fs, ...lines.map(l=>measureCtx.measureText(l).width))+pad*2;
  return {lines, pad, lh, w, h:lines.length*lh+pad*2};
}
function textRectView(v,s){ const [x,y]=toView(v,s.pts[0]), b=textBoxPdf(s), k=v.vp.scale; return {x,y,w:b.w*k,h:b.h*k}; }
function hitText(v,x,y){ for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; if(s.t!=='text'||s.p!==v.idx) continue;
  const r=textRectView(v,s); if(x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-4&&y<=r.y+r.h+4) return s; } return null; }
function defaultFontSize(v){ const w=Math.abs(v.vp.viewBox[2]-v.vp.viewBox[0])||595; return Math.round(Math.max(9, Math.min(22, w/46))); }
let textEd=null;   // {el, v, s (existing or null), pt}
function openTextEditor(v, s, pt){
  commitTextEditor();
  const fs=s?s.fs:defaultFontSize(v), c=s?s.c:colour, k=v.vp.scale;
  const [x,y]=toView(v, s?s.pts[0]:pt);
  const el=document.createElement('textarea'); el.className='txt-ed'; el.rows=1; el.value=s?s.text:'';
  el.placeholder='Type a note…';
  Object.assign(el.style,{left:x+'px', top:y+'px', fontSize:(fs*k)+'px', color:c, borderColor:c, padding:(fs*0.35*k)+'px', lineHeight:'1.25'});
  v.ink.parentElement.appendChild(el);
  if(s){ s._hidden=true; drawInk(v); }
  textEd={el, v, s, pt, fs, c};
  const grow=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; el.style.width='auto'; el.style.width=Math.max(140, el.scrollWidth+4)+'px'; };
  el.addEventListener('input',grow);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); commitTextEditor(); } if(e.key==='Escape'){ commitTextEditor(true); } });
  el.addEventListener('blur',()=>setTimeout(()=>{ if(textEd&&textEd.el===el) commitTextEditor(); },120));
  setTimeout(()=>{ grow(); el.focus(); },30);
}
// Phone typing panel for notes — a real text field the man taps, so the keyboard always opens (Android + iPhone)
let noteSheet=null;
function openNoteSheet(v, s, pt){
  closeNoteSheet();
  const fs=s?s.fs:defaultFontSize(v), c=s?s.c:colour;
  if(s){ s._hidden=true; drawInk(v); }

  el.innerHTML=`<div class="ns-head"><b>${s?'✎ Change note':'📝 New note'}</b><span>${s?'Edit the text, or delete the note':'It goes where you tapped'}</span></div>

    <div class="ns-btns">${s?'<button type="button" class="btn-danger" id="ns-del">🗑 Delete</button>':''}<span style="flex:1"></span>
      <button type="button" class="btn-outline" id="ns-cancel">Cancel</button><button type="button" class="btn-primary" id="ns-ok">✓ ${s?'Save':'Add note'}</button></div>`;
  document.body.appendChild(el);
  const ta=el.querySelector('#ns-text'); ta.value=s?s.text:'';

  el.querySelector('#ns-cancel').onclick=()=>closeNoteSheet(true);

  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); closeNoteSheet(false); } });
  try{ ta.focus({preventScroll:true}); }catch(e){ ta.focus(); }   // still inside the tap → keyboard opens; if not, one tap on the field does it
}
function closeNoteSheet(cancel){
  if(!noteSheet) return; const {el,v,s,pt,fs,c}=noteSheet; noteSheet=null;
  const val=(el.querySelector('#ns-text').value||'').replace(/\s+$/,''); el.remove();
  if(s){ delete s._hidden;
    if(!cancel){ if(!val){ strokes=strokes.filter(x=>x!==s); setDirty(true); } else if(val!==s.text){ s.text=val; setDirty(true); } } }
  else if(!cancel && val){ strokes.push({p:v.idx, t:'text', c, fs, pts:[pt], text:val}); setDirty(true); }

}
function commitTextEditor(cancel){
  if(noteSheet) closeNoteSheet(false);
  if(!textEd) return; const {el,v,s,pt,fs,c}=textEd; textEd=null;
  const val=el.value.replace(/\s+$/,''); el.remove();
  if(s){ delete s._hidden;
    if(!cancel){ if(!val){ strokes=strokes.filter(x=>x!==s); setDirty(true); } else if(val!==s.text){ s.text=val; setDirty(true); } } }
  else if(!cancel && val){ strokes.push({p:v.idx, t:'text', c, fs, pts:[pt], text:val}); setDirty(true); }

// pdf-lib's built-in Helvetica only knows Western characters — swap the rest
function pdfSafe(t){ return String(t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\n\x20-\x7E -ÿ€]/g,'?'); }

function attachInk(v){
  let cur=null;
  v.ink.addEventListener('pointerdown',e=>{
    if(!marking) return; e.preventDefault(); v.ink.setPointerCapture(e.pointerId);
    const p=toPdf(v,e);
    if(tool==='text'){
      commitTextEditor();
      const r=v.ink.getBoundingClientRect(), s=hitText(v,e.clientX-r.left,e.clientY-r.top);
      cur={text:true, s, start:p, orig:s?[...s.pts[0]]:null, moved:false, touch:e.pointerType!=='mouse'}; return;
    }
    if(tool==='erase'){ eraseAt(v,e); cur={erase:true}; return; }
    cur={p:v.idx, t:tool, c:colour, w: tool==='hl'?10:(tool==='pen'?1.8:2.4), pts:[p, p]};
    strokes.push(cur); drawInk(v);
  });
  v.ink.addEventListener('pointermove',e=>{
    if(!cur) return; e.preventDefault();
    if(cur.erase){ eraseAt(v,e); return; }
    const p=toPdf(v,e);
    if(cur.text){
      if(cur.s && (cur.moved || Math.hypot(p[0]-cur.start[0],p[1]-cur.start[1])>3)){
        cur.moved=true; cur.s.pts[0]=[+(cur.orig[0]+p[0]-cur.start[0]).toFixed(2), +(cur.orig[1]+p[1]-cur.start[1]).toFixed(2)]; drawInk(v);
      }
      return;
    }
    if(cur.t==='line'){
      // snap to horizontal when nearly level — perfect for striking an item through
      const a=cur.pts[0], ang=Math.abs(Math.atan2(p[1]-a[1], p[0]-a[0])*180/Math.PI);
      if(ang<8||ang>172) p[1]=a[1];
      cur.pts[1]=p;
    } else {
      const last=cur.pts[cur.pts.length-1];
      if(Math.hypot(p[0]-last[0],p[1]-last[1])>0.6) cur.pts.push(p);
    }
    drawInk(v);
  });
  const end=()=>{
    if(!cur) return;
    if(cur.text){
      const c=cur; cur=null;
      if(c.moved){ setDirty(true); drawInk(v); }
      else if(c.touch) openNoteSheet(v, c.s, c.start);          // phones: typing panel at the bottom (keyboard always opens)
      else setTimeout(()=>openTextEditor(v, c.s, c.start), 0);   // computer: type right on the sheet
      setToolQuiet('none');   // one note per tap of the Text button — stops stray boxes when scrolling on a phone
      return;
    }
    if(!cur.erase){
      const [a,b]=[cur.pts[0],cur.pts[cur.pts.length-1]];
      if(cur.t!=='pen' && Math.hypot(b[0]-a[0],b[1]-a[1])<3){ strokes.pop(); }   // ignore accidental taps
      else { if(cur.t==='pen'&&cur.pts.length>2) cur.pts.splice(1,1); setDirty(true); }
    }
    cur=null; drawInk(v); updateSaveBtn();
  };
  v.ink.addEventListener('pointerup',end); v.ink.addEventListener('pointercancel',end);
}
function eraseAt(v,e){
  const r=v.ink.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const hit=(s)=>{ if(s.p!==v.idx) return false;
    if(s.t==='text'){ const q=textRectView(v,s); return x>=q.x-4&&x<=q.x+q.w+4&&y>=q.y-4&&y<=q.y+q.h+4; }
    const tol=Math.max(10, s.w*v.vp.scale/2+6);
    for(let i=0;i<s.pts.length-1;i++){ const [ax,ay]=toView(v,s.pts[i]), [bx,by]=toView(v,s.pts[i+1]);
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)):0;
      if(Math.hypot(x-(ax+t*dx), y-(ay+t*dy))<tol) return true; } return false; };
  const before=strokes.length; strokes=strokes.filter(s=>!hit(s));
  if(strokes.length!==before){ setDirty(true); drawInk(v); }
}
function drawInk(v){
  const ctx=v.ink.getContext('2d'); ctx.setTransform(v.dpr,0,0,v.dpr,0,0); ctx.clearRect(0,0,v.ink.width,v.ink.height);
  paintStrokes(ctx, v, strokes);
}
// Draw a list of marks onto a page (used on screen and when printing)
function paintStrokes(ctx, v, list){
  for(const s of list){
    if(s.p!==v.idx||!s.pts.length||s._hidden) continue;
    if(s.t==='text'){
      const b=textBoxPdf(s), k=v.vp.scale, [x,y]=toView(v,s.pts[0]);
      ctx.save(); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(x,y,b.w*k,b.h*k);
      ctx.strokeStyle=s.c; ctx.lineWidth=Math.max(1,1.2*k); ctx.strokeRect(x,y,b.w*k,b.h*k);
      ctx.fillStyle=s.c; ctx.font=`${s.fs*k}px ${TXT_FONT}`; ctx.textBaseline='alphabetic';
      b.lines.forEach((l,i)=>ctx.fillText(l, x+b.pad*k, y+(b.pad+s.fs*0.95+i*b.lh)*k));
      ctx.restore(); continue;
    }
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=s.c; ctx.lineWidth=s.w*v.vp.scale;
    if(s.t==='hl'){ ctx.globalAlpha=.35; ctx.globalCompositeOperation='multiply'; }
    ctx.beginPath(); s.pts.forEach((pt,i)=>{ const [x,y]=toView(v,pt); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore();
  }
}
function redrawAllInk(){ pageViews.forEach(drawInk); updateSaveBtn(); }
function undoStroke(){ if(!strokes.length) return; strokes.pop(); setDirty(true); redrawAllInk(); }
function clearStrokes(){ if(!strokes.length) return; if(!confirm('Remove all marks on this sheet?')) return; strokes=[]; setDirty(true); redrawAllInk(); }

function hexRgb(h){ const n=parseInt(h.slice(1),16); return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255); }
// Burn the marks into a copy of the original PDF (original stays untouched)
async function buildMarkedPdf(bytes, list){
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}); const pages=doc.getPages();
  let font=null;
  for(const s of list){
    const pg=pages[s.p]; if(!pg||!s.pts.length) continue;
    if(s.t==='text'){
      font = font || await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      const lines=pdfSafe(s.text).split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
      const w=Math.max(s.fs, ...lines.map(l=>font.widthOfTextAtSize(l,s.fs)))+pad*2, h=lines.length*lh+pad*2;
      const [x,y]=s.pts[0];
      pg.drawRectangle({x, y:y-h, width:w, height:h, color:PDFLib.rgb(1,1,1), opacity:0.92, borderColor:hexRgb(s.c), borderWidth:1.2});
      lines.forEach((l,i)=>pg.drawText(l,{x:x+pad, y:y-pad-s.fs*0.95-i*lh, size:s.fs, font, color:hexRgb(s.c)}));
      continue;
    }
    let d=s.pts.map((q,i)=>(i?'L':'M')+q[0]+' '+(-q[1])).join(' ');
    if(s.pts.length===1) d+=` L${s.pts[0][0]+0.1} ${-s.pts[0][1]}`;
    pg.drawSvgPath(d,{x:0,y:0,borderColor:hexRgb(s.c),borderWidth:s.w,borderOpacity:s.t==='hl'?0.4:1,
      borderLineCap:PDFLib.LineCapStyle.Round, blendMode:s.t==='hl'?PDFLib.BlendMode.Multiply:undefined});
  }
  return await doc.save();
}

async function photoUrl(path){

async function doReschedule(){
  const j=jobs.find(x=>x.id===reschedId); if(!j) return closeModal();
  const from=sites.find(x=>x.id===j.site_id)||{};
  const picked=document.querySelector('input[name=rs]:checked');
  const newTid=$('rs-tech').value, oldTid=j.serviceman_id, manChange=newTid!==oldTid;
  if(stopGuard(newTid)) return;
  const day=picked?picked.value:($('rs-date').value||(manChange?from.work_date:''));
  if(!day) return toast('Pick the new day (or a different service man).');
  if(day===from.work_date && !manChange) return toast("That's the day and man it's already on.");
  if(parseYmd(day).getDay()===0) return toast('Sunday isn\'t a working day — pick Monday to Saturday.');
  const btn=$('m-save'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Moving…';

      for(let i=0;i<6;i++){ const d=ymd(addDays(mon,i)); if(!sites.some(x=>x.serviceman_id===tid&&deptOf(x)==='calls'&&x.work_date===d)) rows.push({serviceman_id:tid, department:'calls', work_date:d, name:dayLabel(d)}); }
      const { error }=await sb.from('sites').insert(rows); if(error) throw error;
      await loadData(); target=sites.find(x=>x.serviceman_id===tid&&deptOf(x)==='calls'&&x.work_date===day);
      if(!target) throw new Error('Could not create the new day');
    }
    // becomes the next job number on the new day (keeps any name after the number)
    const n=nextJobNo(target.id), rest=(j.title||'').replace(/^job\s*\d+\s*/i,'');

    const wasFlagged=['rebook','not_home'].includes(jobOutcome(j));
    if(wasFlagged) await saveHistRows([histRow(j)]);
    if(wasFlagged){ upd.outcome=null; upd.completed=false; upd.completed_at=null; }   // back in the diary → out of the folder
    let movedPhotos=[];
    if(manChange){
      // files live in each man's own folder — move them so the new man can open them
      const oldPre=filePrefix('calls',oldTid)+'/', newPre=filePrefix('calls',tid)+'/';
      const mv=async p=>{ if(!p||!p.startsWith(oldPre)) return p; const np=newPre+p.slice(oldPre.length);
        const r=await sb.storage.from(BUCKET).move(p,np); if(r.error) throw r.error; return np; };
      upd.serviceman_id=tid; upd.pdf_path=await mv(j.pdf_path); upd.marked_path=await mv(j.marked_path);
      const { data:ph }=await sb.from('comments').select('id,photo_path').eq('job_id',j.id).not('photo_path','is',null);
      for(const c of (ph||[])) movedPhotos.push({id:c.id, path:await mv(c.photo_path)});
    }
    const { error }=await sb.from('jobs').update(upd).eq('id',j.id);
    if(error) throw error;
    for(const c of movedPhotos){ const r=await sb.from('comments').update({photo_path:c.path}).eq('id',c.id);
      if(r.error){ toast('Job moved, but photos need update-4 in Supabase: '+r.error.message,8000); break; } }
    const why=$('rs-why').value.trim(), parts=[];
    if(day!==from.work_date) parts.push(`from ${dayLong(from.work_date)} to ${dayLong(day)}`);
    if(manChange) parts.push(`from ${prof(oldTid).full_name} to ${prof(tid).full_name}`);
    await sb.from('comments').insert({job_id:j.id, author_id:me.id, body:`📅 Rescheduled ${parts.join(', and ')}${why?' — '+why:''}`});
    closeModal();
    const fromFolder=!$('view-dashboard').classList.contains('hidden');
    calWeek=ymd(mondayOf(parseYmd(day))); currentSiteId=target.id; currentTechId=tid;
    if(job&&job.id===j.id){ Object.assign(job,upd); updateJobHeader(); }
    await loadData(); rerenderCurrent(); if(fromFolder&&openFolder) renderFolderPanel();
    toast(`Moved to ${manChange?firstName(prof(tid).full_name)+' · ':''}${dayLong(day)} ✓${wasFlagged?' — removed from the folder':''}`);
  }catch(e){ btn.disabled=false; btn.textContent='📅 Move job'; toast('Could not reschedule: '+(e.message||e),6000); }
}

async function printJob(id){
  $('jv-menu').classList.add('hidden');
  const jid=id||(job&&job.id); if(!jid) return;
  toast('Preparing print…',20000);
  try{
    const { data:j, error }=await sb.from('jobs').select(JOB_COLS+',markup').eq('id',jid).single();
    if(error) throw error;
    const marks = (job && job.id===jid) ? strokes : (j.markup||[]);   // include unsaved marks if it's open
    const site=sites.find(x=>x.id===j.site_id)||{}, t=prof(j.serviceman_id), D=DEPT[deptOf(j)];
    // 1. sheet pages with marks burnt in
    const f=await sb.storage.from(BUCKET).download(j.pdf_path); if(f.error) throw f.error;
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.data.arrayBuffer())}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i), base=pg.getViewport({scale:1}), vp=pg.getViewport({scale:Math.min(2.2, 1400/base.width)});
      const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx, viewport:vp}).promise;
      paintStrokes(ctx, {vp, idx:i-1}, marks);
      pages.push(c.toDataURL('image/jpeg',0.9));
    }
    // 2. conversation (with photos)
    const { data:cm }=await sb.from('comments').select('*').eq('job_id',jid).order('created_at');
    const chat=[];
    for(const c of (cm||[])){
      const a=prof(c.author_id), when=new Date(c.created_at).toLocaleString('en-IE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      if(c.kind==='event'){ chat.push(`<div class="p-evt">${esc(when)} · ${esc(a.full_name)} · ${esc(c.body)}</div>`); continue; }
      let img=''; if(c.photo_path){ try{ img=`<img class="p-photo" src="${await photoUrl(c.photo_path)}">`; }catch(e){ img='<i>[photo unavailable]</i>'; } }
      chat.push(`<div class="p-msg"><div class="p-who"><b>${esc(a.full_name)}</b>${roleLabel(a.role)?' ('+roleLabel(a.role)+')':''} · ${esc(when)}</div>${c.body?`<div>${esc(c.body).replace(/\n/g,'<br>')}</div>`:''}${img}</div>`);
    }
    const where=site.work_date?dayLong(site.work_date):(site.name||'');
    const fmtD=x=>x?new Date(x).toLocaleString('en-IE',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
    $('print-root').innerHTML=`
      <div class="p-head"><img src="sdwindows-logo.png" class="p-logo"><div><div class="p-title">${esc(j.title)}</div>
        <div class="p-sub">${D.label} · ${esc(where)} · ${esc(t.full_name)}</div></div></div>
      <table class="p-info">
        <tr><td>Service man</td><td>${esc(t.full_name)}</td><td>Department</td><td>${D.label}</td></tr>
        <tr><td>${site.work_date?'Day':D.one[0].toUpperCase()+D.one.slice(1)}</td><td>${esc(where)}</td><td>Docket / ref</td><td>${esc(j.ref_no||'—')}</td></tr>
        <tr><td>Sent</td><td>${fmtD(j.created_at)}</td><td>Status</td><td><b>${outcomeText(j)}</b>${j.completed?' '+fmtD(j.completed_at):''}</td></tr>
        ${j.customer_phone||j.customer_phone2||j.customer_email?`<tr><td>Customer phone</td><td>${esc([j.customer_phone,j.customer_phone2].filter(Boolean).join(' · ')||'—')}</td><td>Email</td><td>${esc(j.customer_email||'—')}</td></tr>`:''}
        ${!site.work_date&&(site.address||site.eircode||siteContacts(site).length)?`<tr><td>Address</td><td>${esc([site.address,site.eircode?normEir(site.eircode):''].filter(Boolean).join(' · ')||'—')}</td><td>Contact${siteContacts(site).length>1?'s':''}</td><td>${siteContacts(site).map(c=>esc([c.name,c.position,c.phone].filter(Boolean).join(' · '))).join('<br>')||'—'}</td></tr>`:''}
      </table>
      ${await sigReportHtml(jid)}
      <h2 class="p-h">Sheet ${marks.length?'(with mark-ups)':''}</h2>
      ${pages.map((src,i)=>`<div class="p-page ${i===0?'p-first':''}"><img src="${src}"><div class="p-pno">Page ${i+1} of ${pages.length}</div></div>`).join('')}
      <h2 class="p-h p-break">Conversation</h2>
      ${chat.length?chat.join(''):'<p><i>No messages.</i></p>'}
      <div class="p-foot">Printed ${new Date().toLocaleString('en-IE')} by ${esc((realMe||me).full_name)} · SashDash · Sean Doyle Windows Ltd</div>`;
    // wait for the photos & pages to load before opening the print dialog
    await Promise.all([...$('print-root').querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    $('toast').classList.add('hidden');
    document.body.classList.add('printing');
    setTimeout(()=>window.print(),50);
  }catch(e){ toast('Could not prepare print: '+(e.message||e),6000); }
}
window.addEventListener('afterprint',()=>{ document.body.classList.remove('printing'); $('print-root').innerHTML=''; });

// Show / hide the password being typed
function togglePw(btn){
  const inp=btn.parentElement.querySelector('input'); const show=inp.type==='password';
  inp.type=show?'text':'password'; btn.classList.toggle('on',show);
  btn.setAttribute('aria-label',show?'Hide password':'Show password'); btn.title=show?'Hide password':'Show password';
  inp.focus(); const v=inp.value; inp.value=''; inp.value=v;   // keep cursor at the end
}

function waMorningN(){ return Math.max(1, +waCfg.morning_jobs||3); }

// ── phone numbers: WhatsApp wants 353871234567 ──
function waDigits(p){ let s=String(p||'').trim(), d=s.replace(/[^\d]/g,''); if(!d) return '';
  if(s.startsWith('+')) return d; if(d.startsWith('00')) return d.slice(2); if(d.startsWith('0')) return '353'+d.slice(1); return d; }
function waIsMobile(p){ const s=String(p||'').trim(), d=waDigits(s); if(!d) return false;
  if(d.startsWith('353')) return /^3538[3-9]\d{7}$/.test(d);
  return (s.startsWith('+')||s.startsWith('00')) && d.length>=10 && d.length<=15; }
function waMobileOf(j){ for(const p of [j.customer_phone, j.customer_phone2, j.ref_no]) if(p && waIsMobile(p)) return waDigits(p); return null; }
function waShowNum(d){ d=String(d||''); if(d.startsWith('353')){ const l='0'+d.slice(3); return l.slice(0,3)+' '+l.slice(3,6)+' '+l.slice(6); } return d?'+'+d:''; }

// ── names: "Job 3 – Tom Brennan" → "Tom" · "Mrs Byrne, Lucan" → "Mrs Byrne" · "Pat & Ann Kelly" → "Pat & Ann" ──
function waCustName(j){ return String((j&&j.title)||'').replace(/^job\s*\d+\s*[-–·:]?\s*/i,'').trim(); }
function waFirst(j){ if(j && j.wa_name) return j.wa_name;
  const n=waCustName(j).split(',')[0].trim(); if(!n) return '';
  const w=n.split(/\s+/);
  if(/^(mr|mrs|ms|miss|dr)\.?$/i.test(w[0]) && w[1]) return w[0]+' '+w[w.length-1];
  if(w[1] && (w[1]==='&'||/^and$/i.test(w[1])) && w[2]) return w.slice(0,3).join(' ');
  return w[0]; }

// ── the day in job order, and the time each customer is told ──
function waIsClosed(j){ return !!(j.completed || jobOutcome(j)); }
function waDayList(site){
  const sj=jobs.filter(j=>j.site_id===site.id).sort((a,b)=>a.created_at<b.created_at?-1:1);
  const num=new Map(sj.map((j,i)=>[j.id, jobNo(j)||i+1]));
  return sj.sort((a,b)=>num.get(a.id)-num.get(b.id)).map(j=>({j, n:num.get(j.id)})); }
function waWinFor(j,n){ const a=(j&&j.avail)||'';
  if(a==='am') return 'between 8am and 12pm'; if(a==='pm') return 'between 12pm and 5pm'; if(a==='any') return 'at any time during the day';
  const c=availParse(a); if(c) return (c.dir==='after'?'after ':'before ')+ampm(c.t);
  return n<=waMorningN() ? 'between 8am and 12pm' : 'between 12pm and 5pm'; }
function waBookingText(name, day, time, extra){
  return `Hi ${name||'there'}, this is Sean Doyle Windows. Your service call is booked for ${day}, ${time}. ${extra||'We look forward to seeing you.'} Please confirm below.`; }
function waDay(d){ const x=parseYmd(d); return x.toLocaleDateString('en-IE',{weekday:'long'})+' '+x.getDate()+' '+x.toLocaleDateString('en-IE',{month:'long'}); }   // "Thursday 22 October" — same as the messages
function waShort(ts){ return new Date(ts).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}); }
// the same rules as the database's wa_schedule: 10am, never a Sunday (moves to Saturday), skip what's past
function waAt(work,back){ const d=addDays(parseYmd(work),-back); const sun=d.getDay()===0; if(sun) d.setDate(d.getDate()-1); d.setHours(10,0,0,0); return {d, sun}; }
function waPlan(work){ const now=new Date(), b=waAt(work,7), r=waAt(work,3), y=waAt(work,1);
  const book=b.d>now?b.d:null, bookDay=ymd(book||now), out=[{k:'booking', at:book, sun:b.sun&&!!book}];
  if(r.d>now && ymd(r.d)>bookDay && ymd(r.d)<ymd(y.d)) out.push({k:'reminder3', at:r.d, sun:r.sun});
  if(y.d>now && ymd(y.d)>bookDay) out.push({k:'daybefore', at:y.d, sun:y.sun});
  return out; }
function waWhen(d){ return d.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})+' · '+ampm(d.getHours()*60+d.getMinutes()); }
function waSchedHtml(name, mob, work, job){
  if(!work) return '';
  const L={booking:'Booking message', reminder3:'3-day reminder', daybefore:'Day-before reminder'}, sent=job&&job.wa_status&&!['no_wa','stopped'].includes(job.wa_status);
  const rows=waPlan(work).map((x,i)=>{ let sub;
    if(x.k==='booking'){
      if(sent) sub=job.wa_go?`Sent ${esc(waWhen(new Date(job.wa_go)))}`:'Sent';
      else sub=x.at?`${esc(waWhen(x.at))}${x.sun?' <i>(Sunday moves to Saturday)</i>':''}<br><i>— after you press 📲 Send on the day page</i>`:'As soon as you press 📲 Send on the day page<br><i>(the visit is less than a week away, so no waiting)</i>';
    } else sub=`${esc(waWhen(x.at))}${x.sun?' <i>(Sunday moves to Saturday)</i>':''}${x.k==='reminder3'?'<br><i>— asks again to confirm if there\'s no reply yet</i>':''}`;
    return `<div class="r ${x.k==='booking'&&sent?'past':''}"><span class="d">${x.k==='booking'&&sent?'✓':i+1}</span><span><b>${L[x.k]}</b><small>${sub}</small></span></div>`; }).join('');
  const skipped=3-waPlan(work).length;
  return `<div class="wa-sched"><div class="sh">📅 When ${esc(name)} gets messages</div>${rows}${skipped?`<div class="to">${skipped===1?'One reminder is':'Two reminders are'} left out — the visit is too soon for ${skipped===1?'it':'them'}.</div>`:''}<div class="to">To ${esc(waShowNum(mob))}</div></div>`; }
function waFirstGo(work){ // when 📲 Send's first message goes: now, or 10am a week before (Saturday if that's a Sunday)
  const d=addDays(parseYmd(work),-7); if(d.getDay()===0) d.setDate(d.getDate()-1); d.setHours(10,0,0,0);
  return d>new Date() ? d : null; }

// ── where each job is at ──
function waState(j,n){
  if(!hasWa || deptOf(j)!=='calls') return null;
  const s=siteOf(j), past=!!(s&&s.work_date&&s.work_date<todayYmd());
  let st=j.wa_status;
  if((st==='no_wa'||st==='stopped') && waMobileOf(j) && waMobileOf(j)!==j.wa_mobile) st=null;   // number corrected since → send again
  const win=n!=null?waWinFor(j,n):null;
  let r;
  if(st==='stopped') r={k:'stopped', t:'🔕 Replied STOP', c:'grey'};
  else if(st==='no_wa') r={k:'no_wa', t:'⚠ No WhatsApp', c:'grey'};
  else if(j.wa_on===false) r={k:'off', t:'🔕 Reminders off', c:'grey'};
  else if(st==='scheduled') r={k:'sched', t:'📲 Goes '+(j.wa_go?waShort(j.wa_go):'soon'), c:'blue'};
  else if(st==='sent') r={k:'sent', t:'🟡 No reply yet', c:'amber'};
  else if(st==='confirmed') r={k:'ok', t:'🟢 Confirmed', c:'green'};
  else if(st==='phone_ok') r={k:'ok', t:'✅ Confirmed by phone', c:'green'};
  else if(st==='cant') r={k:'cant', t:"🔴 Can't make it", c:'red'};
  else if(st==='noreply') r={k:'noreply', t:'📵 No reply — call', c:'red'};
  else if(past || waIsClosed(j) || !s || !s.work_date) return null;
  else r = waMobileOf(j) ? {k:'new', t:'📲 Not sent yet', c:'grey'} : {k:'nomob', t:'⚠ No mobile', c:'grey'};
  r.win=win;
  r.changed=!!(win && j.wa_time && !past && !waIsClosed(j) && ['sched','sent','ok','noreply'].includes(r.k) && j.wa_time!==win);
  return r; }
function waBadges(j,n){
  if(!isOffice){   // service men: only that day's replies
    if(!hasWa || deptOf(j)!=='calls') return ''; const s=siteOf(j); if(!s || s.work_date!==todayYmd()) return '';
    if(j.wa_status==='cant') return `<div class="slot-wa"><span class="wa-pill wa-red">🔴 Can't make it</span></div>`;
    if(j.wa_man_unread) return `<div class="slot-wa"><span class="wa-pill wa-indigo">💬 Customer replied</span></div>`;
    return ''; }
  if(!waUI()) return '';
  const s=waState(j,n); if(!s) return '';
  let h=`<span class="wa-pill wa-${s.c}" title="WhatsApp">${s.t}</span>`;
  if(s.changed) h+=`<span class="wa-pill wa-orange" title="Told ${esc(j.wa_time)} — now ${esc(s.win)}">⚠ Time changed</span>`;
  if(j.wa_unread) h+=`<span class="wa-pill wa-indigo">💬 Replied</span>`;
  if(waMode==='one' && !previewing){
    if(s.k==='new') h+=`<button class="wa-one" onclick="event.stopPropagation();waSendJob('${j.id}','book')" title="Send the WhatsApp booking message to this customer only">📲 Send</button>`;
    if(s.changed) h+=`<button class="wa-one amber" onclick="event.stopPropagation();waSendJob('${j.id}','time')" title="Tell this customer the new time">📲 Send new time</button>`; }
  return `<div class="slot-wa">${h}</div>`; }

// ── day page: WhatsApp bar + 🌅 Morning / 🌇 Afternoon ──
function waDayBar(site){
  if(!waUI() || !isOffice || !site.work_date || site.work_date<todayYmd()) return '';
  const L=waDayList(site); if(!L.length) return '';
  let nNew=0,nTime=0,ok=0,wait=0,cant=0,nr=0,nomob=0;
  for(const {j,n} of L){ const s=waState(j,n); if(!s) continue;
    if(s.k==='new') nNew++; if(s.changed) nTime++; if(s.k==='ok') ok++; if(s.k==='sent'||s.k==='sched') wait++;
    if(s.k==='cant') cant++; if(s.k==='noreply') nr++; if(s.k==='nomob') nomob++; }
  const anySent=L.some(({j})=>j.wa_status), go=waFirstGo(site.work_date), M=waMorningN();
  const parts=[`${L.length} job${L.length===1?'':'s'}`];
  if(ok) parts.push(`🟢 ${ok} confirmed`); if(wait) parts.push(`🟡 ${wait} waiting`); if(cant) parts.push(`🔴 ${cant} can't make it`);
  if(nr) parts.push(`📵 ${nr} no reply`); if(nomob) parts.push(`⚠ ${nomob} no mobile`);
  return `<div class="wa-bar"><div class="wa-sum"><b>📲 WhatsApp</b>${WA_TEST?' <span class="wa-pill wa-orange" title="Only the Office login sees WhatsApp. Send to all only sends to the test mobile; Send individually can message any customer you choose.">🧪 Test mode — Office only</span>':''} · ${parts.join(' · ')}
      <br>${nNew?`First message ${go?'goes at 10am '+esc(waShort(go)):'goes straight away'} · `:''}<button class="wa-morn" onclick="waSetMorning()" title="How many jobs are told the morning">🌅 Job${M===1?' 1':'s 1–'+M} told 8am–12pm · 🌇 the rest 12pm–5pm</button></div>
    <div class="wa-mode" role="group" aria-label="How to send"><button class="${waMode==='all'?'on':''}" onclick="waSetMode('all')">📲 Send to all</button><button class="${waMode==='one'?'on':''}" onclick="waSetMode('one')">👆 Send individually</button></div>
    ${waMode==='all'&&nTime?`<button class="btn-wa amber" onclick="waSendDay('${site.id}','time')">📲 Send ${nTime} time update${nTime===1?'':'s'}</button>`:''}
    ${waMode==='all'&&nNew?`<button class="btn-wa" onclick="waSendDay('${site.id}','new')">📲 ${anySent?`Send to ${nNew} new`:`Send to all (${nNew})`}</button>`:''}
    ${waMode==='one'&&(nNew||nTime)?`<span style="font-size:12px;color:#166534">Press <b>📲 Send</b> on a job box to message just that customer</span>`:''}
    ${!nNew&&!nTime&&anySent?'<span class="wa-pill wa-green">✓ All sent</span>':''}</div>`; }
function waGridHtml(list,num){
  if(!waUI() || !isOffice || dept!=='calls') return list.map(j=>slotCard(j,num.get(j.id))).join('');
  const M=waMorningN(); let h='', am=false, pm=false;
  for(const j of list){ const n=num.get(j.id);
    if(n<=M && !am){ am=true; h+=`<div class="wa-split">🌅 Morning <span>job${M===1?' 1':'s 1–'+M} · told "between 8am and 12pm" unless the job has its own time</span></div>`; }
    if(n>M && !pm){ pm=true; h+=`<div class="wa-split">🌇 Afternoon <span>job ${M+1} on · told "between 12pm and 5pm" unless the job has its own time</span></div>`; }
    h+=slotCard(j,n); }
  return h; }
function waWeekBtn(days){
  if(waMode!=='all' || !waUI() || !isOffice) return '';
  const ids=(days||[]).filter(s=>s.work_date>=todayYmd() && waDayList(s).some(({j,n})=>{ const x=waState(j,n); return x&&x.k==='new'; })).map(s=>s.id);
  if(!ids.length) return '';
  return `<button class="btn-outline" style="border-color:#16a34a;color:#166534" onclick="waSendDay([${ids.map(i=>`'${i}'`).join(',')}],'new')" title="Send the WhatsApp reminders for every day this week that hasn't been sent">📲 Send all days this week</button>`; }
async function waSetMorning(){ if(blockPreview()) return;
  const v=prompt('How many jobs each day are told the morning (between 8am and 12pm)?\nThe rest are told 12pm – 5pm.', String(waMorningN()));
  if(v===null) return; const n=parseInt(v,10); if(!(n>=1&&n<=10)) return toast('Pick a number from 1 to 10.');
  const { error }=await sb.from('wa_settings').update({morning_jobs:n}).eq('id',1);
  if(error) return toast('Could not save: '+error.message,6000);
  waCfg.morning_jobs=n; rerenderCurrent(); toast(`🌅 Jobs 1–${n} are now told the morning`); }

// ── 📲 Send ──
function waConfirm(title, html, okLabel){
  return new Promise(res=>{
    openModal(`<h2>${esc(title)}</h2>${html}<div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancel</button><button class="btn-wa" id="wa-ok" style="padding:10px 18px">${okLabel}</button></div>`);
    window._confirmResolve=res;
    $('wa-ok').onclick=()=>{ window._confirmResolve=null; $('modal-root').innerHTML=''; res(true); }; }); }
async function waSendDay(siteIds, which){ if(blockPreview()) return;
  siteIds=[].concat(siteIds);
  const items=[], dayN=new Map();
  for(const sid of siteIds){ const site=sites.find(s=>s.id===sid); if(!site || !site.work_date) continue;
    for(const {j,n} of waDayList(site)){ const s=waState(j,n); if(!s) continue;
      if(which==='new' && s.k==='new'){ items.push({job_id:j.id, kind:'book', time:s.win, mobile:waMobileOf(j), name:waFirst(j)}); dayN.set(sid,(dayN.get(sid)||0)+1); }
      if(which==='time' && s.changed) items.push({job_id:j.id, kind:'time', time:s.win}); } }
  let held=0;
  if(WA_TEST && which==='new'){ const keep=items.filter(i=>WA_TEST_MOBILES.includes(i.mobile)); held=items.length-keep.length; items.length=0; items.push(...keep); }

async function waLoadJob(){

function waRenderPane(){
  const wp=$('wa-pane'); if(!wp || !job) return;

  const lastIn=j.wa_last_in?new Date(j.wa_last_in):null, open=!!(lastIn && Date.now()-lastIn<24*3600e3-60e3);

  const firstNewIn=j.wa_unread?waMsgs.findIndex(m=>m.direction==='in' && new Date(m.created_at)>Date.now()-48*3600e3):-1;

  } else tail=`<div class="wa-lock">Only the office can reply on WhatsApp — ring the customer from your phone if you need to.</div>`;

function waFormBind(ctx){ waFormCtx=ctx; if(!$('wa-form')) return;
  ['wa-on','wa-name','wa-extra','m-cust','m-title','m-ph','m-ph2','m-ref','m-av','m-av-d','m-av-t'].forEach(id=>{ const e=$(id); if(e){ e.addEventListener('input',waFormPrev); e.addEventListener('change',waFormPrev); } });
  waFormPrev(); }
function waFormAvail(){ const s=$('m-av'); if(!s) return (waFormCtx&&waFormCtx.job&&waFormCtx.job.avail)||''; let v=s.value;
  if(v==='custom'){ const t=$('m-av-t'); v=($('m-av-d')||{}).value+':'+((t&&t.value)||'15:00'); } return v; }
function waFormPrev(){
  const box=$('wa-prev'); if(!box || !waFormCtx) return;
  const cust=$('m-cust') ? $('m-cust').value : waCustName({title:($('m-title')||{}).value||''});
  const auto=waFirst({title:'Job 1 – '+(cust||'')}), ni=$('wa-name'); if(ni) ni.placeholder=auto||'e.g. Mary';
  const name=(ni&&ni.value.trim())||auto||'there';
  const val=id=>($(id)||{}).value;
  const mob=waMobileOf({customer_phone:val('m-ph'), customer_phone2:val('m-ph2'), ref_no:val('m-ref')});
  if(!$('wa-on').checked){ box.innerHTML='<div class="wa-note">🔕 No WhatsApp messages for this job.</div>'; return; }
  const time=waWinFor({avail:waFormAvail()}, waFormCtx.n), j=waFormCtx.job, sent=j&&j.wa_status;
  box.innerHTML=`<div class="wa-prev"><div class="b">${esc(waBookingText(name, waFormCtx.day?waDay(waFormCtx.day):'…', time, ($('wa-extra').value||'').trim()))}</div><div class="q"><span>✅ Confirm</span><span>❌ I can't make it</span></div></div>
    ${mob?waSchedHtml(name==='there'?'the customer':name, mob, waFormCtx.day, j)+(sent?'<div class="wa-note">Already sent — changes here apply to the next reminders.</div>':''):'<div class="wa-note">⚠ No mobile number — add one (08…) in a phone box, or the customer gets nothing.</div>'}`; }
function waReadForm(){ if(!waUI() || !$('wa-on')) return null;
  const c=s=>String(s||'').replace(/[\r\n\t]+/g,' ').replace(/ {2,}/g,' ').trim();
  return {wa_on:$('wa-on').checked, wa_name:c($('wa-name').value)||null, wa_extra:c($('wa-extra').value)||null}; }

// ── live updates for the WhatsApp tab ──
function waSubscribe(){
  if(waChan){ try{ sb.removeChannel(waChan); }catch(e){} waChan=null; }
  if(!hasWa) return;
  waChan=sb.channel('sashdash-wa')
    .on('postgres_changes',{event:'*',schema:'public',table:'wa_messages'}, p=>{ const r=p.new||p.old||{};
      if(job && r.job_id===job.id){ if(waView==='wa') waLoadJob(); else if(r.direction==='in'){ const t=document.querySelector('.wa-tb.wa'); if(t && !t.querySelector('.n')) t.insertAdjacentHTML('beforeend',' <span class="n">new</span>'); } waOmw(); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'wa_messages'}, ()=>{ if(openFolder==='wa_log'){ clearTimeout(waLogT); waLogT=setTimeout(()=>{ const el=$('folder-panel'); if(el&&openFolder==='wa_log') waLogPanel(el); },800); } })
    .subscribe(); }

// ══ 💬 WhatsApp log — every WhatsApp sent and received, newest first ══
let waLogF={who:'all', range:'today', q:''}, waLogT=null;
function waLogBox(list){
  const n=list.filter(j=>j.wa_unread).length;
  return `<button class="folder-box f-blue ${openFolder==='wa_log'?'open':''} ${n?'':'empty'}" onclick="toggleFolder('wa_log')">
      <span class="f-ico">💬</span><span class="f-txt"><b>WhatsApp log</b><small>${n?`${n} job${n===1?'':'s'} with new replies`:'Every WhatsApp sent and received'}</small></span>
      <span class="f-n" style="${n?'background:var(--indigo)':''}">${n}</span><span class="f-arrow">${openFolder==='wa_log'?'▴':'▾'}</span></button>`; }
function waLogSet(k,v){ waLogF[k]=v; const el=$('folder-panel'); if(el) waLogPanel(el); }
function waLogWhat(m){   // → {ic, t, c, line}
  const q=s=>'“'+esc(String(s||'').slice(0,160))+'”', tk=waTick(m.status).replace(/^ · /,'');
  if(m.direction==='out'){
    if(m.status==='failed') return {ic:'⚠', t:'Not delivered', c:'red', line:`${esc(WA_KIND[m.kind]||m.kind)}${m.error?' · '+esc(String(m.error).slice(0,120)):''}`};
    if(m.kind==='auto_reply') return {ic:'🤖', t:'Auto reply', c:'grey', line:q(m.body)};
    if(m.kind==='text') return {ic:'✍', t:'Office reply', c:'indigo', line:q(m.body)+(tk?' · '+tk:'')};
    const lbl={sdw_booking_confirm:'Booking sent', sdw_booking_reminder:'Reminder sent', sdw_visit_reminder:'Reminder sent', sdw_day_before:'Day-before sent', sdw_time_update:'Time update sent', sdw_on_my_way:'On my way sent', sdw_on_the_way:'On my way sent', sdw_office_followup:'Follow-up sent'}[m.kind]||'Sent';
    return {ic:'📲', t:lbl, c:'blue', line:`${esc(WA_KIND[m.kind]||m.kind)}${tk?' · '+tk:''}`}; }
  const b=String(m.body||'');
  if(m.kind!=='text' && /confirm/i.test(b)) return {ic:'🟢', t:'Confirmed', c:'green', line:'Tapped “Confirm”'};
  if(m.kind!=='text' && /can.?t make/i.test(b)) return {ic:'🔴', t:"Can't make it", c:'red', line:'Tapped “I can\'t make it”'};
  if(/^\s*(stop|unsubscribe|stop messages)\s*[.!]*\s*$/i.test(b)) return {ic:'🔕', t:'STOP', c:'grey', line:'Replied “'+esc(b.trim())+'” — no more WhatsApps to this number'};
  return {ic:'💬', t:'Replied', c:'indigo', line:q(b)}; }
async function waLogPanel(el){
  const since={today:(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })(), week:addDays(new Date(),-7), month:addDays(new Date(),-30)}[waLogF.range];
  const { data, error }=await sb.from('wa_messages').select('id,job_id,phone,direction,kind,body,status,error,author_id,created_at').gte('created_at',since.toISOString()).order('created_at',{ascending:false}).limit(500);
  if(openFolder!=='wa_log') return; el=$('folder-panel'); if(!el) return;
  if(error){ el.innerHTML=`<div class="loading">Couldn't load the log: ${esc(error.message)}</div>`; return; }
  const all=(data||[]).filter(m=>m.created_at>=since.toISOString()).sort((a,b)=>a.created_at<b.created_at?1:-1);
  // a reply is "new" until someone opens the job's WhatsApp tab (or the office answers after it)
  const lastOffice={}; for(const m of all) if(m.direction==='out' && m.author_id && !lastOffice[m.job_id]) lastOffice[m.job_id]=m.created_at;
  const isNew=m=>{ if(m.direction!=='in') return false; const j=jobs.find(x=>x.id===m.job_id); return !!(j&&j.wa_unread&&(!lastOffice[m.job_id]||m.created_at>lastOffice[m.job_id])); };
  const nIn=all.filter(m=>m.direction==='in').length, nBad=all.filter(m=>m.status==='failed').length;
  const q=waLogF.q.trim().toLowerCase(), qd=q.replace(/[^\d]/g,'');
  const rows=all.filter(m=> waLogF.who==='in'?m.direction==='in' : waLogF.who==='out'?m.direction==='out' : waLogF.who==='bad'?m.status==='failed' : true)
    .filter(m=>{ if(!q) return true; const j=jobs.find(x=>x.id===m.job_id)||{}; return (waCustName(j)||'').toLowerCase().includes(q) || (qd.length>=3 && (String(m.phone).includes(qd) || ('0'+String(m.phone).slice(3)).includes(qd))); });
  const rng=m=>{ const d=new Date(m.created_at), t=d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'});
    if(d.toDateString()===new Date().toDateString()) return t; if(d.toDateString()===addDays(new Date(),-1).toDateString()) return 'Yesterday '+t; return esc(waShort(d))+' '+t; };
  const segBtn=(k,v,l)=>`<button class="${waLogF[k]===v?'on':''}" onclick="waLogSet('${k}','${v}')">${l}</button>`;
  el.innerHTML=`<div class="fp-head">💬 WhatsApp log <span>— every WhatsApp sent and received, newest first. Red rows are replies nobody has opened yet.</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 2px 10px">
      <div class="seg">${segBtn('who','all','All')}${segBtn('who','in',`Customer replies (${nIn})`)}${segBtn('who','out','Sent by SashDash')}${segBtn('who','bad',`Problems (${nBad})`)}</div>
      <div class="seg">${segBtn('range','today','Today')}${segBtn('range','week','Last 7 days')}${segBtn('range','month','Last 30 days')}</div>
      <input id="wa-log-q" placeholder="🔍 Search name or number" value="${esc(waLogF.q)}" style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:13px;min-width:200px" oninput="waLogF.q=this.value;clearTimeout(waLogT);waLogT=setTimeout(()=>{const e=$('folder-panel');if(e)waLogPanel(e).then(()=>{const i=$('wa-log-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}})},300)">
      <span style="margin-left:auto;font-size:12px;color:var(--slate)">Updates live as messages come in</span></div>
    ${rows.length?`<div class="s-table-wrap"><table class="s-table"><thead><tr><th>When</th><th>Customer</th><th>Service man · day</th><th>What happened</th><th></th></tr></thead><tbody>
    ${rows.map(m=>{ const j=jobs.find(x=>x.id===m.job_id), st=j&&siteOf(j), t=j&&prof(j.serviceman_id), w=waLogWhat(m), nw=isNew(m);
      return `<tr style="${nw?'background:#fef2f2':''}"><td style="white-space:nowrap"><b>${rng(m)}</b>${nw?'<div><span class="tag red">New</span></div>':''}</td>
        <td class="s-title">${j?esc(waCustName(j)||j.title):'<span class="s-sub">Not linked to a job</span>'}<div class="s-sub">${esc(waShowNum(m.phone))}</div></td>
        <td>${t?esc(firstName(t.full_name)):'—'}${st&&st.work_date?`<div class="s-sub">${esc(dayLabel(st.work_date))}</div>`:''}</td>
        <td><span class="wa-pill wa-${w.c}">${w.ic} ${esc(w.t)}</span><div class="s-sub" style="margin-top:4px;max-width:380px">${m.direction==='in'?'⬅ from customer':'➡ from SashDash'} · ${w.line}</div></td>
        <td class="fp-act">${j&&m.direction==='in'&&w.ic==='💬'?`<button class="btn-primary" onclick="waLogOpen('${j.id}',true)">💬 Reply</button>`:''}${j?`<button class="btn-outline" onclick="waLogOpen('${j.id}',false)">Open</button>`:''}</td></tr>`; }).join('')}
    </tbody></table></div>`:`<div class="empty" style="margin:0">No WhatsApp messages ${waLogF.range==='today'?'today':waLogF.range==='week'?'in the last 7 days':'in the last 30 days'}${waLogF.who!=='all'||q?' that match':''}.</div>`}`; }
function waLogOpen(id, wa){ if(!jobs.find(x=>x.id===id)) return toast('That job is no longer in SashDash.'); goToJob(id); setTimeout(()=>{ setJvTab('chat'); waSetView('wa'); if(wa){ setTimeout(()=>{ const t=$('wa-input'); if(t) t.focus(); },600); } },500); }
</script>
</body>
</html>
