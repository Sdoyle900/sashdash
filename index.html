<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SashDash</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SashDash" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#0f172a;--navy2:#1e293b;--indigo:#4f46e5;--indigo2:#4338ca;--sky:#0ea5e9;--green:#16a34a;--red:#dc2626;--amber:#d97706;--slate:#64748b;--slate2:#94a3b8;--border:#e2e8f0;--bg:#f1f5f9;--white:#ffffff;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
    html,body{height:100%}
    body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--navy);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
    button{font-family:inherit}
    .hidden{display:none!important}

    /* buttons — same family as RackTrack */
    .btn-primary{background:var(--indigo);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
    .btn-primary:hover{background:var(--indigo2)}
    .btn-primary:disabled{opacity:.6;cursor:default}
    .btn-primary.full{width:100%;padding:13px;font-size:15px}
    .btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{border-color:var(--indigo);color:var(--indigo)}
    .btn-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
    .btn-danger:hover{background:#fef2f2}
    .btn-ghost{background:transparent;color:var(--slate2);border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .btn-ghost:hover{color:#fff;background:rgba(255,255,255,.1)}

    /* login */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
    .auth-card{background:var(--white);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .auth-sd{display:block;height:58px;margin:0 auto 18px}
    .brand{display:flex;align-items:center;gap:9px}
    .brand svg{flex:none}
    .brand-text{font-size:22px;font-weight:400;letter-spacing:1px;color:var(--navy)}
    .brand-text strong{font-weight:900;color:var(--indigo)}
    .auth-card .brand{justify-content:center;margin-bottom:4px}
    .auth-sub{color:var(--slate);font-size:13px;margin-bottom:22px;text-align:center}
    .auth-footer{color:var(--slate2);font-size:12px;text-align:center;margin-top:16px}
    .auth-error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
    .field-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .field-group label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--slate)}
    .field-group input,.field-group select,.field-group textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#f8fafc;color:var(--navy);width:100%}
    .field-group input:focus,.field-group select:focus,.field-group textarea:focus{outline:none;border-color:var(--indigo);background:#fff}
    .optional{font-weight:400;text-transform:none;color:var(--slate2);font-size:11px}

    /* header */
    .app-header{background:var(--navy);position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);padding-top:var(--safe-t)}
    .header-inner{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px;height:58px}
    .header-inner .brand-text{color:#fff;font-size:18px}
    .header-inner .brand-text strong{color:#818cf8}
    .sd-chip{height:30px;padding:3px 9px;background:#fff;border-radius:6px;margin-left:8px}
    .header-tabs{display:flex;gap:4px;margin-left:12px}
    .tab{background:transparent;color:#94a3b8;border:none;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
    .tab:hover{color:#fff;background:rgba(255,255,255,.08)}
    .tab.active{background:var(--indigo);color:#fff}
    .header-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .user-name{color:#cbd5e1;font-size:13px;font-weight:600}
    .role-badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#312e81;color:#c7d2fe;letter-spacing:.5px}

    .rs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .rs-day{position:relative;border:1.5px solid var(--border);border-radius:10px;padding:8px 4px;display:flex!important;flex-direction:column;align-items:center;cursor:pointer;text-transform:none!important;letter-spacing:0!important;color:var(--navy)!important}
    .rs-day input{position:absolute;opacity:0;pointer-events:none}
    .rs-day b{font-size:14px} .rs-day small{font-size:11px;color:var(--slate);font-weight:600}
    .rs-day em{font-style:normal;font-size:9px;font-weight:900;text-transform:uppercase;color:#b45309}
    .rs-day.cur{background:#f1f5f9}
    .rs-day.past{opacity:.55}
    .rs-day:has(input:checked){border-color:#b45309;background:#fff7ed;box-shadow:0 0 0 2px #fdba74}
    @media (max-width:520px){ .rs-grid{grid-template-columns:repeat(3,1fr)} }
    .arch-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:14px 0 10px;font-size:14px}
    .arch-status{background:#eef2ff;color:#3730a3;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
    .dl-week{display:flex;gap:6px;align-items:center;margin-right:8px}
    .dl-week select{padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;font-weight:600}
    @media (max-width:720px){ .dl-week{width:100%;margin:8px 0 0} .dl-week select{flex:1} }
    .search-wrap{position:relative;margin:16px 0 4px}
    .search-wrap input{width:100%;padding:13px 44px 13px 44px;border:2px solid var(--border);border-radius:12px;font-size:16px;background:#fff;font-family:inherit}
    .search-wrap input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px #e0e7ff}
    .search-wrap .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
    .search-wrap .s-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#e2e8f0;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px}
    #search-results{margin-top:10px}
    .s-count{font-size:12px;font-weight:700;color:var(--slate);margin:4px 2px 8px;text-transform:uppercase;letter-spacing:.5px}
    .s-table-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:60vh;margin-bottom:18px}
    .s-table{width:100%;border-collapse:collapse;font-size:14px}
    .s-table th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
    .s-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    .s-table tbody tr{cursor:pointer} .s-table tbody tr:hover{background:#eef2ff}
    .s-table .avatar.sm{display:inline-flex;vertical-align:middle;margin-right:4px}
    .s-title{font-weight:700} .s-sub{font-size:12px;color:var(--slate)} .s-chat{font-weight:400;font-size:12px;color:var(--slate);margin-top:2px}
    .s-where{font-size:12px;color:var(--slate)}
    .s-table mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
    .s-none{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:18px;text-align:center;color:var(--slate);margin-bottom:18px}
    #dash-body.dim{opacity:.45}
    @media (max-width:720px){ .s-table th:nth-child(4),.s-table td:nth-child(4),.s-table th:nth-child(6),.s-table td:nth-child(6){display:none} .s-table{font-size:13px} }
    /* printing */
    #print-root{display:none}
    @media print{
      @page{size:A4;margin:12mm}
      body.printing > *:not(#print-root){display:none!important}
      body.printing{background:#fff}
      body.printing #print-root{display:block;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:11pt}
      .p-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:10px}
      .p-logo{height:46px}
      .p-title{font-size:18pt;font-weight:800}
      .p-sub{font-size:10pt;color:#444}
      .p-info{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10pt}
      .p-info td{border:1px solid #ccc;padding:4px 6px} .p-info td:nth-child(odd){background:#f1f5f9;font-weight:700;width:16%}
      .p-h{font-size:16pt;margin:12px 0 8px;border-bottom:1px solid #999}
      .p-page{page-break-inside:avoid;margin-bottom:8px;text-align:center}
      .p-page img{max-width:100%;max-height:245mm;border:1px solid #ccc}
      .p-pno{font-size:8pt;color:#666}
      .p-first img{max-height:200mm}
      .p-break{page-break-before:always}
      .p-msg{border:1px solid #bbb;border-radius:6px;padding:9px 12px;margin-bottom:10px;page-break-inside:avoid;font-size:14pt;line-height:1.4}
      .p-who{font-size:11pt;color:#333;margin-bottom:4px}
      .p-photo{display:block;max-width:60%;max-height:110mm;margin-top:4px;border:1px solid #ccc}
      .p-evt{font-size:13pt;color:#222;margin:6px 0 10px;padding:6px 10px;background:#f1f5f9;border-left:4px solid #64748b;line-height:1.4;page-break-inside:avoid}
      .p-foot{margin-top:14px;font-size:8pt;color:#777;border-top:1px solid #ccc;padding-top:4px}
    }
    .bell-btn{position:relative;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:38px;height:34px;font-size:16px;cursor:pointer}
    .bell-btn:hover{background:rgba(255,255,255,.18)}
    .bell-btn.on::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #0f172a}
    .push-banner{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;background:#eef2ff;color:#3730a3;font-weight:600;font-size:14px;padding:10px 16px;border-bottom:1px solid #c7d2fe}
    .push-banner .btn-primary{padding:7px 14px;font-size:13px}
    .push-banner .pb-x{border:none;background:none;font-size:16px;color:#6366f1;cursor:pointer}
    .ios-steps{margin:0 0 14px 22px;font-size:14px;line-height:1.9;color:var(--navy)}
    /* "View as" */
    .viewas-btn{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
    .viewas-btn:hover{background:rgba(255,255,255,.18)}
    body.previewing .viewas-btn{background:#f59e0b;border-color:#f59e0b;color:#1f2937}
    .va-menu{min-width:270px;max-height:70vh;overflow:auto}
    .va-menu button{display:flex;align-items:center;gap:10px}
    .va-menu button small{display:block;font-size:11px;color:var(--slate)}
    .va-menu button.on{background:#fef3c7}
    .va-h{font-size:12px;font-weight:800;color:var(--navy);padding:8px 12px 4px}
    .va-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);padding:8px 12px 2px}
    .va-exit{color:var(--indigo)!important;font-weight:700}
    .preview-banner{background:#f59e0b;color:#1f2937;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 16px;position:sticky;top:calc(58px + var(--safe-t));z-index:46;flex-wrap:wrap;text-align:center}
    .preview-banner button{background:#1f2937;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-weight:800;cursor:pointer}
    body.previewing .dept-bar{top:calc(96px + var(--safe-t))}
    body.previewing .composer textarea{background:#f1f5f9}
    body.previewing .job-view .jv-bar{box-shadow:inset 0 -4px 0 #f59e0b}
    @media (max-width:720px){ .viewas-btn .lbl{display:none} .preview-banner{font-size:12px;gap:8px} }
    /* department switch — Sites / Private Calls */
    .dept-bar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:calc(58px + var(--safe-t));z-index:45;box-shadow:0 2px 6px rgba(15,23,42,.05)}
    .dept-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:10px}
    .dept-btn{position:relative;flex:1;max-width:280px;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid var(--border);background:#f8fafc;border-radius:12px;padding:11px 16px;font-weight:800;font-size:16px;color:var(--slate);cursor:pointer;transition:all .12s}
    .dept-btn:hover{border-color:#cbd5e1;color:var(--navy)}
    .dept-btn .di{font-size:20px}
    .dept-btn .dc{background:#e2e8f0;color:var(--navy);font-size:12px;padding:1px 8px;border-radius:20px}
    .dept-btn.on.d-sites{background:var(--navy);border-color:var(--navy);color:#fff}
    .dept-btn.on.d-calls{background:#b45309;border-color:#b45309;color:#fff}
    .dept-btn.on .dc{background:rgba(255,255,255,.22);color:#fff}
    .dept-btn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px}
    .tag.amber{background:#fef3c7;color:#92400e}
    .tag.blue{background:#dbeafe;color:#1e40af}
    .s-day{background:#fff7ed;border:1.5px solid #fdba74;color:#9a3412;font-weight:700;font-size:13px;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:inherit}.s-day:hover{background:#ffedd5;border-color:#ea580c}
    .s-day mark{background:#fde68a}
    @keyframes jobflash{0%,100%{box-shadow:0 0 0 0 rgba(234,88,12,0)}30%,70%{box-shadow:0 0 0 5px rgba(234,88,12,.55)}}.flash{animation:jobflash 1.3s ease 2}
    .update-pill{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;background:#4f46e5;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
    .ord-folder{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-2px 0 12px;padding:10px 12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px}
    .ord-folder .btn-outline,.ord-folder .btn-primary{padding:7px 12px;font-size:13px}.of-note{font-size:12px;color:#64748b}.of-on{font-size:13px;color:#166534}
    input.need{border-color:#dc2626!important;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
    .rq-edit{border:0;background:none;color:#64748b;cursor:pointer;font-size:13px;padding:0 4px}.rq-edit:hover{color:#4f46e5}.rq-nono{color:#b91c1c;font-style:italic;font-weight:600}
    .rq-btns{display:flex;gap:8px;flex-wrap:wrap}.rq-btns .btn-outline{padding:8px 14px;font-size:13px}
    .btn-amber{background:#d97706!important;border-color:#d97706!important}
    .slot[draggable=true]{cursor:grab}.slot.dragging{opacity:.35}
    .slot.drop-before{box-shadow:-6px 0 0 0 #4f46e5}.slot.drop-after{box-shadow:6px 0 0 0 #4f46e5}
    .sf-wide{grid-column:1/-1}
    .slot:has(.slot-actions) .slot-cc{margin-bottom:34px}
    .cc{display:inline-flex;align-items:center;gap:4px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.cc:hover{background:#d1fae5}
    .slot-cc{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}.slot-cc .cc{font-size:11px;padding:2px 8px}
    .jv-cc{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.jv-cc .cc{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.45);color:#a7f3d0}
    .slot-ref{font-size:12px;color:#92400e;font-weight:700;margin-top:2px}
    .slot-form{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}@media(max-width:560px){.slot-form{grid-template-columns:1fr}}
    .slot-new{cursor:pointer}
    .rq-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.rq-head .btn-primary{padding:8px 14px;font-size:13px}
    .fp-act .rq-sent{border-color:#f59e0b;color:#92400e}.fp-act .rq-approve{border-color:#16a34a;color:#166534;font-weight:700}.fp-act .rq-approve:hover{background:#dcfce7}
    .fp-empty{padding:18px;text-align:center;color:#64748b}
    .modal:has(.team-row){max-width:700px}
    .tr-role{padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;min-width:0}
    .tr-depts{grid-column:2 / -1;display:flex;gap:16px;font-size:13px;font-weight:600;color:var(--navy)}
    .tr-depts label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .tr-depts.muted{opacity:.4}
    .tr-stop{margin-left:auto;border:1.5px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
    .tr-stop.on{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
    .tr-depts.muted .tr-stop{opacity:1}
    .nj-tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:999px;padding:1px 8px;vertical-align:middle}
    .tech-card.nj{opacity:.75}
    .nj-note{padding:14px;border:1.5px dashed #fecaca;background:#fef2f2;color:#b91c1c;border-radius:12px;font-weight:600;font-size:14px;text-align:center}
    @media (max-width:720px){ .dept-inner{padding:8px 12px;gap:8px} .dept-btn{font-size:14px;padding:10px 8px;gap:6px} .dept-btn .di{font-size:17px} }
    .page{max-width:1400px;margin:0 auto;padding:22px 20px calc(40px + var(--safe-b))}
    .page-title{font-size:22px;font-weight:800;letter-spacing:-.3px}
    .page-sub{color:var(--slate);font-size:13px;margin-top:2px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .spacer{flex:1}

    /* dashboard */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
    .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
    .stat-click{cursor:pointer;transition:border-color .15s,box-shadow .15s}.stat-click:hover{border-color:#fca5a5;box-shadow:0 2px 10px rgba(220,38,38,.12)}
    .stat-go{font-size:15px;color:var(--slate);margin-left:2px}
    .modal:has(.nw-wrap){max-width:900px}
    .nw-sub{color:var(--slate);font-size:13px;margin:-8px 0 12px}
    .nw-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
    .nw-t{width:100%;border-collapse:collapse;font-size:13.5px}
    .nw-t th{text-align:left;background:#f8fafc;color:var(--slate);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
    .nw-t td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    .nw-t tr:last-child td{border-bottom:none}
    .nw-t tbody tr{cursor:pointer}.nw-t tbody tr:hover td{background:#fff7f7}
    .nw-man{display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
    .nw-job b{display:block}.nw-job small,.nw-when{color:var(--slate);font-size:12px;white-space:nowrap}
    .nw-msg{max-width:300px;color:var(--navy)}.nw-msg i{color:var(--slate);font-style:normal;font-size:12px}
    .nw-empty{padding:26px;text-align:center;color:var(--slate)}

function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }

function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; return addDays(x,-wd); }
function dayLabel(s){ return parseYmd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}); }

// ── Auto-update: phones pick up a new version as soon as it's on GitHub ──
const APP_BUILD='2026-10-24-0900';   // bump on every release (YYYY-MM-DD-HHMM)
let updating=false;
async function checkForUpdate(){
  if(updating || !navigator.onLine) return;
  try{
    const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=/const APP_BUILD='([^']+)'/.exec(await r.text()); if(!m || m[1]<=APP_BUILD) return;   // only ever move forward
    try{ if(sessionStorage.getItem('sd-upd')===m[1]) return; sessionStorage.setItem('sd-upd',m[1]); }catch(e){}   // one try per new version
    updating=true;
    if(navigator.serviceWorker){ const reg=await navigator.serviceWorker.getRegistration(); if(reg) await reg.update().catch(()=>{}); }
    const busy=()=> window.orderSaving || (typeof dirty!=='undefined' && dirty) || !!($('modal-root')&&$('modal-root').innerHTML) || !!document.querySelector('#chat-input:focus, textarea:focus') || ($('chat-input')&&$('chat-input').value.trim()) || document.body.classList.contains('scanning');
    if(!busy()){ toast('🔄 Updating SashDash…',2000); setTimeout(()=>location.reload(),900); }
    else { const b=document.createElement('button'); b.className='update-pill'; b.textContent='🔄 New version — tap to update'; b.onclick=()=>location.reload(); document.body.appendChild(b); }
  }catch(e){}
}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));}

// ── Phone notifications ───────────────────────────────────────────
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isInstalled = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function b64ToBytes(b64){ const pad='='.repeat((4-b64.length%4)%4), raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
async function currentSub(){ try{ const reg=await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(()=>r(null),2500))]); if(!reg) return null; return await reg.pushManager.getSubscription(); }catch(e){ return null; } }
async function initNotifications(){
  const bell=$('bell-btn');
  if(previewing){ bell.classList.add('hidden'); $('push-banner').classList.add('hidden'); return; }
  bell.classList.remove('hidden');
  let sub = pushSupported ? await currentSub() : null;
  // allowed before but the phone lost its sign-up (e.g. after an app update) → quietly sign up again
  if(!sub && pushSupported && Notification.permission==='granted' && localStorageSafe('pushWanted')==='yes'){
    try{ const reg=await navigator.serviceWorker.ready; sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)}); }catch(e){ sub=null; }
  }
  const on = !!sub && Notification.permission==='granted';
  if(on) localStorageSafe('pushWanted','yes');
  bell.classList.toggle('on', on); bell.textContent = on ? '🔔' : '🔕';
  bell.title = on ? 'Notifications are ON for this device — click to turn off' : 'Turn on phone notifications';
  if(on){ saveSub(sub); }   // keep the server's copy up to date
  // gentle nudge for the men (once per device) if they haven't decided yet
  const nudge = !on && realMe.role==='serviceman' && (!pushSupported || Notification.permission!=='denied') && localStorageSafe('pushNudge')!=='no';
  const bn=$('push-banner');
  if(nudge){ bn.classList.remove('hidden');
    bn.innerHTML=`<span>🔔 Turn on notifications to get a ping when you're sent a job or a message.</span><button class="btn-primary" onclick="toggleNotifications()">Turn on</button><button class="pb-x" onclick="localStorageSafe('pushNudge','no');$('push-banner').classList.add('hidden')" aria-label="Not now">✕</button>`;
  } else bn.classList.add('hidden');
}
function localStorageSafe(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
// this phone's notifications always go to whoever is logged in on it
async function saveSub(sub){
  const j=sub.toJSON();
  const r=await sb.rpc('claim_push_sub',{p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_ua:navigator.userAgent.slice(0,200)});
  if(r && r.error){   // database not updated yet (update-12) → old way
    await sb.from('push_subscriptions').upsert({user_id:realMe.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0,200)}, {onConflict:'endpoint'});
  }
}
async function toggleNotifications(){
  if(previewing) return blockPreview();
  if(isIOS && !isInstalled){
    return openModal(`<div style="text-align:center"><div style="font-size:40px">📲</div><h2 style="margin:6px 0">One step first on iPhone</h2>
      <p style="color:var(--slate);font-size:14px;margin-bottom:12px">iPhones only allow notifications from SashDash once it's on your home screen.</p></div>
      <ol class="ios-steps"><li>Tap the <b>Share</b> button <span style="font-size:18px">⬆️</span> at the bottom of Safari</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>Open SashDash from the new <b>home-screen icon</b> and tap 🔔 again</li></ol>
      <div class="modal-actions" style="justify-content:center"><button class="btn-primary" onclick="closeModal()">OK</button></div>`);
  }
  if(!pushSupported) return toast('This browser can\'t do notifications — use Chrome on Android, or Safari on iPhone (from the home screen).',7000);
  const sub=await currentSub();
  if(sub && Notification.permission==='granted'){
    const ok=await confirmBox({icon:'🔕', title:'Turn off notifications?', body:'This device will stop getting pings from SashDash. You can turn them back on any time with 🔔.', ok:'Turn off', okClass:'btn-danger'});
    if(!ok) return;
    localStorageSafe('pushWanted','no');
    try{ await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); }catch(e){}
    toast('🔕 Notifications off for this device'); return initNotifications();
  }
  if(Notification.permission==='denied')
    return toast('Notifications are blocked for SashDash in this phone\'s settings — allow them there, then tap 🔔 again.',8000);
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('No problem — tap 🔔 any time to turn them on.',5000); return initNotifications(); }
    const reg=await navigator.serviceWorker.ready;
    const s2=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
    await saveSub(s2);
    localStorageSafe('pushNudge','no'); localStorageSafe('pushWanted','yes');
    toast('🔔 Notifications on — you\'ll get a ping for new jobs and messages',5000);
  }catch(e){ toast('Could not turn on notifications: '+(e.message||e),7000); }
  initNotifications();
}

function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(async()=>{ await loadData(); rerenderCurrent(); },500);
}
function rerenderCurrent(){

let shareChan=null, rtRetry=null, rtHealthy=false;
function subscribeRealtime(){
  if(realtime) sb.removeChannel(realtime);
  if(shareChan){ sb.removeChannel(shareChan); shareChan=null; }
  clearTimeout(rtRetry); rtHealthy=false;
  realtime = sb.channel('sashdash-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'jobs'}, payload=>{
      scheduleReload();
      if(job && payload.new && payload.new.id===job.id && payload.eventType==='UPDATE' && !dirty){
        refreshOpenJobMarkup();
      }
      if(job && payload.eventType==='DELETE' && payload.old && payload.old.id===job.id){ toast('This job was deleted by the office.'); closeJob(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'}, payload=>{
      const c=payload.new;
      if(job && c.job_id===job.id){ appendComment(c,true); if(!previewing) sb.rpc('mark_job_seen',{p_job:job.id}); }
      scheduleReload();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'sites'}, ()=>scheduleReload())
    .on('postgres_changes',{event:'*',schema:'public',table:'order_requests'}, ()=>scheduleReload())
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){ if(!rtHealthy && job) syncOpenChat(); rtHealthy=true; }
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){   // lost the live link → keep trying, the chat check below covers the gap
        rtHealthy=false; clearTimeout(rtRetry); rtRetry=setTimeout(()=>{ if(me) subscribeRealtime(); },8000); }
    });
  // shares get their own line, so a database without update-16 can never stop the live chat
  if(typeof hasShares==='undefined'||hasShares) shareChan=sb.channel('sashdash-shares')
    .on('postgres_changes',{event:'*',schema:'public',table:'job_shares'}, ()=>scheduleReload()).subscribe();
  try{ waSubscribe(); }catch(e){ console.warn('wa live',e); }
}
// Safety net: while a job is open, any message the live link missed is picked up (every 15 s, and when you come back to the app)
async function syncOpenChat(){
  if(!job || !$('chat-list')) return;
  const id=job.id;
  const { data, error }=await sb.from('comments').select('*').eq('job_id',id).order('created_at');
  if(error || !job || job.id!==id) return;
  const fresh=(data||[]).filter(c=>!shownComments.has(c.id));
  if(!fresh.length) return;
  fresh.forEach(c=>appendComment(c,true));
  if(!previewing) sb.rpc('mark_job_seen',{p_job:id});
  scheduleReload();
}

let teamDragId=null, teamDragged=false;
function attachTeamDrag(){
  const g=$('team-grid'); if(!g || previewing || !isOffice) return;
  const cards=[...g.querySelectorAll('.tech-card[data-tid]')]; if(cards.length<2) return;
  const clear=()=>cards.forEach(c=>c.classList.remove('tg-before','tg-after','tg-dragging'));
  cards.forEach(c=>{ c.setAttribute('draggable','true');
    c.addEventListener('dragstart',e=>{ teamDragId=c.dataset.tid; teamDragged=true; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/sashdash-man',teamDragId); setTimeout(()=>c.classList.add('tg-dragging'),0); });
    c.addEventListener('dragend',()=>{ teamDragId=null; clear(); setTimeout(()=>teamDragged=false,50); });
    c.addEventListener('dragover',e=>{ if(!teamDragId||c.dataset.tid===teamDragId) return; e.preventDefault(); const r=c.getBoundingClientRect(), after=e.clientX>r.left+r.width/2;
      cards.forEach(x=>{ if(x!==c) x.classList.remove('tg-before','tg-after'); }); c.classList.toggle('tg-after',after); c.classList.toggle('tg-before',!after); });
    c.addEventListener('dragleave',()=>c.classList.remove('tg-before','tg-after'));
    c.addEventListener('drop',e=>{ if(!teamDragId) return; e.preventDefault(); const after=c.classList.contains('tg-after'), moved=teamDragId, target=c.dataset.tid; clear(); teamDragId=null;
      if(moved===target) return; const ids=cards.map(x=>x.dataset.tid).filter(id=>id!==moved); let at=ids.indexOf(target); if(after) at++; ids.splice(at,0,moved); saveTeamOrder(ids); });
    c.addEventListener('click',e=>{ if(teamDragged){ e.stopImmediatePropagation(); e.preventDefault(); } },true);
  });
}

// ══════════════════════════════════════════════════════════════════
//  Document scanner — camera photo → find the sheet → crop corners →
//  straighten → clean up like a scan. Pages are kept as JPEG bytes.
// ══════════════════════════════════════════════════════════════════
const Scanner = (() => {
  let src = null;          // {canvas, w, h}  the photo (rotated as chosen)
  let quad = null;         // 4 corners in photo pixels [TL, TR, BR, BL]
  let mode = 'clean';      // 'clean' | 'bw' | 'photo'
  let onDone = null, editingIndex = -1, origFile = null;
  let view = {scale:1, ox:0, oy:0};

  function loadImage(file){
    return new Promise((res,rej)=>{
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not read that photo — try again')); };
      img.src=url;
    });
  }
  function toCanvas(img, maxSide=3400){
    const k=Math.min(1, maxSide/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
    const c=document.createElement('canvas'); c.width=Math.round((img.naturalWidth||img.width)*k); c.height=Math.round((img.naturalHeight||img.height)*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c;
  }
  function rotate90(c){
    const r=document.createElement('canvas'); r.width=c.height; r.height=c.width;
    const x=r.getContext('2d'); x.translate(r.width,0); x.rotate(Math.PI/2); x.drawImage(c,0,0); return r;
  }

  // ── find the sheet: paper = bright, low-colour region → convex hull → best 4 corners ──
  function detect(c){
    const W=c.width, H=c.height, k=Math.min(1, 260/Math.max(W,H)), w=Math.max(8,Math.round(W*k)), h=Math.max(8,Math.round(H*k)), N=w*h;
    const s=document.createElement('canvas'); s.width=w; s.height=h; const sx=s.getContext('2d'); sx.filter='blur(1px)'; sx.drawImage(c,0,0,w,h);
    const d=sx.getImageData(0,0,w,h).data, g=new Uint8Array(N), sat=new Uint8Array(N), hist=new Array(256).fill(0);
    for(let i=0;i<N;i++){ const r=d[i*4],gg=d[i*4+1],bb=d[i*4+2]; const v=(r*0.299+gg*0.587+bb*0.114)|0; g[i]=v; sat[i]=Math.max(r,gg,bb)-Math.min(r,gg,bb); hist[v]++; }
    let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
    let sB=0,wB=0,best=0,th=128;
    for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*hist[t];
      const mB=sB/wB, mF=(sum-sB)/wF, between=wB*wF*(mB-mF)*(mB-mF); if(between>best){best=between; th=t;} }
    // paper stays colourless even in shadow; wood/desks/brochures have colour
    const P=window.__scanP||{}; const lowT=Math.max(55, th*(P.lowK??0.42));
    let m=new Uint8Array(N); for(let i=0;i<N;i++) m[i]=(g[i]>lowT && sat[i]<Math.max(P.satMin??22, g[i]*(P.satK??0.16)))?1:0;
    const morph=(src,r,dil)=>{ // square dilate/erode, separable

    el.querySelectorAll('.sc-modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    setStep('result');
  }
  async function finish(){
    const jpg=await toJpeg(resultCanvas);
    const page={...jpg, thumb:resultCanvas.toDataURL('image/jpeg',0.5), file:origFile, quad:quad.map(p=>[...p]), rotated:src.rotations||0, mode, srcCanvas:src.canvas};
    close(); onDone && onDone(page, editingIndex);
  }
  function close(){ ui().classList.add('hidden'); document.body.classList.remove('scanning'); }
  async function openWith(file){
    origFile=file;
    const img=await loadImage(file); src={canvas:toCanvas(img)}; quad=detect(src.canvas);
    const el=ui(); el.classList.remove('hidden'); document.body.classList.add('scanning'); setStep('crop');
  }
  return {
    // start a new scan from a camera/gallery file
    async start(file, cb){ onDone=cb; editingIndex=-1; mode='clean'; try{ await openWith(file); }catch(e){ toast(e.message||e); } },
    // re-open an existing page to re-crop it
    edit(page, index, cb){ onDone=cb; editingIndex=index; origFile=page.file; mode=page.mode||'clean';
      src={canvas:page.srcCanvas}; quad=page.quad.map(p=>[...p]); const el=ui(); el.classList.remove('hidden'); document.body.classList.add('scanning'); setStep('crop'); },
    retakeInput(){ return ui().querySelector('#sc-file'); },
    _detect:detect, _warp:warp, _enhance:enhance
  };
})();

    ${rows.map(({j,where,chat})=>{ const st=sites.find(x=>x.id===j.site_id)||{}, t=prof(j.serviceman_id);
      return `<tr onclick="goToJob('${j.id}')" title="Open this job">

const TT='https://api.tomtom.com';

let leafletP=null;
function loadLeaflet(){

const ptKey=p=>p.lat.toFixed(5)+','+p.lng.toFixed(5);
async function ttFetch(url, opt){
  const r=await fetch(url, opt);

// Eircode → spot. Exact house, or 'approx' when TomTom only knows the area. Office-placed pins always win.
async function geocodeEir(eir){
  eir=normEir(eir); if(geoCache.has(eir)) return geoCache.get(eir);
  if(!mapKey()) return null;
  let p=null;
  try{
    const d=await ttFetch(`${TT}/search/2/geocode/${encodeURIComponent(eir)}.json?key=${encodeURIComponent(mapKey())}&countrySet=IE&limit=1`);
    const r=d&&d.results&&d.results[0];
    if(r&&r.position){
      const pc=String((r.address&&(r.address.extendedPostalCode||r.address.postalCode))||'').toUpperCase().replace(/\s/g,'');
      const exact=r.type==='Point Address' || pc.includes(eir.replace(/\s/g,''));
      p={lat:+r.position.lat, lng:+r.position.lon, approx:!exact, manual:false};
    }
  }catch(e){ if(e.message==='quota') toast('⚠️ TomTom free allowance used up for now — try again later',6000); return null; }
  geoCache.set(eir,p);
  if(p) sb.from('eircode_geo').upsert({eircode:eir, lat:p.lat, lng:p.lng, approx:p.approx, manual:false}).then(()=>{},()=>{});
  return p;
}

function haversine(a,b){ const R=6371000, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
// Drive time (s) + distance (m) between every pair. Pairs already worked out are kept in the database, so TomTom is only asked about new ones.
async function roadMatrix(pts){
  const n=pts.length, K=pts.map(ptKey), T=[...Array(n)].map(()=>Array(n).fill(0)), D=[...Array(n)].map(()=>Array(n).fill(0));
  const est=(i,j)=>{ const d=haversine(pts[i],pts[j])*1.35; return {t:d/(55/3.6), d}; };
  const need=[]; for(let i=0;i<n;i++) for(let j=0;j<n;j++) if(i!==j && !legCache.has(K[i]+'>'+K[j])) need.push([i,j]);
  let ok=true;
  if(need.length && mapKey()){
    const oi=[...new Set(need.map(x=>x[0]))], di=[...new Set(need.map(x=>x[1]))];
    try{
      const body={origins:oi.map(i=>({point:{latitude:pts[i].lat, longitude:pts[i].lng}})), destinations:di.map(j=>({point:{latitude:pts[j].lat, longitude:pts[j].lng}})),
        options:{departAt:'any', traffic:'historical', routeType:'fastest', travelMode:'car'}};
      const d=await ttFetch(`${TT}/routing/matrix/2?key=${encodeURIComponent(mapKey())}`,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      const rows=[];
      (d.data||[]).forEach(c=>{ const s=c.routeSummary; if(!s) return; const i=oi[c.originIndex], j=di[c.destinationIndex]; if(i===j) return;
        const v={t:+s.travelTimeInSeconds, d:+s.lengthInMeters}; legCache.set(K[i]+'>'+K[j],v); rows.push({from_key:K[i], to_key:K[j], secs:Math.round(v.t), metres:Math.round(v.d)}); });
      if(rows.length) sb.from('route_legs').upsert(rows).then(()=>{},()=>{});
    }catch(e){ ok=false; if(e.message==='quota') toast('⚠️ TomTom free allowance used up for now — times are estimated',6000); }
  }
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){ if(i===j) continue; const v=legCache.get(K[i]+'>'+K[j]); if(!v) ok=false; const x=v||est(i,j); T[i][j]=x.t; D[i][j]=x.d; }
  return {T,D,ok};
}
// The road line for the map (one request per order, remembered)
async function routeLine(pts){
  const k=pts.map(ptKey).join('|'); if(lineCache.has(k)) return lineCache.get(k);
  try{
    const d=await ttFetch(`${TT}/routing/1/calculateRoute/${pts.map(p=>p.lat+','+p.lng).join(':')}/json?key=${encodeURIComponent(mapKey())}&travelMode=car&routeType=fastest&traffic=false`);
    const line=[]; ((d.routes&&d.routes[0]&&d.routes[0].legs)||[]).forEach(l=>(l.points||[]).forEach(q=>line.push([q.latitude,q.longitude])));
    if(line.length){ lineCache.set(k,line); return line; }
  }catch(e){}
  return null;
}

// ── Run a route through the day: arrival times, waiting for customers, late flags ──
// order = indexes into stops (matrix index = stop index + 1; 0 = depot)
function simulate(order, stops, M, cfg){
  let t=cfg.start, pos=0, km=0, drive=0, late=0, wait=0; const legs=[];
  for(const k of order){
    const dt=M.T[pos][k+1]/60; drive+=dt; km+=M.D[pos][k+1]/1000;
    let arr=t+dt; const [e,l]=availWin(stops[k].j.avail);
    let w=0; if(arr<e){ w=e-arr; arr=e; wait+=w; }
    const lt=Math.max(0,arr-l); late+=lt;
    legs.push({k, arr, wait:w, late:lt}); t=arr+cfg.svc; pos=k+1;
  }
  if(cfg.round && order.length){ const dt=M.T[pos][0]/60; drive+=dt; km+=M.D[pos][0]/1000; t+=dt; }
  const lateCount=legs.filter(x=>x.late>0.5).length;
  return {order, legs, km, drive, wait, late, lateCount, finish:t, cost:(t-cfg.start)+late*50+lateCount*500+km*0.01};
}
function bestOrder(stops, M, cfg){
  const n=stops.length; if(n<2) return simulate([...Array(n).keys()],stops,M,cfg);
  let best=null;
  if(n<=8){   // try every order
    const a=[...Array(n).keys()], c=Array(n).fill(0); best=simulate(a.slice(),stops,M,cfg);
    let i=0; while(i<n){ if(c[i]<i){ const s=i%2?c[i]:0; [a[s],a[i]]=[a[i],a[s]]; const r=simulate(a.slice(),stops,M,cfg); if(r.cost<best.cost) best=r; c[i]++; i=0; } else { c[i]=0; i++; } }
    return best;
  }
  // bigger days: earliest-window-first nearest neighbour, then keep improving with swaps & moves
  const left=new Set(stops.keys()), seq=[]; let pos=0;
  while(left.size){ let pick=null, sc=Infinity;
    for(const k of left){ const e=availWin(stops[k].j.avail)[0], l=availWin(stops[k].j.avail)[1]; const s=M.T[pos][k+1]/60 + e*0.5 + (l<Infinity?-200:0); if(s<sc){ sc=s; pick=k; } }
    seq.push(pick); left.delete(pick); pos=pick+1; }
  best=simulate(seq,stops,M,cfg);
  let improved=true, guard=0;
  while(improved && guard++<200){ improved=false;
    for(let i=0;i<n-1;i++) for(let j=i+1;j<n;j++){
      const r2=best.order.slice(0,i).concat(best.order.slice(i,j+1).reverse(), best.order.slice(j+1)); const s2=simulate(r2,stops,M,cfg); if(s2.cost<best.cost-0.01){ best=s2; improved=true; }
      const mv=best.order.slice(); const [x]=mv.splice(i,1); mv.splice(j,0,x); const s3=simulate(mv,stops,M,cfg); if(s3.cost<best.cost-0.01){ best=s3; improved=true; } }
  }
  return best;
}

// ── The day's stops: open jobs with an Eircode. Done / not home / re-book drop off the map ──
function dayJobsOrdered(siteId){
  const dj=jobs.filter(j=>j.site_id===siteId).sort((a,b)=>a.created_at<b.created_at?-1:1);
  const num=new Map(dj.map((j,i)=>[j.id, jobNo(j)||i+1]));
  return dj.sort((a,b)=>num.get(a.id)-num.get(b.id)).map(j=>({j, n:num.get(j.id)}));
}
const isOpenJob=j=>!j.completed && !jobOutcome(j);
async function computeDay(siteId){
  await loadRouteData();
  const all=dayJobsOrdered(siteId), open=all.filter(x=>isOpenJob(x.j));
  const noEir=open.filter(x=>!x.j.eircode || !eirValid(x.j.eircode));
  const cfg=RC();
  if(!routeCfg || !routeCfg.map_key) return {err:'nokey', all, open, noEir};
  if(!routeCfg.depot_eircode) return {err:'nodepot', all, open, noEir};
  const depot=await geocodeEir(routeCfg.depot_eircode); if(!depot) return {err:'depotbad', all, open, noEir};
  const stops=[], notFound=[];
  for(const x of open.filter(x=>!noEir.includes(x))){ const p=await geocodeEir(x.j.eircode); if(p) stops.push({...x, p}); else notFound.push(x); }
  const M=await roadMatrix([depot, ...stops.map(s=>s.p)]);
  const job=simulate([...stops.keys()], stops, M, cfg), best=bestOrder(stops, M, cfg);
  const same=job.order.join()===best.order.join() || best.cost>=job.cost-0.5;
  return {all, open, noEir, notFound, stops, depot, M, cfg, job, best:same?job:best, same};
}

// ── Renumber the day's job boxes in a given order (Job 1, 2, 3…) ──
async function setDayOrder(siteId, ids, kind){ return saveDayOrder(siteId, ids, kind||'order', null); }
// 🔒 the day's order as the server has it: by job number, then when added (the same rule the database uses)
let hasOrderRpc=true; window.orderSaving=false;
function dayOrderNow(siteId){ return jobs.filter(j=>j.site_id===siteId).sort((a,b)=>((jobNo(a)??999999)-(jobNo(b)??999999)) || (a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0) || (a.id<b.id?-1:1)).map(j=>j.id); }
// every job number on the day changes together, in one go — never half-done (e.g. if SashDash updates itself mid-save),
// and refused if the day was changed on another screen since this one last loaded
async function saveDayOrder(siteId, ids, kind, movedId){
  const rest=t=>String(t||'').replace(/^job\s*\d+\s*[-–·:]?\s*/i,'').trim();
  const before=dayOrderNow(siteId), changes=[];
  ids.forEach((id,i)=>{ const j=jobs.find(x=>x.id===id); if(!j) return; const nt=`Job ${i+1}${rest(j.title)?' – '+rest(j.title):''}`; if(nt!==j.title) changes.push({j, old:j.title, nt}); });
  if(!changes.length) return 0;
  window.orderSaving=true;
  changes.forEach(c=>c.j.title=c.nt); renderPortal();   // show the new order straight away
  try{
    if(hasOrderRpc){
      const { data, error }=await sb.rpc('set_day_order',{p_site:siteId, p_ids:ids, p_before:before, p_kind:kind, p_moved:movedId});
      if(error && /set_day_order|function|schema cache/i.test(error.message) && !/SASHDASH_STALE|Only the office/.test(error.message)){ hasOrderRpc=false; }
      else if(error){
        changes.forEach(c=>c.j.title=c.old);
        if(/SASHDASH_STALE/.test(error.message)){ await loadData(); renderPortal(); toast('↻ This day was just changed on another screen — here\'s the latest order. Nothing was moved; please try again.',8000); return -1; }
        throw error; }
      else return changes.length;
    }
    for(const c of changes){ const { error }=await sb.from('jobs').update({title:c.nt}).eq('id',c.j.id); if(error) throw error; }   // database not updated yet (update-29)
    return changes.length;
  }catch(e){ changes.forEach(c=>c.j.title=c.old); renderPortal(); toast('Could not change the order: '+(e.message||e),6000); return -1; }
  finally{ window.orderSaving=false; }
}

// Office clicks Best route → the job boxes are renumbered 1, 2, 3… in best-route order straight away
async function chooseBest(siteId){
  if(!isOffice || previewing){ dayMapView[siteId]='best'; return drawDayMap(siteId); }
  const R=lastDay&&lastDay.siteId===siteId?lastDay.R:await computeDay(siteId);
  if(!R.stops || !R.stops.length) return;
  if(R.same){ toast('✓ The jobs are already in the best order'); return; }
  const before=R.all.map(x=>x.j.id);
  const bestIds=R.best.order.map(k=>R.stops[k].j.id), inRoute=new Set(bestIds);
  const finished=R.all.filter(x=>!isOpenJob(x.j)).map(x=>x.j.id);                  // done / not home / re-book keep the first numbers
  const unplaced=R.all.filter(x=>isOpenJob(x.j)&&!inRoute.has(x.j.id)).map(x=>x.j.id);   // no Eircode → after the route
  routeUndo[siteId]=before;
  const n=await setDayOrder(siteId, [...finished, ...bestIds, ...unplaced], 'best');
  if(n>0) toast(`🧭 Jobs renumbered in best-route order — ${n} job${n===1?'':'s'} changed`,4000); else delete routeUndo[siteId];
  renderPortal();
}
async function undoBest(siteId){

// ══════════════════════════════════════════════════════════════════
//  🤝 SHARE / COVER — the office lets one man cover another's job, folder,
//  day, week or any run of days. The jobs stay the original man's: whatever
//  the covering man does is saved on those jobs. It ends by itself.
// ══════════════════════════════════════════════════════════════════
let shares=[], hasShares=true;
const shareActive=s=>s.ends>=todayYmd();
function siteOf(j){ return sites.find(s=>s.id===j.site_id); }
function shareHits(sh,j){
  if(j.serviceman_id!==sh.owner_id) return false;
  if(sh.kind==='job')  return j.id===sh.job_id;
  if(sh.kind==='site') return j.site_id===sh.site_id;
  if(sh.kind==='days'){ const s=siteOf(j); return !!s && deptOf(s)==='calls' && !!s.work_date && s.work_date>=sh.starts && s.work_date<=sh.ends; }
  return false;
}
function sharesOn(j){ return shares.filter(s=>shareActive(s)&&shareHits(s,j)); }
function coverOf(j){ return [...new Set(sharesOn(j).map(s=>s.cover_id))]; }
function coverJobsFor(techId,d){
  const my=shares.filter(s=>shareActive(s)&&s.cover_id===techId); if(!my.length) return [];
  return jobs.filter(j=>j.serviceman_id!==techId && (!d||deptOf(j)===d) && my.some(s=>shareHits(s,j)));
}
function untilTxt(s){ return s.ends===todayYmd()?'today only':'until '+dayLabel(s.ends); }
function coverTag(j){
  const viewing=isOffice?($('view-portal')&&!$('view-portal').classList.contains('hidden')?currentTechId:null):(me&&me.id);
  if(viewing && j.serviceman_id!==viewing) return `<span class="tag share">🤝 ${esc(firstName(prof(j.serviceman_id).full_name))}'s job</span>`;
  const c=coverOf(j); return c.length?`<span class="tag share" title="Shared with another service man">🤝 ${c.map(id=>esc(firstName(prof(id).full_name))).join(', ')} covering</span>`:'';
}
function shareWhat(s){
  const ow=firstName(prof(s.owner_id).full_name);
  if(s.kind==='job'){ const j=jobs.find(x=>x.id===s.job_id); return j?`${ow}'s ${j.title}`:`one of ${ow}'s jobs`; }
  if(s.kind==='site'){ const x=sites.find(y=>y.id===s.site_id); return `${ow}'s ${x?x.name:'folder'}`; }
  return `${ow}'s ${s.starts===s.ends?dayLabel(s.starts):dayLabel(s.starts)+' – '+dayLabel(s.ends)}`;
}

// ══ 🕘 Repeat customers — call history, old calls as read-only tabs, import from the weekly download ══

function pastCalls(j){

  const rows=new Map(callHist.map(r=>[r.id,r]));

    for(let i=0;i<eirs.length;i+=80) await q(sb.from('call_history').select(HIST_COLS).in('eir_key',eirs.slice(i,i+80)));

async function bkFolder(ask){ const h=await kvGet(BK_DIR); if(!h || !h.queryPermission) return null;

async function bkReadText(dir, name){ try{ const fh=await dir.getFileHandle(name); return await (await fh.getFile()).text(); }catch(e){ return null; } }
async function bkWriteFile(dir, path, data){ const parts=path.split('/').filter(Boolean); let h=dir;
  for(const p of parts.slice(0,-1)) h=await h.getDirectoryHandle(p,{create:true});
  const fh=await h.getFileHandle(parts[parts.length-1],{create:true}), w=await fh.createWritable(); await w.write(data instanceof ArrayBuffer?new Uint8Array(data):data); await w.close(); }
async function bkDirAt(dir, path, create){ let h=dir; for(const p of path.split('/').filter(Boolean)){ try{ h=await h.getDirectoryHandle(p,{create:!!create}); }catch(e){ return null; } } return h; }
async function bkRemove(dir, path){ const parts=path.split('/').filter(Boolean), parent=await bkDirAt(dir, parts.slice(0,-1).join('/'));
  if(parent){ try{ await parent.removeEntry(parts[parts.length-1],{recursive:true}); }catch(e){} } }
async function bkReadIndex(dir){ const t=await bkReadText(dir,'index.json'); try{ const x=t?JSON.parse(t):null; if(x&&x.calls) return x; }catch(e){} return {sashdash:'archive', v:1, calls:{}, updated_at:null}; }

// ── 💾 Back up now ──
async function runBackup(opts={}){
  const auto=!!opts.auto;
  if(bkBusy) return; const a=bkAccount(); if(!a || previewing) return;
  if(!canPickFolder) return toast('Backups need Edge or Chrome on a computer.',6000);

  let dir=await bkFolder(true); if(!dir){ const h=await kvGet(BK_DIR); if(!h) return bkChooseFolder(true); if(auto) return bkAutoAsk(h); return toast('SashDash needs permission to save into the folder — try again and click "Edit files".',7000); }

function ocListHtml(list){ let last='', h='';

// called by 💾 Back up (office PC only). Saves every month that changed, then clears messages older than 4 months that are safely saved.
async function ocBackupTo(dir){
  if(!hasOc || bkAccount()!=='office') return null;
  const { data, error }=await sb.from('office_chat').select('*').order('created_at');
  if(error) return null;
  const idx=JSON.parse(await bkReadText(dir,'office-chat-index.json')||'{}'); let saved=0;
  const by=new Map(); for(const c of data||[]){ const key=c.tech_id+'|'+ocMonthKey(c.created_at); if(!by.has(key)) by.set(key,[]); by.get(key).push(c); }
  for(const [key, msgs] of by){
    const [techId, k]=key.split('|'), base=`${ocManFolder(techId)}/${k} ${ocMonthName(k)}`;
    const prevDisk=JSON.parse(await bkReadText(await bkDirAt(dir,base)||dir, 'chat.json')||'null');
    const old=(prevDisk&&prevDisk.tech_id===techId)?prevDisk.messages:[];      // keep anything already cleared from the server
    const all=[...old.filter(o=>!msgs.some(m=>m.id===o.id)), ...msgs].sort((x,y)=>x.created_at<y.created_at?-1:1);
    const sig=all.length+'|'+all[all.length-1].id;
    if(idx[key]===sig) continue;
    const photoNames={}; let n=0;
    for(const c of all){ if(!c.photo_path) continue; const fn=`photo-${String(++n).padStart(3,'0')}.jpg`; photoNames[c.id]=fn;
      if(msgs.some(m=>m.id===c.id)){ try{ const { data:b }=await sb.storage.from(BUCKET).download(c.photo_path); if(b) await bkWriteFile(dir, `${base}/photos/${fn}`, await b.arrayBuffer()); }catch(e){} } }
    const people={}; all.forEach(c=>{ const p=prof(c.author_id); people[c.author_id]={name:p.full_name||'', role:p.role||''}; });
    await bkWriteFile(dir, `${base}/chat.json`, JSON.stringify({sashdash:'office-chat', tech_id:techId, man:prof(techId).full_name, month:k, people, messages:all.map(c=>({...c, photo_file:photoNames[c.id]||null}))}));
    await bkWriteFile(dir, `${base}/chat.html`, await ocMonthHtml(techId, k, all, photoNames));
    idx[key]=sig; saved+=msgs.length;
  }
  await bkWriteFile(dir,'office-chat-index.json', JSON.stringify(idx));
  // clear from the server: older than 4 months AND in the backup just written
  const cut=ocCutoff(), old=(data||[]).filter(c=>c.created_at<cut && idx[c.tech_id+'|'+ocMonthKey(c.created_at)]);
  if(old.length){ const ph=old.map(c=>c.photo_path).filter(Boolean);
    for(let i=0;i<ph.length;i+=100) await sb.storage.from(BUCKET).remove(ph.slice(i,i+100));
    for(let i=0;i<old.length;i+=100){ const r=await sb.from('office_chat').delete().in('id',old.slice(i,i+100).map(c=>c.id)); if(r.error) throw r.error; }
    ocMsgs.clear(); ocLoaded.clear(); await ocLoadSummary(); }
  return {saved, cleared:old.length, total:(data||[]).length};
}

const eirTowns=new Map(); let eirTownsLoaded=false, hasEirTown=true; const eirTownBusy=new Map(), eirTownQ=new Set(); let eirTownT=null;
function eirArea(e){ const k=normEir(e).slice(0,3); const a=EIR_AREAS[k]; return a?{key:k, town:a[0], county:a[1]}:null; }
function cleanCounty(c){ return String(c||'').replace(/^(county|co\.?)\s+/i,'').replace(/\s+(county|city)$/i,'').trim(); }
// {town, county, exact} — exact=true when TomTom found the house's own town
function eirPlace(e){ if(!e) return null; const n=normEir(e), a=eirArea(n), t=eirTowns.get(n);
  if(t && t.town) return {town:t.town, county:t.county||(a&&a.county)||'', area:a&&a.town, exact:true};
  return a?{town:a.town, county:a.county, area:a.town, exact:false}:null; }
function eirPlaceText(e, long){ const p=eirPlace(e); if(!p) return '';
  const near=p.exact && p.area && p.area.toLowerCase()!==p.town.toLowerCase() && !/^dublin/i.test(p.area) ? ` (near ${p.area})` : '';
  return `${p.town}${p.exact?'':(/^dublin \d/i.test(p.town)?'':' area')}${long?near:''} · Co. ${p.county}`; }
async function eirTownsLoad(){ if(eirTownsLoaded) return; eirTownsLoaded=true;
  const r=await sb.from('eircode_geo').select('eircode,town,county').not('town','is',null);
  if(r.error){ hasEirTown=false; return; } (r.data||[]).forEach(x=>eirTowns.set(x.eircode,{town:x.town, county:x.county})); }
// ask TomTom for the town of one Eircode (once — then it's saved)
async function eirTownLookup(e){
  const n=normEir(e); if(!eirValid(n) || eirTowns.has(n) || !hasEirTown) return eirTowns.get(n)||null;
  if(eirTownBusy.has(n)) return eirTownBusy.get(n);
  const job=(async()=>{
    await loadRouteData(); if(!mapKey()) return null;
    let d; try{ d=await ttFetch(`${TT}/search/2/geocode/${encodeURIComponent(n)}.json?key=${encodeURIComponent(mapKey())}&countrySet=IE&limit=1`); }catch(err){ return null; }
    const r=d&&d.results&&d.results[0]; if(!r||!r.address) { eirTowns.set(n,{town:null}); return null; }
    const ad=r.address, pc=String(ad.extendedPostalCode||ad.postalCode||'').toUpperCase().replace(/\s/g,'');
    const exact=r.type==='Point Address' || pc.includes(n.replace(/\s/g,''));
    const a=eirArea(n), county=cleanCounty(ad.countrySecondarySubdivision)||(a&&a.county)||'';
    let town=exact ? (ad.municipalitySubdivision||ad.municipality||'') : '';
    if(/^dublin$/i.test(town) && a && /^dublin/i.test(a.town)) town=a.town;     // "Dublin" → "Dublin 7"
    town=String(town).trim();
    const v={town:town||null, county:county||null}; eirTowns.set(n,v);
    if(town){

        <button class="sig-skip" id="sig-skip">Customer can't sign?</button>
      </div>`;
    document.body.appendChild(ov); document.body.classList.add('sig-open');

    const size=()=>{ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a'; ctx.lineWidth=2.6; };
    size();
    const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); down=true; last=pos(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,7); ctx.fillStyle='#0f172a'; ctx.fill(); });
    cv.addEventListener('pointermove',e=>{ if(!down) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); const m={x:(last.x+p.x)/2,y:(last.y+p.y)/2}; ctx.quadraticCurveTo(last.x,last.y,m.x,m.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; if(++pts>8 && !drawn){ drawn=true; $('sig-ok').disabled=false; ov.classList.add('signed'); } });
    const up=()=>{ down=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

    $('sig-x').onclick=()=>done(null);
    $('sig-clear').onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); drawn=false; pts=0; $('sig-ok').disabled=true; ov.classList.remove('signed'); };

  });

// Save a file: into the chosen folder if possible (returns 'folder'), otherwise a normal download (returns 'download')
async function saveToComputer(blob, filename){
  const h=await kvGet('archiveDir');
  if(h && h.queryPermission){
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){ try{ perm=await h.requestPermission({mode:'readwrite'}); }catch(e){} }
    if(perm==='granted'){
      const fh=await h.getFileHandle(filename,{create:true}); const w=await fh.createWritable(); await w.write(blob); await w.close();
      return {how:'folder', where:h.name};
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  return {how:'download', where:'Downloads'};
}
async function blobToDataUrl(b){ return await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }

// <folder>/<Site>/Order 2012 - John - 2026-10-09.pdf   (+ "- APPROVED.pdf" for your marked-up copy)
function orderFileBase(r){
  const t=prof(r.serviceman_id), when=new Date(r.created_at);
  const d=`${when.getFullYear()}-${String(when.getMonth()+1).padStart(2,'0')}-${String(when.getDate()).padStart(2,'0')}`;
  const raw=String(r.title||'').trim(), hasNo=raw && !/^order request$/i.test(raw);
  const no=hasNo ? (/^order\b/i.test(raw)?raw:`Order ${raw}`) : `No order number ${String(when.getHours()).padStart(2,'0')}${String(when.getMinutes()).padStart(2,'0')}`;
  const site=String(r.site_name||'No site').trim(), siteNice=site.replace(/\b\w/g,c=>c.toUpperCase());
  return { dir:safeName(siteNice), name:`${safeName(no)} - ${safeName(firstName(t.full_name||'Unknown'))} - ${d}` };

async function fileExists(dir, name){ try{ await dir.getFileHandle(name); return true; }catch(e){ return false; } }
async function writeFile(dir, name, blob){ const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(blob); await w.close(); }
// silent = automatic run (no prompts); otherwise a click, so we may ask for permission
async function syncOrdersToFolder({silent=true, list}={}){
  if(!isAdmin || previewing) return {saved:0};
  if(ordersSyncBusy){ ordersSyncAgain=true; return {saved:0, busy:true}; }
  const h=await getOrdersDir(); if(!h) return {saved:0, none:true};
  if(!await ordersFolderPerm(h, !silent)){ if(!ordersNeedsPerm){ ordersNeedsPerm=true; renderFolderPanel(); } return {saved:0, perm:false}; }
  ordersNeedsPerm=false; ordersSyncBusy=true;
  let saved=0, failed=0;
  try{
    let index={}; try{ const f=await (await h.getFileHandle(ORDERS_INDEX)).getFile(); index=JSON.parse(await f.text())||{}; }catch(e){}
    const reqs=list || orderReqs.filter(r=>r.department==='sites');
    let changed=false;
    const oldDirs=new Set();
    for(const r of reqs){
      const got=index[r.id]||{}, {dir,name}=orderFileBase(r);
      // only your APPROVED copy is kept — one file per order, saved once it's approved
      const target={approved:`${dir}/${name}.pdf`};
      const j=r.job_id && jobs.find(x=>x.id===r.job_id);
      let overwrite=false;
      if(got.scan){   // tidy away the man's scan saved by an earlier version
        const [od,...rest]=got.scan.split('/');
        if(got.scan===target.approved) overwrite=true;    // the scan sits where the approved copy goes → replace it
        else { try{ const oh=await h.getDirectoryHandle(od); await oh.removeEntry(rest.join('/')); oldDirs.add(od); }catch(e){} }
        delete got.scan; index[r.id]=got; changed=true;
      }
      const want=[];
      if(got.approved!==target.approved && j && j.pdf_path) want.push(['approved', j.pdf_path]);
      if(!want.length) continue;
      const sub=await h.getDirectoryHandle(dir,{create:true});
      for(const [kind,path] of want){
        const fname=target[kind].split('/').pop();
        try{
          if(overwrite || !await fileExists(sub,fname)){
            const dl=await sb.storage.from(BUCKET).download(path); if(dl.error) throw dl.error;
            await writeFile(sub, fname, dl.data); saved++;
          }
          if(got[kind] && got[kind]!==target[kind]){   // saved before under the old layout → tidy it away
            const [od,...rest]=got[kind].split('/'); try{ const oh=await h.getDirectoryHandle(od); await oh.removeEntry(rest.join('/')); oldDirs.add(od); }catch(e){}
          }
          got[kind]=target[kind];
        }catch(e){ failed++; }
      }
      got.order=r.title; got.man=prof(r.serviceman_id).full_name; got.site=r.site_name||''; got.sent=r.created_at;
      index[r.id]=got; changed=true;
    }
    await writeFile(h, ORDERS_INDEX, new Blob([JSON.stringify(index,null,1)],{type:'application/json'}));
    for(const od of oldDirs){ try{ const oh=await h.getDirectoryHandle(od); let empty=true; for await (const _ of oh.keys()){ empty=false; break; } if(empty) await h.removeEntry(od); }catch(e){} }   // remove emptied old folders
    ordersSyncAt=Date.now(); ordersLast={saved, failed, at:new Date()};
    if(saved && !silent) toast(`📁 ${saved} file${saved===1?'':'s'} saved to "${h.name}"`,4000);
    else if(saved) toast(`📁 ${saved} new order file${saved===1?'':'s'} saved to "${h.name}"`,3500);
    else if(!silent) toast(failed?`⚠️ ${failed} file${failed===1?'':'s'} couldn't be saved — try again`:`📁 "${h.name}" is up to date — nothing new`,4000);
  }catch(e){ if(!silent) toast('Could not save to the folder: '+(e.message||e),6000); }
  finally{ ordersSyncBusy=false; const el=$('ord-sync-info'); if(el) el.textContent=ordersSyncInfo();
    if(ordersSyncAgain){ ordersSyncAgain=false; setTimeout(()=>syncOrdersToFolder({silent:true}),500); } }
  return {saved, failed};
}
function ordersSyncInfo(){ return ordersLast ? `Last checked ${ordersLast.at.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'})}${ordersLast.saved?` · ${ordersLast.saved} saved`:''}` : ''; }

let ordersSyncTimer=null;

  if(!isAdmin || dept!=='sites' || previewing) return;

}

// ── report.pdf for the week download: job details, the full conversation with photos, then the sheet ──
async function jobReportPdf({title, rows, msgs, sheet}){
  const P=PDFLib, doc=await P.PDFDocument.create();
  const F=await doc.embedFont(P.StandardFonts.Helvetica), FB=await doc.embedFont(P.StandardFonts.HelveticaBold);
  const okCh=new Map();
  const clean=s=>{ let o=''; for(const ch of String(s??'').replace(/\r/g,'')){ if(ch==='\n'){ o+=ch; continue; }
      if(!okCh.has(ch)){ let ok=true; try{ F.encodeText(ch); }catch(e){ ok=false; } okCh.set(ch,ok); }
      if(okCh.get(ch)) o+=ch; } return o.replace(/[ \t]+/g,' ').trim(); };
  const W=595.28, H=841.89, M=42, CW=W-2*M, grey=P.rgb(.39,.45,.55), ink=P.rgb(.07,.09,.15), line=P.rgb(.85,.87,.9);
  let page=null, y=0;
  const newPage=()=>{ page=doc.addPage([W,H]); y=H-M;
    page.drawText(clean('Sean Doyle Windows · SashDash job report'),{x:M,y:H-26,size:8.5,font:F,color:grey}); };
  const need=h=>{ if(!page || y-h<M) newPage(); };
  const wrap=(text,font,size,maxW)=>{ const out=[];
    for(const para of clean(text).split('\n')){ let cur='';
      for(let w of para.split(' ')){
        while(font.widthOfTextAtSize(w,size)>maxW){ let k=w.length; while(k>1 && font.widthOfTextAtSize(w.slice(0,k),size)>maxW) k--; if(cur){ out.push(cur); cur=''; } out.push(w.slice(0,k)); w=w.slice(k); }
        const t=cur?cur+' '+w:w; if(font.widthOfTextAtSize(t,size)>maxW){ out.push(cur); cur=w; } else cur=t; }
      out.push(cur); }
    return out; };
  const text=(t,{font=F,size=11,color=ink,x=M,maxW=CW,gap=3}={})=>{ for(const l of wrap(t,font,size,maxW)){ need(size+gap); y-=size; page.drawText(l,{x,y,size,font,color}); y-=gap; } };
  newPage();
  text(title,{font:FB,size:17,gap:8});
  // details table
  for(const [k,v] of rows){
    const vl=wrap(v||'—',F,10.5,CW-150), h=Math.max(1,vl.length)*14+8; need(h);
    page.drawRectangle({x:M,y:y-h,width:150,height:h,color:P.rgb(.95,.96,.98),borderColor:line,borderWidth:.7});
    page.drawRectangle({x:M+150,y:y-h,width:CW-150,height:h,borderColor:line,borderWidth:.7});
    page.drawText(clean(k),{x:M+7,y:y-15,size:10.5,font:FB,color:ink});
    vl.forEach((l,i)=>page.drawText(l,{x:M+157,y:y-15-i*14,size:10.5,font:F,color:ink}));
    y-=h; }
  y-=18; text('Conversation',{font:FB,size:13,gap:8});
  if(!msgs.length) text('No messages.',{color:grey});
  for(const m of msgs){
    if(m.kind==='event'){ const ls=wrap(`${m.when} · ${m.who} · ${m.body}`,F,10,CW-16), h=ls.length*13+10; need(h+6);
      page.drawRectangle({x:M,y:y-h,width:CW,height:h,color:P.rgb(.95,.96,.98)}); page.drawRectangle({x:M,y:y-h,width:3,height:h,color:grey});
      ls.forEach((l,i)=>page.drawText(l,{x:M+10,y:y-14-i*13,size:10,font:F,color:ink})); y-=h+6; continue; }
    need(40); y-=4;
    const head=clean(m.who), hw=FB.widthOfTextAtSize(head,11); y-=11;
    page.drawText(head,{x:M,y,size:11,font:FB,color:ink}); page.drawText(clean(m.when),{x:M+hw+8,y,size:9,font:F,color:grey}); y-=5;
    if(m.body) text(m.body,{size:11,gap:3.5});
    if(m.img){ try{ const bytes=new Uint8Array(await m.img.arrayBuffer()); let im; try{ im=await doc.embedJpg(bytes); }catch(e){ im=await doc.embedPng(bytes); }
        const s=Math.min(CW/im.width, 330/im.height, 1); const w=im.width*s, h=im.height*s; need(h+8); y-=h+4;
        page.drawImage(im,{x:M,y,width:w,height:h}); page.drawRectangle({x:M,y,width:w,height:h,borderColor:line,borderWidth:.7}); y-=4; }catch(e){ text('(photo could not be added)',{color:grey,size:9}); } }
    y-=4; need(6); page.drawLine({start:{x:M,y},end:{x:M+CW,y},thickness:.5,color:line}); y-=6;
  }
  // the sheet itself (marked-up copy if there is one)
  if(sheet){ try{ const src=await P.PDFDocument.load(await sheet.arrayBuffer(),{ignoreEncryption:true}); (await doc.copyPages(src,src.getPageIndices())).forEach(p=>doc.addPage(p)); }catch(e){} }
  return await doc.save();
}

// Build a zip of one week (all men, or one man) — PDFs, marked-up PDFs, photos and a readable report per job
async function buildWeekZip(week, techId, onStep){
  const days=sites.filter(x=>deptOf(x)==='calls'&&x.work_date&&weekOf(x.work_date)===week&&(!techId||x.serviceman_id===techId));
  const wj=jobs.filter(j=>days.some(d=>d.id===j.site_id));
  const zip=new JSZip(), root=zip.folder(`SashDash - Private Calls - w-c ${weekName(week)}`);
  const { data:allC }=wj.length ? await sb.from('comments').select('*').in('job_id',wj.map(j=>j.id)).order('created_at') : {data:[]};
  let index=`<h1>Private Calls — week of ${weekName(week)}</h1><p>Archived ${new Date().toLocaleString('en-IE')} by ${esc((realMe||me).full_name)}</p><ul>`;
  let n=0;
  for(const d of days.sort((a,b)=>a.work_date<b.work_date?-1:1)){
    const t=prof(d.serviceman_id), dj=wj.filter(j=>j.site_id===d.id).sort((a,b)=>a.created_at<b.created_at?-1:1);
    if(!dj.length) continue;   // empty day: nothing to archive (still deleted with the week)
    const dayDir=root.folder(safeName(t.full_name)).folder(safeName(dayLabel(d.work_date)));
    const usedDir=new Set();
    for(const j of dj){
      onStep&&onStep(++n, wj.length, j.title);
      const jdName=weekJobDir(j, usedDir); j._dir=jdName;
      const jd=dayDir.folder(jdName);
      await writeJobFiles(jd, j, d, t, allC, {oldCalls:true});
      index+=`<li>${esc(t.full_name)} · ${esc(dayLabel(d.work_date))} · <a href="${encodeURI(safeName(t.full_name)+'/'+safeName(dayLabel(d.work_date))+'/'+j._dir+'/report.html')}">${esc(j.title)}</a> (<a href="${encodeURI(safeName(t.full_name)+'/'+safeName(dayLabel(d.work_date))+'/'+j._dir+'/report.pdf')}">PDF</a>) — ${outcomeText(j)}</li>`;
    }
  }
  root.file('index.html', `<!doctype html><meta charset="utf-8"><title>Week of ${weekName(week)}</title><body style="font-family:Arial;max-width:820px;margin:20px auto">${index}</ul></body>`);
  const blob=await zip.generateAsync({type:'blob', compression:'STORE'});
  return {blob, jobs:wj.length, days, filename:`SashDash - Private Calls - w-c ${weekName(week)}${techId?' - '+safeName(prof(techId).full_name):''}.zip`};
}

// ⬇ Download week (any time) — every Private Calls man, a folder each
async function downloadWeek(week){
  week=week||calWeek; if(!week) return;
  try{
    toast('Preparing download…',60000);
    const z=await buildWeekZip(week, null, (i,n)=>toast(`Preparing download… job ${i} of ${n}`,60000));
    if(!z.jobs) { toast('No jobs in that week yet — nothing to download.',4000); return; }
    const r=await saveToComputer(z.blob, z.filename);
    toast(r.how==='folder'?`✅ Saved to "${r.where}" folder`:'✅ Downloaded — check your Downloads folder',5000);

// Always have 10 weeks of day tabs ready for every Private Calls man:
// the 3 previous weeks, this week and 7 weeks ahead.
const WEEKS_BACK=3, WEEKS_AHEAD=7;
let weeksBusy=false; const weeksTried=new Set();
async function ensureWeeks(_retry, onlyTech){
  if(previewing || !realMe || !['admin','service_office'].includes(realMe.role) || weeksBusy) return;
  weeksBusy=true;
  try{
    const mon=mondayOf(new Date()), fails=[]; let made=0;
    const have=new Set(sites.filter(x=>deptOf(x)==='calls'&&x.work_date).map(x=>x.serviceman_id+'|'+x.work_date));
    // one man at a time, so a problem with one never stops the others
    for(const t of jobMen('calls').filter(t=>!onlyTech||t.id===onlyTech)){
      const rows=[];
      for(let w=-WEEKS_BACK; w<=WEEKS_AHEAD; w++) for(let i=0;i<6;i++){ const d=ymd(addDays(mon,w*7+i)); if(!have.has(t.id+'|'+d)) rows.push({serviceman_id:t.id, department:'calls', work_date:d, name:dayLabel(d)}); }
      if(!rows.length) continue;
      // days that already exist are skipped, not treated as an error
      let { error }=await sb.from('sites').upsert(rows,{onConflict:'serviceman_id,department,work_date', ignoreDuplicates:true});
      if(error && /on conflict|no unique|constraint matching/i.test(error.message)){   // older database without the update-5 index: add one day at a time
        error=null; for(const r of rows){ const x=await sb.from('sites').insert(r); if(x.error && !/duplicate/i.test(x.error.message)){ error=x.error; break; } }
      }
      if(error) fails.push(`${firstName(t.full_name)}: ${error.message}`); else made+=rows.length;
    }
    if(made){ await loadData(); rerenderCurrent(); }
    if(fails.length) toast('⚠️ Could not set up the Private Calls diary for '+fails.join(' · '),9000);
  } finally { weeksBusy=false; }
}

async function runArchiveAndClean(){

// clean-up only ever removes jobs marked ✅ All done. Not home, Re-book and jobs never marked stay on the system.
const cleanJob=j=>jobOutcome(j)==='done';
function cleanupDueDays(cutoff){
  return sites.filter(x=>deptOf(x)==='calls'&&x.work_date&&x.work_date<cutoff).filter(x=>{ const dj=jobs.filter(j=>j.site_id===x.id); return !dj.length || dj.some(cleanJob); });
}
async function deleteWeekData(days){
  // only All done jobs are removed; a day is removed once nothing else is left on it
  const dayIds=days.map(x=>x.id), oj=jobs.filter(j=>dayIds.includes(j.site_id)&&cleanJob(j)), jobIds=oj.map(j=>j.id);
  await saveHistRows(oj.map(j=>histRow(j,'done')));
  const paths=[...oj.flatMap(j=>[j.pdf_path,j.marked_path]), ...await chatPhotoPaths(jobIds), ...importPathsFor(jobIds)].filter(Boolean);
  for(let i=0;i<paths.length;i+=100){ const r=await sb.storage.from(BUCKET).remove(paths.slice(i,i+100)); if(r.error) throw r.error; }
  for(let i=0;i<jobIds.length;i+=100){ const { error }=await sb.from('jobs').delete().in('id',jobIds.slice(i,i+100)); if(error) throw error; }
  const emptyIds=dayIds.filter(id=>!jobs.some(j=>j.site_id===id&&!jobIds.includes(j.id)));
  for(let i=0;i<emptyIds.length;i+=100){ const { error }=await sb.from('sites').delete().in('id',emptyIds.slice(i,i+100)); if(error) throw error; }
  return {jobs:jobIds.length, kept:jobs.filter(j=>dayIds.includes(j.site_id)&&!cleanJob(j)).length};
}

      <b>${first.toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</b>

// Files can be dropped anywhere on the upload window, not just the box
function attachDrop(){
  const d=$('m-drop'), zone=d.closest('.modal'); let depth=0;
  zone.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; d.classList.add('over'); });
  zone.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  zone.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) d.classList.remove('over'); });
  zone.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; d.classList.remove('over'); filesPicked(e.dataTransfer.files); });
}
function hasFiles(e){ return e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files'); }
// Stop the browser opening a file if it's dropped slightly outside the box
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{ if(hasFiles(e)) e.preventDefault(); }));
function filesPicked(fl){
  const ok=Array.from(fl).filter(f=>f.type==='application/pdf'||f.type.startsWith('image/')||/\.(pdf|jpe?g|png|heic)$/i.test(f.name));
  if(fl.length && !ok.length) toast('Only PDFs or photos can be uploaded.');

  if($('m-title') && !$('m-title').value && pendingFiles[0]) $('m-title').value=pendingFiles[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,80);
}
function removePending(i){ pendingFiles.splice(i,1); renderPendingFiles(); }
function renderPendingFiles(){
  if(!$('m-files')) return;
  $('m-files').innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>${/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)?'📄':'🖼️'}</span><span class="fi-name">${esc(f.name)}</span><span class="fi-size">${fmtBytes(f.size)}</span><button type="button" onclick="removePending(${i})" title="Remove">✕</button></div>`).join('');

// Downscale a photo to a sensible size and return JPEG bytes (saves storage)
function imageToJpeg(file, maxSide=2200){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?b.arrayBuffer().then(ab=>res({bytes:new Uint8Array(ab),w:c.width,h:c.height})):rej(new Error('Could not read image')),'image/jpeg',0.82); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(file.name+' is not an image this browser can read (try JPG/PNG)'));};
    img.src=url;
  });
}
async function buildUploadPdf(files){
  if(files.length===1 && files[0].type==='application/pdf') return new Uint8Array(await files[0].arrayBuffer());
  const out=await PDFLib.PDFDocument.create();
  for(const f of files){
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      const src=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
      (await out.copyPages(src, src.getPageIndices())).forEach(p=>out.addPage(p));
    } else {
      const im=await imageToJpeg(f); const jpg=await out.embedJpg(im.bytes);
      const W=595.28, H=W*im.h/im.w;                       // A4 width, keep the photo's shape
      out.addPage([W,H]).drawImage(jpg,{x:0,y:0,width:W,height:H});
    }
  }
  return await out.save();
}
// Upload a sheet as a new job for the current man + site/day
async function doUpload({files, title, ref, note, contact, route}){
  if(noJobs(currentTechId)) throw new Error(firstName(prof(currentTechId).full_name)+' is set to No new jobs');
  const id=uuid(), path=`${filePrefix(dept,currentTechId)}/${id}/original.pdf`;
  const bytes=await buildUploadPdf(files);
  const up=await sb.storage.from(BUCKET).upload(path, new Blob([bytes],{type:'application/pdf'}), {contentType:'application/pdf'});
  if(up.error) throw up.error;
  const row={ id, site_id:currentSiteId, serviceman_id:currentTechId, title, ref_no:ref||null,
    notes:null, pdf_path:path, pdf_bytes:bytes.length, created_by:me.id };
  const hasC=contact && Object.values(contact).some(Boolean);
  if(hasC && hasContact) Object.assign(row, contact);
  if(route && hasRoute && (route.eircode||route.avail||route.est_minutes||route.crew)) Object.assign(row, route);
  if(hasHist && dept==='calls' && formSkip.size) row.hist_skip=[...formSkip];
  let ins=await sb.from('jobs').insert(row);
  if(ins.error && /hist_skip/i.test(ins.error.message)){ delete row.hist_skip; ins=await sb.from('jobs').insert(row); }
  if(ins.error && /eircode|avail/i.test(ins.error.message)){ hasRoute=false; delete row.eircode; delete row.avail; ins=await sb.from('jobs').insert(row); setTimeout(()=>toast('⚠️ Eircode not saved — run update-15 in Supabase',8000),1200); }
  if(ins.error && /customer_/i.test(ins.error.message)){ hasContact=false; ['customer_phone','customer_phone2','customer_email'].forEach(k=>delete row[k]); ins=await sb.from('jobs').insert(row); }
  if(!ins.error && hasC && !hasContact){   // database not updated yet → job still sent, contact details go in the chat
    await sb.from('comments').insert({job_id:id, author_id:me.id, body:'Customer contact: '+[contact.customer_phone,contact.customer_phone2,contact.customer_email].filter(Boolean).join(' · ')});
    setTimeout(()=>toast('⚠️ Phone/email were put in the chat — run update-10 in Supabase to save them on the job',8000),1200);
  }
  if(ins.error){ await sb.storage.from(BUCKET).remove([path]); throw ins.error; }
  if(note) await sb.from('comments').insert({job_id:id, author_id:me.id, body:note});
  return id;
}

async function downloadFile(which){

    const { data, error }=await sb.storage.from(BUCKET).createSignedUrl(path, 300, {download:name});
