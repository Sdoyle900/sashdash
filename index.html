// Always have 10 weeks of day tabs ready for every Private Calls man:
// the 2 previous weeks, this week and 7 weeks ahead.
const WEEKS_BACK=2, WEEKS_AHEAD=7;
async function ensureWeeks(retry){
  if(previewing || !realMe || !['admin','service_office'].includes(realMe.role)) return;
  const mon=mondayOf(new Date()), rows=[];
  const have=new Set(sites.filter(x=>deptOf(x)==='calls'&&x.work_date).map(x=>x.serviceman_id+'|'+x.work_date));
  for(const t of techs('calls')){
    for(let w=-WEEKS_BACK; w<=WEEKS_AHEAD; w++){
      for(let i=0;i<6;i++){ const d=ymd(addDays(mon,w*7+i)); if(!have.has(t.id+'|'+d)) rows.push({serviceman_id:t.id, department:'calls', work_date:d, name:dayLabel(d)}); }
    }
  }
  if(!rows.length) return;
  for(let i=0;i<rows.length;i+=200){
    const { error }=await sb.from('sites').insert(rows.slice(i,i+200));
    if(error){ if(!retry){ await loadData(); return ensureWeeks(true); } console.warn('Could not set up weeks',error); return; }
  }
  await loadData(); rerenderCurrent();
}

// Monday clean-up: office or service department login, on a computer
async function checkCleanupDue(){
  if(previewing || !realMe || !['admin','service_office'].includes(realMe.role)) return;   // office or service department
  if(!window.matchMedia('(pointer:fine)').matches) return;            // a computer, not a phone
  const cutoff=cleanupCutoff();
  const flaggedDay=id=>jobs.some(j=>j.site_id===id && ['rebook','not_home'].includes(jobOutcome(j)));
  const due=[...new Set(sites.filter(x=>deptOf(x)==='calls'&&x.work_date&&x.work_date<cutoff&&!flaggedDay(x.id)).map(x=>weekOf(x.work_date)))].sort();
  if(!due.length) return;
  const nj=jobs.filter(j=>sites.some(x=>x.id===j.site_id&&deptOf(x)==='calls'&&x.work_date&&x.work_date<cutoff)).length;
  const folder=await kvGet('archiveDir');
  openModal(`<div style="text-align:center"><div style="font-size:40px">🧹</div>
    <h2 style="margin:6px 0">Weekly clean-up due</h2>
    <p style="color:var(--slate);font-size:14px">${due.map(w=>'Week of <b>'+weekName(w)+'</b>').join(', ')} — ${nj} job${nj===1?'':'s'} (all men).<br>It will be <b>saved to this computer first</b>, then removed from the server to free up space.</p></div>
    <div class="arch-box">📁 Save to: <b id="arch-folder">${folder?esc(folder.name):'Downloads folder'}</b>
      ${canPickFolder?`<button class="btn-outline" style="margin-left:auto" onclick="chooseArchiveFolder()">Choose folder…</button>`:''}</div>
    <div id="arch-status" class="arch-status hidden"></div>
    <div class="modal-actions" style="justify-content:center"><button class="btn-outline" onclick="closeModal()">Later</button>
      <button class="btn-primary" id="arch-go" onclick="runArchiveAndClean()">⬇ Save &amp; clear</button></div>`);
}
async function runArchiveAndClean(){
  const go=$('arch-go'), st=$('arch-status'); go.disabled=true; st.classList.remove('hidden');
  const cutoff=cleanupCutoff();
  const due=[...new Set(sites.filter(x=>deptOf(x)==='calls'&&x.work_date&&x.work_date<cutoff).map(x=>weekOf(x.work_date)))].sort();
  for(const w of due){
    let z, r;
    try{
      st.textContent=`Packing week of ${weekName(w)}…`;
      z=await buildWeekZip(w, null, (i,n,t)=>{ st.textContent=`Packing week of ${weekName(w)} — job ${i} of ${n}…`; });
      st.textContent=`Saving ${z.filename}…`;
      r=await saveToComputer(z.blob, z.filename);
    }catch(e){ st.innerHTML=`⚠️ Couldn't save the archive (${esc(e.message||e)}). <b>Nothing was deleted.</b>`; go.disabled=false; go.textContent='Try again'; return; }
    if(r.how==='download'){
      // we can't see the Downloads folder — ask before deleting
      const ok=await confirmBox({icon:'📥', title:'Is the archive downloaded?',
        body:`Check your <b>Downloads</b> folder for<br><b>${esc(z.filename)}</b><br>(${fmtBytes(z.blob.size)}). Only clear it from the server once it's there.`,
        ok:'Yes — clear from server', okClass:'btn-primary'});
      if(!ok){ toast('Nothing deleted — the clean-up will ask again next time.',5000); return; }
    }
    await deleteWeekData(z.days);
  }
  closeModal(); await loadData(); rerenderCurrent();
  toast(`✅ Archived to your computer and cleared ${due.length} week${due.length===1?'':'s'} from the server`,6000);
}
async function deleteWeekData(days){
  // keep any day that still has a job waiting in Not home / Re-book — it's cleared once rescheduled
  days=days.filter(d=>!jobs.some(j=>j.site_id===d.id && ['rebook','not_home'].includes(jobOutcome(j))));
  const ids=days.map(x=>x.id), oj=jobs.filter(j=>ids.includes(j.site_id));
  const paths=[...oj.flatMap(j=>[j.pdf_path,j.marked_path]), ...await chatPhotoPaths(oj.map(j=>j.id))].filter(Boolean);
  for(let i=0;i<paths.length;i+=100){ const r=await sb.storage.from(BUCKET).remove(paths.slice(i,i+100)); if(r.error) throw r.error; }
  for(let i=0;i<ids.length;i+=100){ const { error }=await sb.from('sites').delete().in('id',ids.slice(i,i+100)); if(error) throw error; }
}

// ── Month calendar — quick jump to any date (Private Calls) ────────
let calMonth=null;   // 'YYYY-MM-01' being shown
function calOpen(){ const v=localStorageSafe('calOpen'); return v===null ? window.innerWidth>720 : v==='1'; }
function toggleCal(){ localStorageSafe('calOpen', calOpen()?'0':'1'); renderPortal(); }
function calShift(n){ const d=parseYmd(calMonth); d.setMonth(d.getMonth()+n); calMonth=ymd(new Date(d.getFullYear(),d.getMonth(),1)); renderPortal(); }
function calToday(){ calMonth=null; jumpToDate(todayYmd()); }
function monthCalendar(mySites, tJobs, site){
  const focus = site&&site.work_date ? site.work_date : (calWeek||todayYmd());
  if(!calMonth){ const f=parseYmd(focus); calMonth=ymd(new Date(f.getFullYear(),f.getMonth(),1)); }
  const first=parseYmd(calMonth), start=mondayOf(first), today=todayYmd();
  const byDate={}; for(const s of mySites) if(s.work_date) byDate[s.work_date]=s;
  const dateOf={}; for(const s of mySites) if(s.work_date) dateOf[s.id]=s.work_date;
  const counts={}; for(const j of tJobs){ const v=dateOf[j.site_id]; if(!v) continue; const c=counts[v]||(counts[v]={open:0,done:0,news:false}); j.completed?c.done++:c.open++; if(unreadForMe(j)) c.news=true; }
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), v=ymd(d), inMonth=d.getMonth()===first.getMonth(), sun=d.getDay()===0, c=counts[v];
    if(i>=35 && !inMonth && d.getDay()===1) break;               // don't draw an empty last row
    const cls=['cal-d', inMonth?'':'out', sun?'sun':'', v===today?'today':'', site&&site.work_date===v?'sel':'', byDate[v]?'has':'', c&&c.open?'busy':''].filter(Boolean).join(' ');
    cells+= sun ? `<div class="${cls}"><span>${d.getDate()}</span></div>`
      : `<button class="${cls}" onclick="jumpToDate('${v}')" title="${d.toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'})}${c?` — ${c.open} open, ${c.done} done`:''}"><span>${d.getDate()}</span>${c?`<em class="${c.news?'news':''}">${c.open+c.done}</em>`:''}</button>`;
  }
  return `<div class="month-cal">
    <div class="mc-head"><button class="wk-nav" onclick="calShift(-1)" aria-label="Previous month">‹</button>
      <b>${first.toLocaleDateString('en-IE',{month:'long',year:'numeric'})}</b>
      <button class="wk-nav" onclick="calShift(1)" aria-label="Next month">›</button>
      <span class="spacer"></span><button class="btn-outline" onclick="calToday()">Today</button></div>
    <div class="mc-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="mc-dow">${x}</div>`).join('')}${cells}</div>
    <div class="mc-key"><span><em>2</em> jobs that day</span><span><em class="news">1</em> something new</span><span class="k-today">today</span></div>
  </div>`;
}
async function jumpToDate(v){
  if(parseYmd(v).getDay()===0) return toast('Sunday isn\'t a working day.');
  let day=sites.find(x=>x.serviceman_id===currentTechId&&deptOf(x)==='calls'&&x.work_date===v);
  if(!day){
    if(!isOffice || previewing) return toast('That day isn\'t in the diary yet.');
    // office: set up that week for this man, then go there
    const mon=mondayOf(parseYmd(v)), rows=[];
    for(let i=0;i<6;i++){ const d=ymd(addDays(mon,i)); if(!sites.some(x=>x.serviceman_id===currentTechId&&deptOf(x)==='calls'&&x.work_date===d)) rows.push({serviceman_id:currentTechId, department:'calls', work_date:d, name:dayLabel(d)}); }
    const { error }=await sb.from('sites').insert(rows); if(error) return toast('Could not set up that week: '+error.message,6000);
    await loadData(); day=sites.find(x=>x.serviceman_id===currentTechId&&deptOf(x)==='calls'&&x.work_date===v);
    toast(`Week of ${mon.toLocaleDateString('en-IE',{day:'numeric',month:'short'})} added to the diary`);
  }
  calWeek=weekOf(v); currentSiteId=day.id; jobFilter='all';
  const f=parseYmd(v); calMonth=ymd(new Date(f.getFullYear(),f.getMonth(),1));
  renderPortal();

// Files can be dropped anywhere on the upload window, not just the box
function attachDrop(){
  const d=$('m-drop'), zone=d.closest('.modal'); let depth=0;
  zone.addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth++; d.classList.add('over'); });
  zone.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
  zone.addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) d.classList.remove('over'); });
  zone.addEventListener('drop',     e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; d.classList.remove('over'); filesPicked(e.dataTransfer.files); });
}
function hasFiles(e){ return e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files'); }
// Stop the browser opening a file if it's dropped slightly outside the box
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{ if(hasFiles(e)) e.preventDefault(); }));
function filesPicked(fl){
  const ok=Array.from(fl).filter(f=>f.type==='application/pdf'||f.type.startsWith('image/')||/\.(pdf|jpe?g|png|heic)$/i.test(f.name));

  if(!$('m-title').value && pendingFiles[0]) $('m-title').value=pendingFiles[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,80);
}

function renderPendingFiles(){
  if(!$('m-files')) return;
  $('m-files').innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>${/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)?'📄':'🖼️'}</span><span class="fi-name">${esc(f.name)}</span><span class="fi-size">${fmtBytes(f.size)}</span><button type="button" onclick="removePending(${i})" title="Remove">✕</button></div>`).join('');

// Downscale a photo to a sensible size and return JPEG bytes (saves storage)
function imageToJpeg(file, maxSide=2200){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?b.arrayBuffer().then(ab=>res({bytes:new Uint8Array(ab),w:c.width,h:c.height})):rej(new Error('Could not read image')),'image/jpeg',0.82); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(file.name+' is not an image this browser can read (try JPG/PNG)'));};
    img.src=url;
  });
}
async function buildUploadPdf(files){
  if(files.length===1 && files[0].type==='application/pdf') return new Uint8Array(await files[0].arrayBuffer());
  const out=await PDFLib.PDFDocument.create();
  for(const f of files){
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      const src=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
      (await out.copyPages(src, src.getPageIndices())).forEach(p=>out.addPage(p));
    } else {
      const im=await imageToJpeg(f); const jpg=await out.embedJpg(im.bytes);
      const W=595.28, H=W*im.h/im.w;                       // A4 width, keep the photo's shape
      out.addPage([W,H]).drawImage(jpg,{x:0,y:0,width:W,height:H});
    }
  }
  return await out.save();
}
// Upload a sheet as a new job for the current man + site/day
async function doUpload({files, title, ref, note}){
  const id=uuid(), path=`${filePrefix(dept,currentTechId)}/${id}/original.pdf`;
  const bytes=await buildUploadPdf(files);
  const up=await sb.storage.from(BUCKET).upload(path, new Blob([bytes],{type:'application/pdf'}), {contentType:'application/pdf'});
  if(up.error) throw up.error;
  const ins=await sb.from('jobs').insert({ id, site_id:currentSiteId, serviceman_id:currentTechId, title, ref_no:ref||null,
    notes:null, pdf_path:path, pdf_bytes:bytes.length, created_by:me.id });
  if(ins.error){ await sb.storage.from(BUCKET).remove([path]); throw ins.error; }
  if(note) await sb.from('comments').insert({job_id:id, author_id:me.id, body:note});
  return id;
}

async function openJob(id){

// ── PDF rendering + mark-up ───────────────────────────────────────
async function renderPdf(){
  commitTextEditor();
  if(!pdfDoc) return;
  const token=++renderToken, wrap=$('pdf-pages'), scroller=$('pdf-scroll');
  if(scroller.offsetParent===null) return;   // pane hidden (mobile chat tab)
  const avail=Math.max(280, scroller.clientWidth - (window.innerWidth<720?16:32));
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const frag=document.createDocumentFragment(); const views=[];
  for(let i=1;i<=pdfDoc.numPages;i++){
    const page=await pdfDoc.getPage(i); if(token!==renderToken) return;
    const base=page.getViewport({scale:1});
    const scale=Math.min(avail/base.width, 2.2)*zoomLevel;
    const vp=page.getViewport({scale});
    const box=document.createElement('div'); box.className='pdf-page'; box.style.width=vp.width+'px'; box.style.height=vp.height+'px';
    const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr); cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    const ink=document.createElement('canvas'); ink.className='ink'; ink.width=cv.width; ink.height=cv.height; ink.style.width=vp.width+'px'; ink.style.height=vp.height+'px';
    box.append(cv,ink); frag.appendChild(box);
    views.push({page, vp, cv, ink, dpr, idx:i-1});
  }
  if(token!==renderToken) return;
  wrap.innerHTML=''; wrap.appendChild(frag); pageViews=views;
  $('zoom-lbl').textContent=Math.round(zoomLevel*100)+'%';
  views.forEach(v=>{ attachInk(v); drawInk(v); });
  for(const v of views){
    if(token!==renderToken) return;
    await v.page.render({canvasContext:v.cv.getContext('2d'), viewport:v.page.getViewport({scale:v.vp.scale*v.dpr})}).promise.catch(()=>{});
  }
}
function zoom(d){ zoomLevel = d===0?1:Math.min(4,Math.max(0.5, +(zoomLevel*(d>0?1.25:0.8)).toFixed(3))); renderPdf(); }
function toggleMarking(){ if(blockPreview()) return; setMarking(!marking); }
function setMarking(on){

  $('pdf-scroll').classList.toggle('marking',on);
  $('mark-tools').classList.toggle('hidden',!on);
  $('mark-hint').classList.toggle('hidden',!on);
  $('mark-toggle').classList.toggle('on',on);
  $('mark-toggle').closest('.toolbar').classList.toggle('marking-on',on);

  updateSaveBtn();
}
function setTool(t){ commitTextEditor(); setToolQuiet(t); }
// Switch tool without closing a note that's being typed
function setToolQuiet(t){ tool=t; document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('pdf-scroll').classList.toggle('tool-none', t==='none');
  $('mark-hint').textContent = t==='none' ? 'Note placed — you can scroll now. Tap T Text again to add another note (or to change/move one).'
    : t==='text' ? 'Text — tap the sheet where you want ONE note. Tap an existing note to change it, or drag it to move it.'
    : t==='erase' ? 'Eraser — tap any mark or note to remove it.'
    : 'Drawing on — drag across an item to strike it through. Tap ✏️ Mark up again to scroll.'; }
function setColour(c){ colour=c; document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.c===c)); if(tool==='erase') setTool('line'); }
function setDirty(v){ dirty=v; updateSaveBtn(); }
function updateSaveBtn(){ const b=$('save-btn'); b.classList.toggle('dirty',dirty); b.innerHTML=dirty?'💾 Save':'✓ Saved'; b.disabled=!dirty; $('undo-btn').disabled=!strokes.length; }

function toPdf(v,e){ const r=v.ink.getBoundingClientRect(); return v.vp.convertToPdfPoint(e.clientX-r.left, e.clientY-r.top).map(n=>+n.toFixed(2)); }
function toView(v,pt){ return v.vp.convertToViewportPoint(pt[0],pt[1]); }
// ── Text notes ─────────────────────────────────────────────────────
// stored as {p, t:'text', c, fs, pts:[[x,y]] (top-left, PDF units), text}
const TXT_FONT='Helvetica, Arial, sans-serif';
let measureCtx=null;
function textBoxPdf(s){
  measureCtx = measureCtx || document.createElement('canvas').getContext('2d');
  measureCtx.font=`${s.fs}px ${TXT_FONT}`;
  const lines=String(s.text||'').split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
  const w=Math.max(s.fs, ...lines.map(l=>measureCtx.measureText(l).width))+pad*2;
  return {lines, pad, lh, w, h:lines.length*lh+pad*2};
}
function textRectView(v,s){ const [x,y]=toView(v,s.pts[0]), b=textBoxPdf(s), k=v.vp.scale; return {x,y,w:b.w*k,h:b.h*k}; }
function hitText(v,x,y){ for(let i=strokes.length-1;i>=0;i--){ const s=strokes[i]; if(s.t!=='text'||s.p!==v.idx) continue;
  const r=textRectView(v,s); if(x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-4&&y<=r.y+r.h+4) return s; } return null; }
function defaultFontSize(v){ const w=Math.abs(v.vp.viewBox[2]-v.vp.viewBox[0])||595; return Math.round(Math.max(9, Math.min(22, w/46))); }
let textEd=null;   // {el, v, s (existing or null), pt}
function openTextEditor(v, s, pt){
  commitTextEditor();
  const fs=s?s.fs:defaultFontSize(v), c=s?s.c:colour, k=v.vp.scale;
  const [x,y]=toView(v, s?s.pts[0]:pt);
  const el=document.createElement('textarea'); el.className='txt-ed'; el.rows=1; el.value=s?s.text:'';
  el.placeholder='Type a note…';
  Object.assign(el.style,{left:x+'px', top:y+'px', fontSize:(fs*k)+'px', color:c, borderColor:c, padding:(fs*0.35*k)+'px', lineHeight:'1.25'});
  v.ink.parentElement.appendChild(el);
  if(s){ s._hidden=true; drawInk(v); }
  textEd={el, v, s, pt, fs, c};
  const grow=()=>{ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; el.style.width='auto'; el.style.width=Math.max(140, el.scrollWidth+4)+'px'; };
  el.addEventListener('input',grow);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); commitTextEditor(); } if(e.key==='Escape'){ commitTextEditor(true); } });
  el.addEventListener('blur',()=>setTimeout(()=>{ if(textEd&&textEd.el===el) commitTextEditor(); },120));
  setTimeout(()=>{ grow(); el.focus(); },30);
}
function commitTextEditor(cancel){
  if(!textEd) return; const {el,v,s,pt,fs,c}=textEd; textEd=null;
  const val=el.value.replace(/\s+$/,''); el.remove();
  if(s){ delete s._hidden;
    if(!cancel){ if(!val){ strokes=strokes.filter(x=>x!==s); setDirty(true); } else if(val!==s.text){ s.text=val; setDirty(true); } } }
  else if(!cancel && val){ strokes.push({p:v.idx, t:'text', c, fs, pts:[pt], text:val}); setDirty(true); }
  drawInk(v); updateSaveBtn();
}
// pdf-lib's built-in Helvetica only knows Western characters — swap the rest
function pdfSafe(t){ return String(t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\n\x20-\x7E -ÿ€]/g,'?'); }

function attachInk(v){
  let cur=null;
  v.ink.addEventListener('pointerdown',e=>{
    if(!marking) return; e.preventDefault(); v.ink.setPointerCapture(e.pointerId);
    const p=toPdf(v,e);
    if(tool==='text'){
      commitTextEditor();
      const r=v.ink.getBoundingClientRect(), s=hitText(v,e.clientX-r.left,e.clientY-r.top);
      cur={text:true, s, start:p, orig:s?[...s.pts[0]]:null, moved:false}; return;
    }
    if(tool==='erase'){ eraseAt(v,e); cur={erase:true}; return; }
    cur={p:v.idx, t:tool, c:colour, w: tool==='hl'?10:(tool==='pen'?1.8:2.4), pts:[p, p]};
    strokes.push(cur); drawInk(v);
  });
  v.ink.addEventListener('pointermove',e=>{
    if(!cur) return; e.preventDefault();
    if(cur.erase){ eraseAt(v,e); return; }
    const p=toPdf(v,e);
    if(cur.text){
      if(cur.s && (cur.moved || Math.hypot(p[0]-cur.start[0],p[1]-cur.start[1])>3)){
        cur.moved=true; cur.s.pts[0]=[+(cur.orig[0]+p[0]-cur.start[0]).toFixed(2), +(cur.orig[1]+p[1]-cur.start[1]).toFixed(2)]; drawInk(v);
      }
      return;
    }
    if(cur.t==='line'){
      // snap to horizontal when nearly level — perfect for striking an item through
      const a=cur.pts[0], ang=Math.abs(Math.atan2(p[1]-a[1], p[0]-a[0])*180/Math.PI);
      if(ang<8||ang>172) p[1]=a[1];

    } else {
      const last=cur.pts[cur.pts.length-1];
      if(Math.hypot(p[0]-last[0],p[1]-last[1])>0.6) cur.pts.push(p);
    }
    drawInk(v);
  });

    if(!cur) return;
    if(cur.text){
      const c=cur; cur=null;
      if(c.moved){ setDirty(true); drawInk(v); }
      else setTimeout(()=>openTextEditor(v, c.s, c.start), 0);   // tap: edit existing note or start a new one
      setToolQuiet('none');   // one note per tap of the Text button — stops stray boxes when scrolling on a phone
      return;
    }
    if(!cur.erase){
      const [a,b]=[cur.pts[0],cur.pts[cur.pts.length-1]];
      if(cur.t!=='pen' && Math.hypot(b[0]-a[0],b[1]-a[1])<3){ strokes.pop(); }   // ignore accidental taps
      else { if(cur.t==='pen'&&cur.pts.length>2) cur.pts.splice(1,1); setDirty(true); }
    }
    cur=null; drawInk(v); updateSaveBtn();
  };
  v.ink.addEventListener('pointerup',end); v.ink.addEventListener('pointercancel',end);
}
function eraseAt(v,e){
  const r=v.ink.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const hit=(s)=>{ if(s.p!==v.idx) return false;
    if(s.t==='text'){ const q=textRectView(v,s); return x>=q.x-4&&x<=q.x+q.w+4&&y>=q.y-4&&y<=q.y+q.h+4; }
    const tol=Math.max(10, s.w*v.vp.scale/2+6);
    for(let i=0;i<s.pts.length-1;i++){ const [ax,ay]=toView(v,s.pts[i]), [bx,by]=toView(v,s.pts[i+1]);
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)):0;
      if(Math.hypot(x-(ax+t*dx), y-(ay+t*dy))<tol) return true; } return false; };

}
function drawInk(v){

// Draw a list of marks onto a page (used on screen and when printing)
function paintStrokes(ctx, v, list){
  for(const s of list){
    if(s.p!==v.idx||!s.pts.length||s._hidden) continue;
    if(s.t==='text'){
      const b=textBoxPdf(s), k=v.vp.scale, [x,y]=toView(v,s.pts[0]);
      ctx.save(); ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(x,y,b.w*k,b.h*k);
      ctx.strokeStyle=s.c; ctx.lineWidth=Math.max(1,1.2*k); ctx.strokeRect(x,y,b.w*k,b.h*k);
      ctx.fillStyle=s.c; ctx.font=`${s.fs*k}px ${TXT_FONT}`; ctx.textBaseline='alphabetic';
      b.lines.forEach((l,i)=>ctx.fillText(l, x+b.pad*k, y+(b.pad+s.fs*0.95+i*b.lh)*k));
      ctx.restore(); continue;
    }
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=s.c; ctx.lineWidth=s.w*v.vp.scale;
    if(s.t==='hl'){ ctx.globalAlpha=.35; ctx.globalCompositeOperation='multiply'; }
    ctx.beginPath(); s.pts.forEach((pt,i)=>{ const [x,y]=toView(v,pt); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); ctx.restore();
  }
}
function redrawAllInk(){ pageViews.forEach(drawInk); updateSaveBtn(); }
function undoStroke(){ if(!strokes.length) return; strokes.pop(); setDirty(true); redrawAllInk(); }
function clearStrokes(){ if(!strokes.length) return; if(!confirm('Remove all marks on this sheet?')) return; strokes=[]; setDirty(true); redrawAllInk(); }

function hexRgb(h){ const n=parseInt(h.slice(1),16); return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255); }
// Burn the marks into a copy of the original PDF (original stays untouched)
async function buildMarkedPdf(bytes, list){
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}); const pages=doc.getPages();
  let font=null;
  for(const s of list){
    const pg=pages[s.p]; if(!pg||!s.pts.length) continue;
    if(s.t==='text'){
      font = font || await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      const lines=pdfSafe(s.text).split('\n'), pad=s.fs*0.35, lh=s.fs*1.25;
      const w=Math.max(s.fs, ...lines.map(l=>font.widthOfTextAtSize(l,s.fs)))+pad*2, h=lines.length*lh+pad*2;
      const [x,y]=s.pts[0];
      pg.drawRectangle({x, y:y-h, width:w, height:h, color:PDFLib.rgb(1,1,1), opacity:0.92, borderColor:hexRgb(s.c), borderWidth:1.2});
      lines.forEach((l,i)=>pg.drawText(l,{x:x+pad, y:y-pad-s.fs*0.95-i*lh, size:s.fs, font, color:hexRgb(s.c)}));
      continue;
    }
    let d=s.pts.map((q,i)=>(i?'L':'M')+q[0]+' '+(-q[1])).join(' ');
    if(s.pts.length===1) d+=` L${s.pts[0][0]+0.1} ${-s.pts[0][1]}`;
    pg.drawSvgPath(d,{x:0,y:0,borderColor:hexRgb(s.c),borderWidth:s.w,borderOpacity:s.t==='hl'?0.4:1,
      borderLineCap:PDFLib.LineCapStyle.Round, blendMode:s.t==='hl'?PDFLib.BlendMode.Multiply:undefined});
  }
  return await doc.save();
}
async function saveMarkup(){ if(blockPreview()) return;
  commitTextEditor();
  if(!job||!origBytes) return;
  const b=$('save-btn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Saving…';
  try{
    const markedPath=`${filePrefix(deptOf(job),job.serviceman_id)}/${job.id}/marked.pdf`;
    let path=null, size=0;
    if(strokes.length){
      const out=await buildMarkedPdf(origBytes, strokes);
      const up=await sb.storage.from(BUCKET).upload(markedPath, new Blob([out],{type:'application/pdf'}), {upsert:true, contentType:'application/pdf'});
      if(up.error) throw up.error;
      path=markedPath; size=out.length;
    } else if(job.marked_path){
      await sb.storage.from(BUCKET).remove([job.marked_path]);
    }
    const { error }=await sb.rpc('save_markup',{p_job:job.id, p_markup:strokes, p_marked_path:path, p_marked_bytes:size});
    if(error) throw error;
    job.marked_path=path; job.marked_bytes=size; setDirty(false); updateJobHeader();
    toast(isOffice?'Mark-up saved':'Saved — the office can see your marks ✓'); scheduleReload();
  }catch(e){ setDirty(true); toast('Save failed: '+(e.message||e),6000); }
}

// ── Conversation ──────────────────────────────────────────────────
let shownComments=new Set(), shownMsgs=0;
async function loadComments(){
  const id=job.id;
  const { data, error }=await sb.from('comments').select('*').eq('job_id',id).order('created_at');
  if(!job||job.id!==id) return;
  shownComments=new Set(); shownMsgs=0; $('chat-count').textContent=''; $('chat-list').innerHTML='';
  if(error){ $('chat-list').innerHTML=`<div class="loading">${esc(error.message)}</div>`; return; }
  if(!data.length) $('chat-list').innerHTML='<div class="loading" id="chat-empty">No messages yet. Ask a question or leave an update about this job.</div>';
  data.forEach(c=>appendComment(c,false));
  const l=$('chat-list'); l.scrollTop=l.scrollHeight;
}
function appendComment(c, scroll){
  if(shownComments.has(c.id)) return; shownComments.add(c.id);
  const em=$('chat-empty'); if(em) em.remove();
  const el=document.createElement('div');
  if(c.kind==='event'){ el.className='evt'; el.textContent=`${firstName(prof(c.author_id).full_name)} · ${c.body} · ${fmtWhen(c.created_at)}`; }
  else { const mine=c.author_id===me.id, a=prof(c.author_id);
    el.className='msg'+(mine?' me':'');
    const photo=c.photo_path?`<div class="photo-wrap"><img class="chat-photo" data-path="${esc(c.photo_path)}" alt="Photo" onclick="openLightbox(this)"><span class="ph-load">📷</span></div>`:'';
    el.innerHTML=`${mine?'':`<div class="who">${esc(a.full_name)}${roleLabel(a.role)?' · '+roleLabel(a.role):''}</div>`}<div class="bub ${c.photo_path?'has-photo':''}">${photo}${c.body?`<div class="cap">${esc(c.body)}</div>`:''}</div><div class="when">${fmtWhen(c.created_at)}</div>`;
    if(c.photo_path) loadChatPhoto(el.querySelector('img'), scroll); }
  const l=$('chat-list'); l.appendChild(el);
  if(c.kind!=='event') shownMsgs++;
  $('chat-count').textContent=shownMsgs?`(${shownMsgs})`:'';
  if(scroll) l.scrollTop=l.scrollHeight;
}
async function sendMessage(){ if(blockPreview()) return;
  const ta=$('chat-input'), body=ta.value.trim(); if(!body||!job) return;
  ta.value=''; autoGrow(ta);
  const { data, error }=await sb.from('comments').insert({job_id:job.id, author_id:me.id, body}).select().single();
  if(error){ ta.value=body; return toast('Not sent: '+error.message,5000); }
  appendComment(data,true);
}

// ── Photos in the conversation ────────────────────────────────────
const photoUrls=new Map();   // storage path -> short-lived link
async function photoUrl(path){
  const hit=photoUrls.get(path); if(hit && hit.exp>Date.now()) return hit.url;
  const { data, error }=await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error) throw error;
  photoUrls.set(path,{url:data.signedUrl, exp:Date.now()+50*60*1000}); return data.signedUrl;
}
async function loadChatPhoto(img, scroll){
  try{
    img.onload=()=>{ img.parentElement.classList.add('loaded'); if(scroll){ const l=$('chat-list'); l.scrollTop=l.scrollHeight; } };
    img.src=await photoUrl(img.dataset.path);
  }catch(e){ img.parentElement.querySelector('.ph-load').textContent='⚠️ Photo unavailable'; }
}
async function sendPhotos(fl){ if(blockPreview()) return;
  const files=Array.from(fl||[]).filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!files.length||!job) return;
  const jobId=job.id, prefix=`${filePrefix(deptOf(job),job.serviceman_id)}/${job.id}/photos`;
  const ta=$('chat-input'); let caption=ta.value.trim(); ta.value=''; autoGrow(ta);
  const l=$('chat-list'), ph=document.createElement('div'); ph.className='msg me';
  ph.innerHTML=`<div class="bub has-photo"><div class="photo-wrap sending"><span class="spin" style="border-color:#c7d2fe;border-top-color:#4f46e5"></span><span style="font-size:12px;color:var(--slate)">Sending ${files.length} photo${files.length===1?'':'s'}…</span></div></div>`;
  l.appendChild(ph); l.scrollTop=l.scrollHeight;
  let sent=0;
  for(const f of files){
    try{
      const im=await imageToJpeg(f,1600);                   // shrink to save data
      const path=`${prefix}/${uuid()}.jpg`;
      const up=await sb.storage.from(BUCKET).upload(path, new Blob([im.bytes],{type:'image/jpeg'}), {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      const { data, error }=await sb.from('comments').insert({job_id:jobId, author_id:me.id, body:caption, photo_path:path, photo_bytes:im.bytes.length}).select().single();
      if(error){ await sb.storage.from(BUCKET).remove([path]); throw error; }
      caption=''; sent++;
      if(job&&job.id===jobId) appendComment(data,true);
    }catch(e){ toast('Photo not sent: '+(e.message||e)+((e.message||'').match(/photo_path|mime|column/i)?' — run update-3 in Supabase':''),7000); }
  }
  ph.remove(); l.scrollTop=l.scrollHeight;
}
function openLightbox(img){
  if(!img.src) return;
  $('lb-img').src=img.src; $('lb-dl').href=img.src;
  const cap=img.closest('.bub').querySelector('.cap'); $('lb-cap').textContent=cap?cap.textContent:'';
  $('lightbox').classList.remove('hidden');
}
function closeLightbox(){ $('lightbox').classList.add('hidden'); $('lb-img').src=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });
// Photos stored with a job's chat — removed from the server when the job goes
async function chatPhotoPaths(jobIds){
  if(!jobIds.length) return [];
  const { data }=await sb.from('comments').select('photo_path').in('job_id',jobIds);
  return (data||[]).map(r=>r.photo_path).filter(Boolean);
}
// ── Reschedule a Private Calls job to another day ────────────────
let reschedId=null;
function openReschedule(id){ if(blockPreview()) return;
  $('jv-menu').classList.add('hidden');
  const j=jobs.find(x=>x.id===(id||(job&&job.id))) || job; if(!j) return;
  const from=sites.find(x=>x.id===j.site_id)||{}; if(!from.work_date) return toast('Only jobs on a day can be rescheduled.');
  reschedId=j.id;
  const mon=mondayOf(parseYmd(from.work_date)), today=todayYmd();
  const chip=d=>{ const v=ymd(d), cur=v===from.work_date;
    return `<label class="rs-day ${cur?'cur':''} ${v<today?'past':''}"><input type="radio" name="rs" value="${v}">
      <b>${d.toLocaleDateString('en-IE',{weekday:'short'})}</b><small>${d.toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</small>${cur?'<em>now</em>':v===today?'<em>today</em>':''}</label>`; };
  const week=k=>[0,1,2,3,4,5].map(i=>chip(addDays(mon,7*k+i))).join('');
  openModal(`<h2>📅 Reschedule ${esc(j.title)}</h2>
    <p style="color:var(--slate);font-size:13px;margin:-8px 0 14px">Currently on <b>${dayLong(from.work_date)}</b> for <b>${esc(prof(j.serviceman_id).full_name)}</b>. The sheet, mark-ups, chat and photos all move with it.</p>
    <div class="field-group"><label>Service man</label><select id="rs-tech">${techs('calls').map(t=>`<option value="${t.id}" ${t.id===j.serviceman_id?'selected':''}>${esc(t.full_name)}${t.id===j.serviceman_id?' (current)':''}</option>`).join('')}</select></div>
    <div class="field-group"><label>This week</label><div class="rs-grid">${week(0)}</div></div>
    <div class="field-group"><label>Next week</label><div class="rs-grid">${week(1)}</div></div>
    <div class="field-group"><label>Or another date</label><input type="date" id="rs-date" onchange="document.querySelectorAll('input[name=rs]').forEach(r=>r.checked=false)"></div>
    <div class="field-group"><label>Reason <span class="optional">(optional — added to the chat)</span></label><input id="rs-why" placeholder="e.g. customer not home"></div>
    <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">Cancel</button><button class="btn-primary" id="m-save" onclick="doReschedule()">📅 Move job</button></div>`);
}
async function doReschedule(){
  const j=jobs.find(x=>x.id===reschedId); if(!j) return closeModal();
  const from=sites.find(x=>x.id===j.site_id)||{};
  const picked=document.querySelector('input[name=rs]:checked');
  const newTid=$('rs-tech').value, oldTid=j.serviceman_id, manChange=newTid!==oldTid;
  const day=picked?picked.value:($('rs-date').value||(manChange?from.work_date:''));
  if(!day) return toast('Pick the new day (or a different service man).');
  if(day===from.work_date && !manChange) return toast("That's the day and man it's already on.");
  if(parseYmd(day).getDay()===0) return toast('Sunday isn\'t a working day — pick Monday to Saturday.');
  const btn=$('m-save'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Moving…';
  try{
    const tid=newTid;
    let target=sites.find(x=>x.serviceman_id===tid&&deptOf(x)==='calls'&&x.work_date===day);
    if(!target){   // that week doesn't exist yet for him — create its 6 days
      const mon=mondayOf(parseYmd(day)), rows=[];
      for(let i=0;i<6;i++){ const d=ymd(addDays(mon,i)); if(!sites.some(x=>x.serviceman_id===tid&&deptOf(x)==='calls'&&x.work_date===d)) rows.push({serviceman_id:tid, department:'calls', work_date:d, name:dayLabel(d)}); }
      const { error }=await sb.from('sites').insert(rows); if(error) throw error;
      await loadData(); target=sites.find(x=>x.serviceman_id===tid&&deptOf(x)==='calls'&&x.work_date===day);
      if(!target) throw new Error('Could not create the new day');
    }
    // becomes the next job number on the new day (keeps any name after the number)
    const n=nextJobNo(target.id), rest=(j.title||'').replace(/^job\s*\d+\s*/i,'');
    const newTitle=/^job\s*\d+/i.test(j.title||'') ? `Job ${n}${rest?' '+rest:''}` : j.title;
    const upd={site_id:target.id, title:newTitle, tech_unread:true, last_activity_at:new Date().toISOString()};
    const wasFlagged=['rebook','not_home'].includes(jobOutcome(j));
    if(wasFlagged){ upd.outcome=null; upd.completed=false; upd.completed_at=null; }   // back in the diary → out of the folder
    let movedPhotos=[];
    if(manChange){
      // files live in each man's own folder — move them so the new man can open them
      const oldPre=filePrefix('calls',oldTid)+'/', newPre=filePrefix('calls',tid)+'/';
      const mv=async p=>{ if(!p||!p.startsWith(oldPre)) return p; const np=newPre+p.slice(oldPre.length);
        const r=await sb.storage.from(BUCKET).move(p,np); if(r.error) throw r.error; return np; };
      upd.serviceman_id=tid; upd.pdf_path=await mv(j.pdf_path); upd.marked_path=await mv(j.marked_path);
      const { data:ph }=await sb.from('comments').select('id,photo_path').eq('job_id',j.id).not('photo_path','is',null);
      for(const c of (ph||[])) movedPhotos.push({id:c.id, path:await mv(c.photo_path)});
    }
    const { error }=await sb.from('jobs').update(upd).eq('id',j.id);
    if(error) throw error;
    for(const c of movedPhotos){ const r=await sb.from('comments').update({photo_path:c.path}).eq('id',c.id);
      if(r.error){ toast('Job moved, but photos need update-4 in Supabase: '+r.error.message,8000); break; } }
    const why=$('rs-why').value.trim(), parts=[];
    if(day!==from.work_date) parts.push(`from ${dayLong(from.work_date)} to ${dayLong(day)}`);
    if(manChange) parts.push(`from ${prof(oldTid).full_name} to ${prof(tid).full_name}`);
    await sb.from('comments').insert({job_id:j.id, author_id:me.id, body:`📅 Rescheduled ${parts.join(', and ')}${why?' — '+why:''}`});
    closeModal();
    const fromFolder=!$('view-dashboard').classList.contains('hidden');
    calWeek=ymd(mondayOf(parseYmd(day))); currentSiteId=target.id; currentTechId=tid;
    if(job&&job.id===j.id){ Object.assign(job,upd); updateJobHeader(); }
    await loadData(); rerenderCurrent(); if(fromFolder&&openFolder) renderFolderPanel();
    toast(`Moved to ${manChange?firstName(prof(tid).full_name)+' · ':''}${dayLong(day)} ✓${wasFlagged?' — removed from the folder':''}`);
  }catch(e){ btn.disabled=false; btn.textContent='📅 Move job'; toast('Could not reschedule: '+(e.message||e),6000); }
}

// ── Print a job: details, every page with mark-ups, and the full conversation ──
async function printJob(id){
  $('jv-menu').classList.add('hidden');
  const jid=id||(job&&job.id); if(!jid) return;
  toast('Preparing print…',20000);
  try{
    const { data:j, error }=await sb.from('jobs').select(JOB_COLS+',markup').eq('id',jid).single();
    if(error) throw error;
    const marks = (job && job.id===jid) ? strokes : (j.markup||[]);   // include unsaved marks if it's open
    const site=sites.find(x=>x.id===j.site_id)||{}, t=prof(j.serviceman_id), D=DEPT[deptOf(j)];
    // 1. sheet pages with marks burnt in
    const f=await sb.storage.from(BUCKET).download(j.pdf_path); if(f.error) throw f.error;
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.data.arrayBuffer())}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i), base=pg.getViewport({scale:1}), vp=pg.getViewport({scale:Math.min(2.2, 1400/base.width)});
      const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx, viewport:vp}).promise;
      paintStrokes(ctx, {vp, idx:i-1}, marks);
      pages.push(c.toDataURL('image/jpeg',0.9));
    }
    // 2. conversation (with photos)
    const { data:cm }=await sb.from('comments').select('*').eq('job_id',jid).order('created_at');
    const chat=[];
    for(const c of (cm||[])){
      const a=prof(c.author_id), when=new Date(c.created_at).toLocaleString('en-IE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      if(c.kind==='event'){ chat.push(`<div class="p-evt">${esc(when)} · ${esc(a.full_name)} · ${esc(c.body)}</div>`); continue; }
      let img=''; if(c.photo_path){ try{ img=`<img class="p-photo" src="${await photoUrl(c.photo_path)}">`; }catch(e){ img='<i>[photo unavailable]</i>'; } }
      chat.push(`<div class="p-msg"><div class="p-who"><b>${esc(a.full_name)}</b>${roleLabel(a.role)?' ('+roleLabel(a.role)+')':''} · ${esc(when)}</div>${c.body?`<div>${esc(c.body).replace(/\n/g,'<br>')}</div>`:''}${img}</div>`);
    }
    const where=site.work_date?dayLong(site.work_date):(site.name||'');
    const fmtD=x=>x?new Date(x).toLocaleString('en-IE',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
    $('print-root').innerHTML=`
      <div class="p-head"><img src="sdwindows-logo.png" class="p-logo"><div><div class="p-title">${esc(j.title)}</div>
        <div class="p-sub">${D.label} · ${esc(where)} · ${esc(t.full_name)}</div></div></div>
      <table class="p-info">
        <tr><td>Service man</td><td>${esc(t.full_name)}${t.phone?' · '+esc(t.phone):''}</td><td>Department</td><td>${D.label}</td></tr>
        <tr><td>${site.work_date?'Day':D.one[0].toUpperCase()+D.one.slice(1)}</td><td>${esc(where)}</td><td>Docket / ref</td><td>${esc(j.ref_no||'—')}</td></tr>
        <tr><td>Sent</td><td>${fmtD(j.created_at)}</td><td>Status</td><td><b>${outcomeText(j)}</b>${j.completed?' '+fmtD(j.completed_at):''}</td></tr>
        ${site.address||site.contact?`<tr><td>Address</td><td>${esc(site.address||'—')}</td><td>Contact</td><td>${esc(site.contact||'—')}</td></tr>`:''}
      </table>
      <h2 class="p-h">Sheet ${marks.length?'(with mark-ups)':''}</h2>
      ${pages.map((src,i)=>`<div class="p-page ${i===0?'p-first':''}"><img src="${src}"><div class="p-pno">Page ${i+1} of ${pages.length}</div></div>`).join('')}
      <h2 class="p-h p-break">Conversation</h2>
      ${chat.length?chat.join(''):'<p><i>No messages.</i></p>'}
      <div class="p-foot">Printed ${new Date().toLocaleString('en-IE')} by ${esc((realMe||me).full_name)} · SashDash · Sean Doyle Windows Ltd</div>`;
    // wait for the photos & pages to load before opening the print dialog
    await Promise.all([...$('print-root').querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    $('toast').classList.add('hidden');
    document.body.classList.add('printing');
    setTimeout(()=>window.print(),50);
  }catch(e){ toast('Could not prepare print: '+(e.message||e),6000); }
}
window.addEventListener('afterprint',()=>{ document.body.classList.remove('printing'); $('print-root').innerHTML=''; });

// Show / hide the password being typed
function togglePw(btn){
  const inp=btn.parentElement.querySelector('input'); const show=inp.type==='password';
  inp.type=show?'text':'password'; btn.classList.toggle('on',show);
  btn.setAttribute('aria-label',show?'Hide password':'Show password'); btn.title=show?'Hide password':'Show password';
  inp.focus(); const v=inp.value; inp.value=''; inp.value=v;   // keep cursor at the end
}
